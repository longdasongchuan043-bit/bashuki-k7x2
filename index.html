        render();
      };
      row.appendChild(proposeBtn);
    } else {
      row.appendChild(el(`<div class="cheat-msg ng">好感度があと${80-aff}足りない。</div>`));
    }
    box.appendChild(row);
  });

  const close=el(`<button class="cheat-close">閉じる</button>`);
  close.onclick=()=>{romanceOpen=false;render();};
  box.appendChild(close);

  overlay.appendChild(box);
  return overlay;
}

/* ================= ADMISSION (入厩先の選択) ================= */

/* ================= 1歳馬の入厩と命名 ================= */
let admissionName='';
function yearlingPlaceholder(h){return `${h.damName}の${weekToDate(S.week).getUTCFullYear()-1}`;}
function validateHorseName(n,selfId){
  const v=(n||'').trim();
  if(v.length<2||v.length>9) return {ok:false,msg:'馬名は2〜9文字で入力してください'};
  if(!/^[ァ-ヶー]+$/.test(v)) return {ok:false,msg:'馬名は全角カタカナで入力してください(例:ミライノツバサ)'};
  const used=[...S.horses.filter(x=>x.id!==selfId&&!x.unnamed),...(S.retired||[])].some(x=>x.name===v);
  if(used) return {ok:false,msg:'同じ名前の馬がすでにいます'};
  if([...(S.npcs||[]),...(S.npcHall||[])].some(x=>x.name===v)) return {ok:false,msg:'他厩舎に同じ名前の馬がいます'};
  return {ok:true,msg:''};
}
function randomShortName(){
  for(let i=0;i<80;i++){
    const n=PREFIXES[randInt(0,PREFIXES.length-1)]+SUFFIXES[randInt(0,SUFFIXES.length-1)];
    if(n.length<=9 && validateHorseName(n,null).ok) return n;
  }
  return 'ミライノホシ';
}
function startPendingAdmission(){
  if(!S.pendingAdmissions) S.pendingAdmissions=[];
  while(S.pendingAdmissions.length>0){
    const id=S.pendingAdmissions.shift();
    const h=S.horses.find(x=>x.id===id);
    if(h){admissionName=h.presetName||'';openAdmission(h,'yearling');return true;}
  }
  return false;
}
function renderYearlingCard(h,gateNo){
  const coat=coatInfo(h.coat);
  const card=el(`<div class="horse-card"></div>`);
  const top=el(`<div class="horse-top tappable">
    <div class="horse-avatar">${horseIconSVG(h)}</div>
    <div style="flex:1">
      <div class="horse-name">${h.name}</div>
      <div class="horse-meta">${h.sex} / 1歳 / ${coat.name}${h.blaze?'・流星':''} / 育成牧場で育成中</div>
    </div>
  </div>`);
  top.onclick=()=>{horseDetail=h;render();};
  card.appendChild(top);
  card.appendChild(el(`<div class="pedigree-line">父:<b>${h.sireName}</b> 母:<b>${h.damName}</b> 母父:<b>${h.damSireName}</b>${h.nick?`<span class="nick-badge">◎${h.nick}</span>`:''}</div>`));
  card.appendChild(el(`<div class="pedigree-line">${traitLineHtml(h).trim()}${lineSummary(h)}${crossSummary(h)}</div>`));
  if(h.farm) card.appendChild(el(`<div class="pedigree-line">生産:${h.farm.name}(${SALE_FARM_LABEL[h.farm.size]}牧場)</div>`));
  if(h.uniqueSkill){
    const sk=uniqueSkillInfo(h.uniqueSkill);
    card.appendChild(el(`<div class="skill-badge">✨ 固有能力:${sk.name}<span class="skill-desc">${sk.desc}</span></div>`));
  }
  const bars=el(`<div class="bars"></div>`);
  bars.innerHTML=statBar('スピード',h.speed,'speed')+statBar('スタミナ',h.stamina,'stamina')+statBar('根性',h.guts,'guts')+statBar('ダート適性',h.dirtApt,'dirt')+statBar('芝適性',h.turfApt,'turf');
  card.appendChild(bars);
  card.appendChild(el(`<div class="warn-line" style="color:var(--gold-soft);">🐴 2歳になる1月1日に入厩します。そのとき馬名をつけて、預ける厩舎を決めましょう。</div>`));
  return card;
}

function openAdmission(h,mode){
  admissionHorseId=h.id;
  admissionMode=mode;
  render();
}

function admitHorse(h,t){
  const prev=trainerOf(h);
  if(admissionMode==='transfer'){
    S.money-=TRANSFER_FEE;
    addNews(`${h.name}を${prev?prev.stable:'前の厩舎'}から${t.stable}へ転厩させた(${yen(TRANSFER_FEE)})。`,'money-out');
  } else {
    if(h.unnamed){
      const old=h.name;
      h.name=admissionName.trim();
      h.unnamed=false;
      addNews(`${old}は「${h.name}」と命名された。`,'');
    }
    addNews(`${h.name}を${t.stable}(${t.name}調教師)に入厩させた。`,'');
  }
  h.trainerKey=t.key;
  if(horseRegion(h)!=='minami') ensureRegionRacesNow(horseRegion(h));
  if(horseRegion(h)==='jra'&&h.jraV2&&!h.fromLocal&&(h.jraRaces||0)===0&&admissionMode!=='transfer') addNews(`${h.name}は中央(JRA)の${t.stable}に入厩。中央でのデビューを目指す。`,'');
  admissionHorseId=null;
  toast(`${h.name}を${t.stable}に預けました`);
  if(!startPendingAdmission()) render();
}

function renderAdmissionModal(){
  const h=S.horses.find(x=>x.id===admissionHorseId);
  const isTransfer=admissionMode==='transfer';
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);
  box.appendChild(el(`<div class="modal-title">${isTransfer?'転厩先を選ぶ':h.unnamed?'馬名をつけて、入厩先を選ぶ':'入厩先を選ぶ'}</div>`));
  box.appendChild(el(`<div class="modal-sub">${h.name}(総合${Math.round(horseAvg(h))})を預ける調教師を決めよう。調教は調教師におまかせ。${isTransfer?`転厩には${yen(TRANSFER_FEE)}かかる。`:''}</div>`));
  let nameErr=null;
  if(h.unnamed){
    const nb=el(`<div class="name-box"><div class="name-label">🐴 ${h.sireName}×${h.damName}の2歳。馬名(全角カタカナ2〜9文字)</div>
      <div class="name-row"><input class="name-input" type="text" maxlength="9" placeholder="例:ミライノツバサ"><button class="ctl-btn name-rand">おまかせ</button></div>
      <div class="name-err"></div></div>`);
    const input=nb.querySelector('.name-input');
    nameErr=nb.querySelector('.name-err');
    input.value=admissionName;
    input.oninput=()=>{admissionName=input.value;nameErr.textContent='';};
    nb.querySelector('.name-rand').onclick=()=>{admissionName=randomShortName();input.value=admissionName;nameErr.textContent='';};
    box.appendChild(nb);
  }

  if(['start','yearling'].includes(admissionMode)){
    // 競走馬としての最初の入厩:地方(南関東)か中央(JRA)かを選ぶ
    const isJ=horseRegion(h)==='jra';
    const cw=el(`<div class="circuit-pick"><div class="sec-h">所属を選ぶ</div><div class="circuit-row"></div>
      <div class="circuit-note">${isJ?'中央(JRA)でデビュー。賞金は高い(新馬戦1着200万円)が、預託料も週6〜7万円と高く、相手も強い。2歳の新馬戦は6月から。':'地方(南関東)でデビュー。預託料が安く、C3クラスから一歩ずつ。3勝すれば中央のリステッドにも挑める。'}</div></div>`);
    [['minami','🏟 地方(南関東)'],['jra','🇯🇵 中央(JRA)']].forEach(([k,l])=>{
      const b=el(`<button class="ctl-btn ${(isJ?'jra':'minami')===k?'active':''}">${l}</button>`);
      b.onclick=()=>{if(k==='jra') setJraDebut(h); else {h.region=undefined;h.jraBase=0;h.jraWins=0;h.jraRaces=0;}render();};
      cw.querySelector('.circuit-row').appendChild(b);
    });
    box.appendChild(cw);
  }
  if(!isTransfer&&h.age>=2){
    const cb=el(`<div class="circuit-pick"><div class="sec-h">クラシック登録</div><div class="circuit-note">現実の競走馬と同じく、入厩時に3歳クラシック(皐月賞・日本ダービー・桜花賞・オークスなど)へ登録するかを選びます。登録料 ${yen(CLASSIC_REG_FEE)}。登録しなかった馬も、3歳の1〜3月なら追加登録(${yen(CLASSIC_ADD_FEE)})で出られます。</div><div class="circuit-row"></div></div>`);
    [['reg',`🎫 登録する(${yen(CLASSIC_REG_FEE)})`],['none','登録しない']].forEach(([k,l])=>{
      const on=(k==='reg'&&h.classicReg==='reg')||(k==='none'&&h.classicReg===null);
      const b=el(`<button class="ctl-btn ${on?'active':''}">${l}</button>`);
      b.onclick=()=>{
        if(k==='reg'){
          if(h.classicReg==='reg') return;
          if(S.money<CLASSIC_REG_FEE){toast('資金が足りません');return;}
          S.money-=CLASSIC_REG_FEE;h.classicReg='reg';
        } else h.classicReg=null;
        render();
      };
      cb.querySelector('.circuit-row').appendChild(b);
    });
    box.appendChild(cb);
  }
  TRAINERS.filter(t=>(t.region||'minami')===horseRegion(h)).forEach(t=>{
    const used=trainerCount(t.key,h.id);
    const free=Math.max(0,t.cap-used);
    const isCurrent=isTransfer && h.trainerKey===t.key;
    let blockReason='';
    if(isCurrent) blockReason='現在の厩舎';
    else if(!isTransfer&&h.age>=2&&h.classicReg===undefined) blockReason='先にクラシック登録を選ぶ';
    else if(free<=0) blockReason='満房';
    else if(horseAvg(h)<t.minAvg) blockReason=`素質不足(総合${t.minAvg}以上)`;
    else if(TRAINER_REP_REQ[t.key]&&(S.rep||0)<TRAINER_REP_REQ[t.key]) blockReason=`馬主の評判不足(評判${TRAINER_REP_REQ[t.key]}以上・現在${Math.round(S.rep)})`;
    else if(isTransfer && S.money<TRANSFER_FEE) blockReason='資金不足';

    const card=el(`<div class="trainer-card ${blockReason?'blocked':''}">
      <div class="trainer-head">
        <span class="trainer-name">${t.stable}<small>${t.name}調教師</small></span>
        <span class="trainer-skill">${'☆'.repeat(t.skill)}</span>
      </div>
      <div class="trainer-meta">得意:${TRAIN_STAT_LABEL[t.spec]} ・ 預託料 ${yen(t.fee)}/週 ・ 空き ${free}/${t.cap}</div>
      <div class="trainer-meta">出走方針:<b>${TRAINER_PLANS[t.key].label}</b> — ${TRAINER_PLANS[t.key].note}</div>
      <div class="trainer-desc">${t.desc}</div>
    </div>`);
    const btn=el(`<button class="buy-btn" ${blockReason?'disabled':''}>${blockReason||'ここに預ける'}</button>`);
    btn.onclick=()=>{
      if(blockReason) return;
      if(h.unnamed){
        const v=validateHorseName(admissionName,h.id);
        if(!v.ok){nameErr.textContent=v.msg;nameErr.scrollIntoView({block:'center'});return;}
      }
      admitHorse(h,t);
    };
    card.appendChild(btn);
    box.appendChild(card);
  });

  if(isTransfer){
    const cancel=el(`<button class="cheat-close">やめる</button>`);
    cancel.onclick=()=>{admissionHorseId=null;render();};
    box.appendChild(cancel);
  }
  // 逃げ道: 選べる調教師が1人もいないときは、馬を入厩待ちに戻して画面を閉じられるようにする
  if(!isTransfer&&!box.querySelector('.buy-btn:not([disabled])')){
    box.appendChild(el(`<div class="warn-line">今は預けられる調教師がいません。入厩待ちに戻して、あとで決めることもできます。</div>`));
    const later=el(`<button class="cheat-close">入厩待ちに戻す</button>`);
    later.onclick=()=>{if(!S.pendingAdmissions.includes(h.id))S.pendingAdmissions.push(h.id);admissionHorseId=null;toast(`${h.name}は入厩待ちに戻しました`);render();};
    box.appendChild(later);
  }
  overlay.appendChild(box);
  return overlay;
}

/* ================= HORSE DETAIL ================= */
function renderHorseDetailModal(){
  const h=horseDetail;
  const coat=coatInfo(h.coat);
  const cls=horseClass(h);
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);

  box.appendChild(el(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
    <div class="horse-avatar" style="width:44px;height:44px;">${horseIconSVG(h)}</div>
    <div>
      <div class="horse-title">『${h.title}』</div>
      <div class="modal-title" style="margin:0;">${h.name}</div>
    </div>
  </div>`));
  box.appendChild(el(`<div class="modal-sub">${h.sex} / ${h.age}歳 / ${coat.name}${h.blaze?'・流星':''} / 所属:${REGIONS[horseRegion(h)].name} / 現級:${horseClassLabel(h)} / 成長型:<b>${growthLabelFor(h)}</b></div>`));
  box.appendChild(el(`<div class="pedigree-line" style="padding-left:0;margin-bottom:10px;">父:<b>${h.sireName}</b> 母:<b>${h.damName}</b> 母父:<b>${h.damSireName}</b>${h.nick?`<span class="nick-badge">◎${h.nick}</span>`:''}</div>`));
  box.appendChild(el(`<div class="pedigree-line" style="padding-left:0;margin-bottom:10px;">脚質:<b>${h.runStyle}</b> 適距離:<b>${optDistRange(h)}</b>${traitLineHtml(h)}${h.injury>0?` <span style="color:var(--loss)">🩹療養中(あと${h.injury}週)</span>`:''}</div>`));
  box.appendChild(el(renderPedigreeHtml(h)));

  if(h.uniqueSkill){
    const sk=uniqueSkillInfo(h.uniqueSkill);
    box.appendChild(el(`<div class="skill-badge" style="margin-left:0;margin-right:0;">✨ 固有能力:${sk.name}<span class="skill-desc">${sk.desc}</span></div>`));
  }

  const bars=el(`<div style="margin:10px 0;"></div>`);
  bars.innerHTML=statBar('スピード',h.speed,'speed')+statBar('スタミナ',h.stamina,'stamina')+statBar('根性',h.guts,'guts')+statBar('ダート適性',h.dirtApt,'dirt')+statBar('芝適性',h.turfApt,'turf')+(h.condition!==undefined?statBar('状態',h.condition,'cond'):'');
  box.appendChild(bars);

  box.appendChild(el(`<div class="jockey-label">通算成績:${h.wins}勝${h.top3>h.wins?'・複勝'+h.top3:''}(${h.races}戦)</div>`));

  const histWrap=el(`<div class="result-table-wrap" style="margin-top:6px;"></div>`);
  const rows=[];
  if(h.pastHistory && h.pastHistory.length>0){
    rows.push(`<tr><td colspan="4" style="color:var(--text-dim);font-size:11px;padding-top:8px;">— 中央(JRA)在籍時代 —</td></tr>`);
    h.pastHistory.forEach(p=>{
      rows.push(`<tr><td>${p.label}</td><td>${p.rank}着</td><td>全${p.fieldSize}頭</td><td>-</td></tr>`);
    });
  }
  if(h.history && h.history.length>0){
    rows.push(`<tr><td colspan="4" style="color:var(--text-dim);font-size:11px;padding-top:8px;">— 地方競馬 通算 —</td></tr>`);
    [...h.history].reverse().forEach(r=>{
      const medal=r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':`${r.rank}着`;
      rows.push(`<tr><td>${calendarShort(r.week)} ${r.raceName}${r.dist?` <small>${r.dist}m</small>`:''}</td><td>${medal}</td><td>全${r.fieldSize}頭</td><td>${r.prize?yen(r.prize):'-'}</td></tr>`);
    });
  }
  if(rows.length===0){
    histWrap.appendChild(el(`<div class="empty-msg" style="padding:20px 8px;">まだ出走記録がありません。</div>`));
  } else {
    const tbl=el(`<table class="result-table"><thead><tr><th>レース</th><th>着順</th><th>頭数</th><th>賞金</th></tr></thead><tbody>${rows.join('')}</tbody></table>`);
    histWrap.appendChild(tbl);
  }
  box.appendChild(histWrap);

  const rvs=Object.entries(h.rivals||{}).filter(([id,r])=>r.status||r.met>=2).sort((a,b)=>(b[1].status?1:0)-(a[1].status?1:0)||b[1].met-a[1].met).slice(0,6);
  if(rvs.length){
    box.appendChild(el(`<div class="sec-h" style="margin-top:12px;">⚔ よく戦う相手</div>`));
    rvs.forEach(([id,rc])=>{
      const n=(S.npcs||[]).find(x=>x.id===id);
      const row=el(`<button class="npc-row"><span class="npc-main"><b>${rc.name}</b>${rc.status?`<span class="rv-tag ${rc.status}">${RIVAL_LABEL[rc.status]}</span>`:''}<small>対戦${rc.met}回:${h.name}の${rc.behind}勝${rc.ahead}敗・競り合い${rc.close}回${n?` ・ 現在${n.sex}${n.age}・${n.races}戦${n.wins}勝`:'(引退)'}</small></span>${n?'<span class="mi-arrow">›</span>':''}</button>`);
      if(n) row.onclick=()=>{npcDetailId=id;render();};
      box.appendChild(row);
    });
  }
  if(S.horses.some(x=>x.id===h.id) && h.age>=2){
    box.appendChild(el(`<div class="sec-h" style="margin-top:12px;">この馬の操作</div>`));
    box.appendChild(renderHorseActions(h));
  }
  const close=el(`<button class="cheat-close" style="margin-top:10px;">閉じる</button>`);
  close.onclick=()=>{horseDetail=null;render();};
  box.appendChild(close);

  overlay.appendChild(box);
  return overlay;
}

/* ================= OWNER CHEAT PANEL ================= */
function renderCheatPanel(){
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box cheat-box"></div>`);
  box.appendChild(el(`<div class="modal-title">オーナー権限</div>`));
  box.appendChild(el(`<div class="modal-sub">コードを入力してください(大文字小文字は区別しません)</div>`));

  const input=el(`<input class="cheat-input" type="text" placeholder="コードを入力" autocomplete="off" autocapitalize="off">`);
  box.appendChild(input);

  const msg=el(`<div class="cheat-msg ${cheatMessageOk?'ok':'ng'}">${cheatMessage}</div>`);
  box.appendChild(msg);

  const apply=el(`<button class="modal-next">適用する</button>`);
  apply.onclick=()=>{
    const code=(input.value||'').trim().toUpperCase();
    const entry=CHEAT_CODES[code];
    if(entry){
      entry.apply();
      addNews(`オーナー権限コードを適用:${entry.label}`,'money-in');
      cheatMessage=`✔ 適用しました:${entry.label}`;
      toast('オーナー権限を適用しました');
      cheatMessageOk=true;
    } else {
      cheatMessage='✘ 無効なコードです。';
      cheatMessageOk=false;
    }
    render();
  };
  box.appendChild(apply);

  const close=el(`<button class="cheat-close">閉じる</button>`);
  close.onclick=()=>{cheatPanelOpen=false;cheatMessage='';render();};
  box.appendChild(close);

  overlay.appendChild(box);
  setTimeout(()=>input.focus(),50);
  return overlay;
}

  const wrap=el(`<div style="padding:60px 24px;"></div>`);

}

})();
