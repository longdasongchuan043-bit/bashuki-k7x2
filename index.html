  speed:  ["疾風の刃","閃光","韋駄天","一陣の風","稲妻の跡","疾走する矢"],
  stamina:["不屈の心臓","鋼の脚","終わらぬ足音","粘り腰の求道者","鉄人"],
  guts:   ["闘魂の化身","不撓不屈","荒武者","炎の魂","負けじ魂"],
  elite:  ["黄金の逸材","伝説の卵","時代を変える器","選ばれし血脈"]
};
function assignTitle(h){
  const stats={speed:h.speed,stamina:h.stamina,guts:h.guts};
  const dom=Object.keys(stats).reduce((a,b)=>stats[a]>=stats[b]?a:b);
  const avg=(h.speed+h.stamina+h.guts)/3;
  const pool=(avg>=65 && Math.random()<0.4)?TITLE_POOLS.elite:TITLE_POOLS[dom];
  return pool[randInt(0,pool.length-1)];
}

/* 固有能力。ごく稀に生まれつき特別な力を宿す仔がいる。 */
const UNIQUE_SKILLS=[
  {key:'nige_king',   name:'逃げ切りの帝王',   desc:'逃げ型騎手との相性が抜群。レースで大幅強化。'},
  {key:'last_spurt',  name:'ラストスパート',   desc:'重賞・中央・海外の大舞台で本領を発揮する。'},
  {key:'monster_legs',name:'怪物の脚',         desc:'常にレースで安定した上乗せ効果を発揮。'},
  {key:'turf_prodigy',name:'芝の申し子',       desc:'芝コースになると力が跳ね上がる。'},
  {key:'iron_will',   name:'不屈の闘志',       desc:'状態が悪い時ほど粘りを見せる。'},
  {key:'veteran_soul',name:'百戦錬磨の魂',     desc:'レース経験を積むほど力を増していく。'},
];
const UNIQUE_SKILL_RATE=0.04;
function rollUniqueSkill(){
  return Math.random()<UNIQUE_SKILL_RATE ? UNIQUE_SKILLS[randInt(0,UNIQUE_SKILLS.length-1)].key : null;
}
function uniqueSkillInfo(key){return UNIQUE_SKILLS.find(s=>s.key===key);}
function uniqueSkillBonus(h,r,jockeyStyle){
  if(!h.uniqueSkill) return 0;
  switch(h.uniqueSkill){
    case 'nige_king':    return jockeyStyle==='逃げ型'?10:0;
    case 'last_spurt':   return ['重賞','中央','中央芝','海外','海外芝','地方芝'].includes(r.classKey)?14:0;
    case 'monster_legs': return 12;
    case 'turf_prodigy': return (r.surface==='turf')?10:0;
    case 'iron_will':    return h.condition<50?10:0;
    case 'veteran_soul': return clamp(h.races*0.6,0,15);
    default: return 0;
  }
}

/* ================= 馬主の評判(徳)とファン満足度 =================
   評判:馬を大切にする馬主か。早めの引退・乗馬・誘導馬・功労馬で上がり、高齢馬の酷使・状態の悪い出走・故障で下がる。
   ファン満足度:勝利・重賞・G1・引退式で上がり、故障や馬を手放すと下がる。
   評判が足りないと名門厩舎に預けられず、リーディング級の騎手に騎乗を断られる。 */
function ensureRep(){if(S.rep==null)S.rep=50;if(S.fans==null)S.fans=30;if(!S.repLog)S.repLog=[];}
function adjustRep(dRep,dFans,reason){
  ensureRep();
  S.rep=clamp(Math.round((S.rep+dRep)*10)/10,0,100);
  S.fans=clamp(Math.round((S.fans+dFans)*10)/10,0,100);
  if(reason&&(Math.abs(dRep)>=1||Math.abs(dFans)>=1)){
    S.repLog.push({week:S.week,dRep,dFans,reason});
    if(S.repLog.length>60) S.repLog.shift();
  }
}
function repLabel(v){return v>=80?'名馬主':v>=65?'信頼される馬主':v>=45?'普通':v>=30?'評判いまひとつ':'悪評';}
const TRAINER_REP_REQ={t1:65,t2:45,t3:45,tj2:60};
const JOCKEY_REP_REQ=j=>j.skill>=5?{rep:60,fans:55}:j.skill>=4?{rep:45,fans:40}:null;
/* リーディング級の騎手は、評判かファン満足度のどちらかが基準に届けば乗ってくれる(配偶者は別) */
function jockeyAvailable(j){
  ensureRep();
  if(j.retired) return {ok:false,reason:'引退'};
  if(j.foreign&&!jockeyInSeason(j)) return {ok:false,reason:'短期免許の期間外'};
  if(S.spouseKey===j.key) return {ok:true};
  const q=JOCKEY_REP_REQ(j);
  if(!q) return {ok:true};
  if(S.rep>=q.rep||S.fans>=q.fans) return {ok:true};
  return {ok:false,reason:`評判${q.rep}かファン${q.fans}以上が必要`};
}

function careerPenalty(h){
  // ボロボロになるまで走らせた/早めに引退させた
  let p=0,why=[];
  if(h.age>=8){p-=3;why.push('高齢まで走らせた');}
  if(h.races>=50){p-=2;why.push(`${h.races}戦も使った`);}
  if(h.age<=6&&h.races<40){p+=1;why.push('余力を残して引退');}
  return {p,why};
}
function applyCareer(h,c,auto){
  const money=c.money(h);
  const pen=careerPenalty(h);
  const dRep=c.rep+(c.key==='sell'&&h.age>=7?-3:0)+pen.p;
  let dFans=c.fans;
  const star=(h.history||[]).some(x=>x.rank===1&&isG1Grade(x.grade))||h.wins>=10;
  if(star&&c.key!=='sell') dFans+=3; // 引退式
  S.money+=Math.round(money*shareOf(h));
  S.horses=S.horses.filter(x=>x.id!==h.id);
  if(c.key==='sell') makeNpcFromHorse(h,'local',{type:'sold',label:'あなたが手放した馬'});
  else checkHallOfFame(h,auto?null:'ui');
  if(horseDetail&&horseDetail.id===h.id) horseDetail=null;
  if(!S.secondCareers) S.secondCareers=[];
  S.secondCareers.push({name:h.name,sex:h.sex,age:h.age,career:c.key,careerName:c.name,week:S.week,races:h.races,wins:h.wins,
    g1:(h.history||[]).filter(x=>x.rank===1&&isG1Grade(x.grade)).length});
  adjustRep(dRep,dFans,`${h.name}:${c.name}${pen.why.length?'('+pen.why.join('・')+')':''}`);
  addNews(`${h.name}(${h.age}歳・${h.races}戦${h.wins}勝)が引退し、${c.name}${c.key==='sell'?'として他の馬主の元へ':'の道へ'}。${star&&c.key!=='sell'?'引退式が行われ、多くのファンが別れを惜しんだ。':''}${money?` ${money>0?'+':''}${yen(money)}`:''}`,money>=0?'money-in':'money-out');
  if(!auto) toast(`${h.name}:${c.name}(評判${dRep>=0?'+':''}${dRep})`);
  return {dRep,dFans,money};
}

function supporterLevel(k){return (S.supporters||{})[k]||0;}
function supporterFees(){return SUPPORTERS.reduce((a,s)=>a+s.fee[supporterLevel(s.key)],0);}
// 馬ごと・サポーターごとに安定した見立て(レベルが高いほど正確)
function seededNoise(str){let x=0;for(let i=0;i<str.length;i++)x=(x*31+str.charCodeAt(i))>>>0;x=(x^(x>>>13))*1274126177>>>0;return ((x%10000)/10000-0.5)*2;}
function perceive(h,key,stat,v){
  const lv=supporterLevel(key);const sig=[0,13,7,3][lv];
  return clamp(Math.round(v+seededNoise(h.id+key+stat+lv)*sig),1,100);
}

function supporterAdvice(h){
  const out=[];
  const priceOk=h.price>0&&!h.homebred;
  if(supporterLevel('soma')){
    const sp=perceive(h,'soma','sp',h.speed),st=perceive(h,'soma','st',h.stamina),gu=perceive(h,'soma','gu',h.guts),dt=perceive(h,'soma','dt',h.dirtApt),tf=perceive(h,'soma','tf',h.turfApt);
    const g=[],b=[];
    if(sp>=68) g.push('トモ(後ろ脚)の張りが抜群。スピードがありそう'); else if(sp<=42) b.push('トモが寂しく、スピードはもう一つ');
    if(st>=68) g.push('胸が深く心肺機能が高そう。長めの距離でも'); else if(st<=42) b.push('胴が詰まっていて、距離はもたないかも');
    if(gu>=68) g.push('目つきが鋭く、勝負根性がありそう'); else if(gu<=42) b.push('おっとりした顔つきで、競り合いは弱いかも');
    if(dt>=75) g.push('骨量があってパワー型。ダート向き'); if(tf>=75) g.push('繋ぎが柔らかく、芝の走りに合う');

    const avg=(sp+st+gu)/3;
    out.push({s:SUPPORTERS[0],lv:supporterLevel('soma'),good:g,bad:b,stars:clamp(Math.round((avg-25)/12),1,5),
      note:`見立て:スピード${sp} スタミナ${st} 根性${gu}前後${supporterLevel('soma')<3?'(多少の誤差あり)':''}`});
  }
  if(supporterLevel('ketto')){
    const g=[],b=[];
    const fl=sireLineOf(h.sireName),ml=sireLineOf(h.damSireName);
    if(SIRE_NOTES[h.sireName]) g.push(`父${h.sireName}は${SIRE_NOTES[h.sireName]}`);
    if(fl&&ml&&fl.big===ml.big) b.push(`父系と母父系が同じ${fl.big}で、血が偏り気味`);
    if(h.nick) g.push(`配合はニックス「${h.nick}」`);
    ensurePedFict(h);
    const cr=pedigreeCrosses(buildPedigree(h)).filter(c=>c.both);
    const close=cr.filter(c=>c.closest<=7);
    if(cr.some(c=>c.gens.length===2&&[...c.gens].sort().join()==='3,4')) g.push('奇跡の血量(3×4)を持つ。能力の爆発に期待');
    if(close.length) b.push(`${close.map(c=>c.name+' '+c.gens.join('×')).join('、')}と濃いクロス。気性・体質に注意`);
    const opt=h.optDist;
    g.push(`血統的な適距離は${opt-200}〜${opt+200}m前後`);
    out.push({s:SUPPORTERS[1],lv:supporterLevel('ketto'),good:g,bad:b,stars:clamp(3+(h.nick?1:0)+(close.length?-1:0)+(SIRE_NOTES[h.sireName]?0:0),1,5)});
  }
  if(supporterLevel('vet')){
    const fr=perceive(h,'vet','fr',h.frail==null?35:h.frail),tp=perceive(h,'vet','tp',h.temper==null?35:h.temper);
    const g=[],b=[];
    if(fr<=35) g.push('脚元がしっかりしていて丈夫。使い込める'); else if(fr>=60) b.push('管骨が細めで体質が弱そう。使い詰めは禁物');
    if(tp<=35) g.push('おとなしく扱いやすい。乗馬や誘導馬にも向く'); else if(tp>=60) b.push('気性が激しい。出遅れや掛かりに注意');
    if(!g.length&&!b.length) g.push('脚元・気性とも目立った問題はなし');
    out.push({s:SUPPORTERS[2],lv:supporterLevel('vet'),good:g,bad:b,stars:clamp(Math.round((100-fr+100-tp)/40),1,5)});
  }
  // 相場観(相馬眼の見立てをもとに)
  let verdict=null;
  if(out.length&&priceOk){
    const sp=supporterLevel('soma')?perceive(h,'soma','sp',h.speed):null;
    const est=sp==null?null:((perceive(h,'soma','sp',h.speed)+perceive(h,'soma','st',h.stamina)+perceive(h,'soma','gu',h.guts))/3);
    if(est!=null){
      // セリ(1歳・海外)は高額相場、通常の市場は能力なりの相場で見る
      const isSale=!!(h.saleKind||h.foreignPrice||h.age<=1);
      const summer=(S.summerSaleMarket||[]).includes(h);
      let fair=isSale?3000000*Math.exp((est-35)/9):h.price*Math.pow(est/Math.max(1,horseAvg(h)),3)*(summer?1/0.55:1);
      fair=Math.round(fair/10000)*10000;
      const r=h.price/Math.max(1,fair);
      verdict=r<0.7?{t:'割安。買い',c:'good'}:r<1.3?{t:'価格は妥当',c:''}:{t:'割高。見送りも',c:'bad'};
      verdict.fair=fair;
    }
  }
  return {list:out,verdict};
}

    S.lineTrend[l.key]=Math.round(v*100)/100;return {n:l.name,d:v-old};});
  const up=moves.slice().sort((a,b)=>b.d-a.d)[0],dn=moves.slice().sort((a,b)=>a.d-b.d)[0];
  report.push({type:'notice',text:`📈 父系の流行:${up.n}が人気上昇(${up.d>=0?'+':''}${Math.round(up.d*100)}%)。${dn.n}は下降気味(${Math.round(dn.d*100)}%)。`});

function matingPreview(s,m){
  const fp=foalPedigree(s.name,m);
  const tmp={...fp};
  const cr=pedigreeCrosses(buildPedigree(tmp));
  const both=cr.filter(c=>c.both);
  const close=both.filter(c=>c.closest<=8);
  const ib=close.reduce((a,c)=>a+c.pct,0);
  const nick=findNick(lineKeyOf(s.name),lineKeyOf(m.sireName));
  const miracle=both.some(c=>c.gens.length===2&&[...c.gens].sort().join()==='3,4');
  const ok=pedOK(cr)&&s.name!==m.sireName&&!(s.own&&s.rec.damName===m.name);
  const sq=stallionQ(s)*lineTrendOf(lineKeyOf(s.name)),mq=mareQ(m);
  const exp=0.55*sq+0.45*mq+(nick?0.04:0)+(miracle?0.03:0)-(ib>18.75?0.02:0);
  return {fp,both,close,ib,nick,miracle,ok,sq,mq,exp,stars:clamp(Math.round((exp-0.3)/0.11),1,5)};
}

  const mTurf=(m.history||[]).filter(x=>x.rank<=3&&/芝|JRA|海外/.test(x.raceName)).length;
  if(s.surf==='d'&&mTurf>mDirt+1) b.push('父はダート型、母は芝で好走。適性がちぐはぐかも');

function homebredValue(h){

}

}

  h.growth=null;h.growth=pickGrowth(h.sireName);

/* ---- 牝系(母系の一族)と自家種牡馬の成績 ---- */
function famOf(key){

  return S.families[key];
}
function famName(x){return `${x.family||x.name}牝系`;}
function famRep(m){const f=(S.families||{})[m.family||m.name];return f?Math.min(0.08,f.gw*0.02):0;}
// 出走結果を牝系・自家種牡馬の集計に加える(重賞勝ちが多い一族ほど、その母馬の評価が上がる)
function lineageStatAdd(h,f,r){
  const yi=calendarParts(S.week).yearIndex;
  if(h.family){
    const fam=famOf(h.family);
    fam.runs++;if(f.rank<=3)fam.top3++;
    if(f.rank===1&&r.grade){
      fam.gw++;
      (fam.hits=fam.hits||[]).push({h:h.name,r:r.name,y:yi});if(fam.hits.length>20)fam.hits.shift();
      if([3,6,10,15].includes(fam.gw)) addNews(`🌳 ${fam.root}牝系から重賞馬が出た(重賞${fam.gw}勝)。繁殖牝馬としての評価が上がりそう。`,'');
    }
  }
  if((S.retired||[]).some(x=>x.kind==='sire'&&x.name===h.sireName)){
    S.sireStats=S.sireStats||{};
    const st=S.sireStats[h.sireName]||(S.sireStats[h.sireName]={runs:0,top3:0,wins:0,gw:0,yr:{}});
    const y=st.yr[yi]||(st.yr[yi]={gw:0,w:0});
    st.runs++;if(f.rank<=3)st.top3++;
    if(f.rank===1){st.wins++;y.w++;}
    if(f.rank===1&&r.grade){st.gw++;y.gw++;}
  }
}
function sireYearNotice(report,yi){
  const rows=Object.entries(S.sireStats||{}).map(([n,s])=>({n,y:(s.yr||{})[yi]||{gw:0,w:0}})).filter(x=>x.y.gw||x.y.w);

function lineageRankingEl(){

/* 毎週の牧場の処理(出産・入厩待ちの移動) */
function farmWeekly(report){

  ownedMares().forEach(m=>{
    if(m.pregnant&&S.week>=m.pregnant.due){
      if(Math.random()<0.93){
        const f=makeFoal(m);
        S.homebreds.push(f);
        if(!m.produce) m.produce=[];
        m.produce.push({id:f.id,sire:m.pregnant.sire,y:calendarParts(S.week).yearIndex,sex:f.sex});
        report.push({type:'notice',text:`🍼 ${m.name}が${f.sex==='牡'?'牡':'牝'}馬を出産!父は${m.pregnant.sire}。「牧場」タブで確認できる。`});
        addNews(`${m.name}に${m.pregnant.sire}の${f.sex}駒が誕生。`,'');
      } else {
        report.push({type:'notice',text:`😢 ${m.name}は流産してしまった(父${m.pregnant.sire})。今年もまた種付けができる。`});
      }
      m.pregnant=null;
    }
  });
  // 2歳になって入厩を待っている自家生産馬は、厩舎に空きができたら入厩
  S.homebreds.filter(h=>h.age>=2&&h.plan==='keep').forEach(h=>{
    if(S.horses.length<STABLE_CAP){
      S.homebreds=S.homebreds.filter(x=>x.id!==h.id);
      S.horses.push(h);
      if(!S.pendingAdmissions.includes(h.id)) S.pendingAdmissions.push(h.id);
      report.push({type:'notice',text:`🏠 自家生産の${h.name}が2歳になり、入厩の準備ができた。馬名をつけて厩舎を決めよう。`});
    }
  });
}
function farmYearEnd(report){
  (S.homebreds||[]).forEach(h=>{h.age+=1;});
  const wait=(S.homebreds||[]).filter(h=>h.age===2&&h.plan==='keep');
  if(wait.length&&S.horses.length+wait.length>STABLE_CAP) report.push({type:'notice',text:`🏠 自家生産の${wait.map(h=>h.name).join('、')}が2歳に。厩舎(所有馬${STABLE_CAP}頭まで)に空きができ次第、入厩します。`});

    const noUnsold=kind==='second'?0.9:0.85;
    if(Math.random()<noUnsold){
      const hammer=Math.max(kind==='second'?1500000:2000000,Math.round(base*(0.65+Math.random()*0.8)/100000)*100000);
      const fee=Math.round(hammer*SALE_COMMISSION);

      const m=(S.retired||[]).find(r=>r.id===h.mareId);

/* ================= 成長型(早熟・普通・晩成・持続)と衰え =================
   父の産駒傾向をもとに成長型が決まる。1月1日と7月1日に、年齢と成長型に応じて能力が伸びたり衰えたりする。 */
const GROWTH_TYPES={
  early:{label:'早熟',d:{2:[2,1],3:[2,0],4:[-1,-2],5:[-3,-4],6:[-4,-4],7:[-5,-5],8:[-6,-6]},start:4},
  normal:{label:'普通',d:{2:[2,2],3:[3,3],4:[2,1],5:[0,-1],6:[-2,-3],7:[-4,-5],8:[-5,-6]},start:0},
  late:{label:'晩成',d:{2:[1,2],3:[3,4],4:[4,3],5:[2,1],6:[0,-1],7:[-3,-4],8:[-5,-5]},start:-5},
  long:{label:'持続',d:{2:[2,2],3:[3,2],4:[1,1],5:[1,0],6:[0,-1],7:[-1,-2],8:[-3,-3]},start:-1},
};
// 実際の産駒傾向(一般的な評価)をもとにした父ごとの成長型の出やすさ [早熟,普通,晩成,持続]
const SIRE_GROWTH={
  'ハーツクライ':[0,2,6,2],'ステイゴールド':[0,2,5,3],'ゴールドシップ':[0,2,6,2],'オルフェーヴル':[0,3,5,2],'キタサンブラック':[0,4,4,2],'イクイノックス':[1,5,3,1],
  'ダイワメジャー':[6,3,0,1],'ロードカナロア':[4,5,0,1],'ドレフォン':[5,4,0,1],'ヘニーヒューズ':[6,3,0,1],'ミッキーアイル':[5,4,0,1],'アドマイヤマーズ':[4,5,1,0],
  'ディープインパクト':[2,6,1,1],'キズナ':[2,5,2,1],'コントレイル':[2,5,2,1],'エピファネイア':[2,5,2,1],'モーリス':[1,4,4,1],'スワーヴリチャード':[1,4,4,1],
  'キングカメハメハ':[2,5,1,2],'ルーラーシップ':[1,4,4,1],'ドゥラメンテ':[1,5,3,1],'タイトルホルダー':[0,3,5,2],'サトノダイヤモンド':[0,4,5,1],'フィエールマン':[0,3,5,2],
  'シニスターミニスター':[1,4,1,4],'ホッコータルマエ':[0,4,3,3],'ゴールドアリュール':[1,4,2,3],'コパノリッキー':[1,3,2,4],'エスポワールシチー':[0,3,3,4],
  'パイロ':[2,4,1,3],'アメリカンファラオ':[3,5,0,2],'カリフォルニアクローム':[0,4,3,3],'ジャスタウェイ':[0,3,5,2],'シンボリクリスエス':[1,4,4,1],
  'Into Mischief':[6,3,0,1],'Tapit':[2,5,1,2],'Curlin':[0,4,4,2],'Gun Runner':[0,4,4,2],'Justify':[3,5,1,1],'Frankel':[2,5,2,1],'Dubawi':[1,5,2,2],'Sea the Stars':[0,4,5,1],'Kingman':[3,5,1,1],
};
function pickGrowth(sireName){
  const w=SIRE_GROWTH[sireName]||[2,5,2,1];
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  const keys=['early','normal','late','long'];
  for(let i=0;i<4;i++){r-=w[i];if(r<0)return keys[i];}
  return 'normal';
}
function ensureGrowth(h){
  if(h.growth) return;
  h.growth=pickGrowth(h.sireName);
  // 生まれ持った成長型ぶん、デビュー時の完成度が違う(早熟は2歳から動け、晩成は2歳時点では未完成)
  if(h.age<=2&&h.speed<150){
    const s=GROWTH_TYPES[h.growth].start;
    ['speed','stamina','guts'].forEach(k=>h[k]=clamp(h[k]+s,10,99));
  }
}
// 半年ごとの成長・衰え。half=0(1月1日)、1(7月1日)
function applyGrowthStep(h,half){
  ensureGrowth(h);
  if(h.speed>150||h.age<2) return null; // オーナー権限の馬は対象外、1歳以下は育成中
  const g=GROWTH_TYPES[h.growth];
  const a=Math.min(8,h.age);
  const [sp,st]=g.d[a]||g.d[8];
  const half_=v=>Math.round(v/2+(Math.random()-0.5));
  const dS=half_(sp),dT=half_(st),dG=half_(sp);
  // 体質が弱い馬・使い込まれた馬は衰えが早い
  const wear=(h.races>=40?1:0)+((h.frail||35)>=60&&a>=5?1:0);
  const f=v=>v<0?v-wear:v;
  const before=[h.speed,h.stamina,h.guts];
  h.speed=clamp(h.speed+f(dS),10,99);h.stamina=clamp(h.stamina+f(dT),10,99);h.guts=clamp(h.guts+f(dG),10,99);
  const diff=h.speed+h.stamina+h.guts-before.reduce((x,y)=>x+y,0);
  h.optDist=computeOptDist(h);
  return diff;
}
function growthLabelFor(h){
  ensureGrowth(h);
  const lv=supporterLevel('soma');
  // 4歳を過ぎれば誰の目にも成長型がわかる。それまでは相馬眼の見立て(Lv1は外れることも)
  if(h.age>=5||lv>=2) return GROWTH_TYPES[h.growth].label;
  if(lv===1){const keys=Object.keys(GROWTH_TYPES);const n=seededNoise(h.id+'gr');return n>0.4?GROWTH_TYPES[keys[Math.floor((n+1)*10)%4]].label+'?':GROWTH_TYPES[h.growth].label+'?';}
  return '不明';
}
function growthSeasonReport(report,half){
  const lines=[];
  S.horses.forEach(h=>{
    const d=applyGrowthStep(h,half);
    if(d==null) return;
    if(d>=3) lines.push(`📈 ${h.name}(${h.age}歳)が成長。能力合計+${d}`);
    else if(d<=-3) lines.push(`📉 ${h.name}(${h.age}歳)に衰えが見える。能力合計${d}`);
  });
  if(lines.length) report.push({type:'notice',text:`${half===0?'年明け':'夏'}の成長具合:<br>${lines.join('<br>')}`});
}

/* ================= 繁殖馬セール(12月) =================
   引退した牝馬や良血の未出走牝馬が、繁殖牝馬として売られる。受胎済み(お腹に子がいる)の馬もいる。
   価格は数十万円〜数億円。 */
const MARE_TIERS=[
  {k:'elite',w:1,label:'👑 G1馬・名牝の近親',qr:[0.72,0.95],price:[3000,20000],skew:1.8,unit:100},
  {k:'good',w:3,label:'⭐ 重賞勝ち・良血',qr:[0.55,0.78],price:[800,4000],skew:1.5,unit:50},
  {k:'mid',w:5,label:'中央・地方で勝ち上がり',qr:[0.38,0.6],price:[150,900],skew:1.3,unit:10},
  {k:'low',w:4,label:'未勝利・地味な血統',qr:[0.2,0.42],price:[30,200],skew:1.2,unit:5},
];
function makeMareLot(){
  const tw=MARE_TIERS.reduce((a,t)=>a+t.w,0);let r=Math.random()*tw,t=MARE_TIERS[0];
  for(const x of MARE_TIERS){r-=x.w;if(r<0){t=x;break;}}
  const h=makeHorse(randInt(4,13),false);
  h.sex='牝';h.mareLot=true;h.tier=t.k;h.saleNote=t.label;
  h.sireName=t.k==='elite'||t.k==='good'?pickFrom(STALLIONS.slice(0,22)).name:pickFrom([...REAL_SIRES,...STALLIONS.map(s=>s.name)]);
  h.pedFict=null;h.damReal=false;ensurePedFict(h);h.ibApplied=false;refreshHorseTraits(h);
  const q=t.qr[0]+Math.random()*(t.qr[1]-t.qr[0]);
  h.q=q;
  const lv=t.k==='elite'?[8,25]:t.k==='good'?[6,22]:t.k==='mid'?[4,20]:[0,12];
  h.races=randInt(lv[0],lv[1]);
  h.wins=t.k==='low'?(Math.random()<0.6?0:1):t.k==='mid'?randInt(1,4):randInt(2,7);
  h.wins=Math.min(h.wins,h.races);h.top3=Math.min(h.races,h.wins+randInt(0,6));
  const avg=30+q*45;['speed','stamina','guts'].forEach(k=>h[k]=clamp(Math.round(avg+randInt(-8,8)),15,95));
  h.g1=t.k==='elite'&&Math.random()<0.45?1:0;h.graded=t.k==='elite'?randInt(1,4):t.k==='good'?randInt(0,2):0;
  if(h.g1) h.saleNote+=' / G1勝ち';
  else if(h.graded) h.saleNote+=` / 重賞${h.graded}勝`;
  let price=manYen(t.price[0],t.price[1],t.skew,t.unit);
  // 受胎済み(在胎馬)の上場。お腹の子の父の格で価格が上がる
  if(h.age<=11&&Math.random()<0.55){
    const pool=t.k==='elite'?STALLIONS.slice(0,12):t.k==='good'?STALLIONS.slice(5,30):STALLIONS.slice(15);
    const s=pickFrom(pool);
    h.inFoal={sire:s.name,fee:s.fee};
    price+=Math.round(s.fee*0.6/100000)*100000;
  }
  h.price=Math.max(300000,price);
  h.farm=saleFarm(t.k==='elite'?'big':t.k==='good'?'mid':Math.random()<0.5?'small':'tiny');
  h.name=uniqueHorseName();
  return h;
}
function buyMareLot(h,price){
  // 落札した繁殖牝馬は自分の牧場へ
  const rec={id:uid(),kind:'dam',name:h.name,sex:'牝',age:h.age,coat:h.coat,blaze:h.blaze,title:h.title,
    sireName:h.sireName,damName:h.damName,damSireName:h.damSireName,pedFict:h.pedFict,damReal:false,fromId:h.id,
    speed:h.speed,stamina:h.stamina,guts:h.guts,wins:h.wins,top3:h.top3,races:h.races,history:[],g1:h.g1||0,graded:h.graded||0,
    score:Math.round(h.q*130),soldYear:calendarParts(S.week).yearIndex,soldWeek:S.week,stationKey:'own',stationName:'自己所有(日高の預託牧場)',place:'北海道日高地方',
    price,q:h.q,foals:[],pregnant:null,owned:true,produce:[],bought:true,temper:h.temper,frail:h.frail,tendon:tendonOf(h)};

const MAX_MARES=8;
function renderMareAdviceHtml(h){
  const lv=supporterLevel('ketto');
  if(!lv) return `<div class="advice-box empty">🗣 血統アナリストを雇うと、繁殖牝馬としての評価を教えてくれます。</div>`;
  const pq=clamp(h.q+seededNoise(h.id+'mq'+lv)*[0,0.15,0.08,0.03][lv],0.1,1);
  const g=[],b=[];
  if(pq>=0.7) g.push('母系が優秀。良い種牡馬を付ければ大物が期待できる');
  else if(pq>=0.5) g.push('堅実な母系。産駒の勝ち上がりは期待できる');
  else if(pq<0.35) b.push('母系の活力は乏しい。安い種牡馬で数を打つ繁殖向き');
  if(h.age>=12) b.push(`${h.age}歳と高齢。受胎率が下がり、残りの繁殖期間も短い`);
  else if(h.age<=6) g.push('若く、これから何頭も産める');
  if(SIRE_NOTES[h.sireName]) g.push(`父${h.sireName}は${SIRE_NOTES[h.sireName]}。母の父としても期待`);
  if(h.inFoal) g.push(`お腹の子(父${h.inFoal.sire})もセットで手に入る`);
  const stars=clamp(Math.round(pq*5+0.3),1,5);
  return `<div class="advice-box"><div class="adv"><div class="adv-h">📜 系 真理子<small>繁殖牝馬の評価 Lv${lv}</small><span class="adv-stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span></div>${g.map(t=>`<div class="adv-g">◎ ${t}</div>`).join('')}${b.map(t=>`<div class="adv-b">△ ${t}</div>`).join('')}</div></div>`;
}

/* ================= 所属地区と移籍(他地区・中央JRA) =================
   所有馬は南関東(大井・川崎・船橋・浦和)所属から始まる。勝てなくなった馬は賞金の低い他地区へ、
   地方で活躍した馬は中央(JRA)へ移籍できる。中央から地方へ戻ることもできる。
   各地区の賞金水準・相手関係は実際の傾向(南関東>兵庫・愛知・北海道>岩手・佐賀・高知)をもとにしたゲーム内の値。 */
const REGIONS={
  minami:{name:'南関東',venue:'ooi',prize:1,bl:0,desc:'大井・川崎・船橋・浦和。賞金も相手も地方最高峰。'},
  hokkaido:{name:'北海道(門別)',venue:'monbetsu',prize:0.5,bl:-7,closed:[12,1,2,3],desc:'2歳馬の育成で有名。冬(12〜3月)は開催がない。'},
  iwate:{name:'岩手(水沢・盛岡)',venue:'mizusawa',prize:0.42,bl:-9,closed:[1,2,3],desc:'冬(1〜3月)は休催。のんびり使える。'},
  aichi:{name:'愛知(名古屋)',venue:'nagoya',prize:0.5,bl:-7,desc:'東海地区。中堅どころが集まる。'},
  hyogo:{name:'兵庫(園田)',venue:'sonoda',prize:0.55,bl:-6,desc:'小回りで先行有利。賞金は地方の中位。'},
  kochi:{name:'高知',venue:'kochi',prize:0.4,bl:-10,desc:'ナイター「夜さ来い」。再起をかける馬が集まる。'},
  saga:{name:'佐賀',venue:'saga',prize:0.42,bl:-9,desc:'九州唯一の地方競馬。小回りコース。'},
  jra:{name:'中央(JRA)',venue:'tokyo',prize:1,bl:0,desc:'最高峰の舞台。賞金は桁違いだが、預託料も高く相手も強い。'},
};
const JRA_CLASSES=[
  {k:'新馬',bl:72,prize:[2000000,800000,500000]},
  {k:'未勝利',bl:78,prize:[1800000,700000,450000]},
  {k:'1勝クラス',bl:88,prize:[2800000,1100000,700000]},
  {k:'2勝クラス',bl:96,prize:[3500000,1400000,900000]},
  {k:'3勝クラス',bl:104,prize:[4500000,1800000,1100000]},
  {k:'オープン',bl:112,prize:[6000000,2400000,1500000]},
];
const JRA_VENUE_BY_MONTH={1:['nakayama','kyoto'],2:['tokyo','kyoto'],3:['nakayama','hanshin'],4:['nakayama','hanshin'],5:['tokyo','kyoto'],6:['tokyo','hanshin'],
  7:['chukyo','sapporo'],8:['sapporo','chukyo'],9:['nakayama','hanshin'],10:['tokyo','kyoto'],11:['tokyo','kyoto'],12:['nakayama','hanshin']};
const OPEN_KEYS=['中央','中央芝','中央L','重賞','海外','海外芝','地方芝'];
function reqAgeOk(h,q){const a=q.age;return a==='2'?h.age===2:a==='3'?h.age===3:a==='4+'?h.age>=4:h.age>=3;}
function raceMinAge(r){if(r.req) return 0;if(r.minAge) return r.minAge;return (r.sub==null&&!r.region&&OPEN_KEYS.includes(r.classKey))?3:0;}
function wonJraListed(h){return (h.history||[]).some(x=>x.rank===1&&/\(L/.test(x.raceName||''));}
function horseRegion(h){return (h&&h.region)||'minami';}
function regionOpen(key,month){const R=REGIONS[key];return !(R&&R.closed&&R.closed.includes(month));}
// 中央のクラス:未出走は新馬、未勝利、以降は勝ち星(移籍馬は格付けぶんを加算)で1勝クラス→2勝→3勝→オープン
function jraClassOf(h){const lv=(h.jraBase||0)+(h.jraWins||0);if(lv<=0) return (h.jraRaces||0)>0?1:0;return Math.min(5,lv+1);}
function setJraDebut(h){h.region='jra';h.jraBase=0;h.jraWins=0;h.jraRaces=0;h.jraV2=true;h.fromLocal=false;}
function ensureRegionRacesNow(k){
  const add=regionRaces(S.week).filter(r=>r.region===k&&!S.weekRaces.some(x=>x.name===r.name&&x.region===k));
  add.forEach(r=>{setRaceConditions(r);r.grade=gradeOfRace(r);S.weekRaces.push(r);});
}
function regionRaces(week){
  const month=calendarParts(week).month;
  const regs=[...new Set((S&&S.horses||[]).map(horseRegion))].filter(k=>k!=='minami');
  const out=[];
  regs.forEach(k=>{
    const R=REGIONS[k];
    if(k==='jra'){
      const vs=JRA_VENUE_BY_MONTH[month];
      JRA_CLASSES.forEach((c,i)=>{['dirt','turf'].forEach((sf,j)=>{
        if(i===0&&(month===4||month===5)) return; // 2歳新馬戦は6月に始まり、翌3月まで
        const dists=sf==='dirt'?[1200,1400,1600,1800]:[1200,1600,1800,2000,2400];
        out.push({classKey:'中央',region:'jra',jraClass:i,name:`🇯🇵 ${c.k}(${sf==='turf'?'芝':'ダ'})`,baseline:c.bl,entryFee:0,travelFee:0,surface:sf,
          prize:c.prize.slice(),venue:vs[(i+j)%2],dist:pickFrom(dists)});
      });});
      return;
    }
    if(!regionOpen(k,month)) return;
    SUBCLASSES.forEach((c,i)=>{
      if(i===0&&!(month>=5&&month<=11)) return;
      out.push({classKey:c.big,sub:i,region:k,name:`${R.name.replace(/\(.*\)/,'')}・${c.k==='新馬'?'新馬戦':c.k+'特別'}`,baseline:c.bl+R.bl,
        entryFee:Math.round(c.fee*R.prize),travelFee:0,surface:'dirt',prize:c.prize.map(p=>Math.round(p*R.prize/1000)*1000),venue:R.venue});
    });
  });
  return out;
}
// 他地区では、南関東で稼いだ賞金は格付けで割り引かずに数えるため、上のクラスから始まる
function regionClassScale(h){const R=REGIONS[horseRegion(h)];return R&&R.prize<1?Math.sqrt(R.prize):1;}
function regionEligible(h,r,baseOk){
  const reg=horseRegion(h);
  if(reg==='jra'){
    const jc=jraClassOf(h);
    if(r.req&&r.req.age==='2') return baseOk; // 2歳限定の重賞・G1
    if(r.region==='jra'){const rc=r.jraClass;
      if(h.age<=2&&calendarParts(S.week).month<6) return false; // 2歳馬のデビューは6月の新馬戦から
      if(jc===0) return rc===0||rc===1;   // 未出走:新馬戦か未勝利戦
      if(jc===1) return rc===1;           // 未勝利の馬は未勝利戦だけ
      return rc===jc||rc===jc+1;}         // 同じクラスか、1つ上(格上挑戦)
    if(r.classKey==='中央'||r.classKey==='中央芝') return jc>=4; // 重賞は3勝クラス以上(格上挑戦含む)
    if(r.classKey==='中央L') return jc>=4;
    if(r.classKey==='海外'||r.classKey==='海外芝') return jc>=5&&h.wins>=4;
    if(r.classKey==='三冠') return /JRA|中央|🇯🇵|🇺🇸/.test(r.name)&&(baseOk||(jc>=3&&r.req&&reqAgeOk(h,r.req)&&(!r.req.sex||h.sex===r.req.sex)));
    if(r.classKey==='重賞') return jc>=5&&/Jpn/.test(r.name);
    return false;
  }
  if(r.region==='jra') return false;
  if(reg==='minami') return !r.region&&baseOk;
  // 他地区
  if(r.region) return r.region===reg&&baseOk;
  if(r.sub!=null) return false; // 南関東の平場には出られない
  if(r.classKey==='重賞') return baseOk&&/Jpn/.test(r.name);
  return baseOk; // 中央・海外・三冠などは従来どおり
}
function transferOptions(h){
  const reg=horseRegion(h);
  const g=gradeSummary(h);
  const hs=horseSub(h);
  return Object.entries(REGIONS).filter(([k])=>k!==reg).map(([k,R])=>{
    let ok=true,why='';
    if(k==='jra'){
      if(h.age<3||h.age>7){ok=false;why='3〜7歳の馬のみ';}
      else if(!(hs>=7||g.graded>=1)){ok=false;why='A2クラス以上か重賞勝ちが必要';}
    }
    const fee=k==='jra'?300000:reg==='jra'?150000:100000;
    return {k,R,ok,why,fee};
  });
}
let transferHorseId=null;
function doTransfer(h,k,fee){
  const from=horseRegion(h);
  S.money-=fee;
  h.region=k==='minami'?undefined:k;
  if(k==='jra'){
    const hs=horseSub(h),g=gradeSummary(h);
    h.jraBase=g.g1>=1?4:g.graded>=2||hs>=8?3:2;h.jraWins=0;h.jraRaces=1;h.jraV2=true;h.fromLocal=true;
  }
  // 所属が変わるので厩舎も移る
  h.trainerKey=null;h.pendingAction=null;
  addNews(`${h.name}が${REGIONS[from].name}から${REGIONS[k].name}へ移籍した(費用${yen(fee)})。`,'money-out');
  // 今週のレース一覧に移籍先のレースを足す
  const add=regionRaces(S.week).filter(r=>r.region===k&&!S.weekRaces.some(x=>x.name===r.name&&x.region===k));
  add.forEach(r=>{setRaceConditions(r);r.grade=gradeOfRace(r);S.weekRaces.push(r);});
  transferHorseId=null;
  admissionName='';openAdmission(h,'region');
}
function renderTransferModal(){
  const h=S.horses.find(x=>x.id===transferHorseId);
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);
  if(!h){transferHorseId=null;return overlay;}
  box.appendChild(el(`<div class="modal-title">${h.name}の移籍先</div>`));
  box.appendChild(el(`<div class="modal-sub">現在:${REGIONS[horseRegion(h)].name} ・ ${horseClassLabel(h)} ・ ${h.age}歳 ${h.races}戦${h.wins}勝</div>`));
  transferOptions(h).forEach(o=>{
    const lvl=o.k==='jra'?'相手:最強':o.R.bl>=0?'相手:強い':o.R.bl>=-7?'相手:中位':'相手:手頃';
    const card=el(`<div class="trainer-card career-card ${o.ok?'':'blocked'}"><div class="trainer-head"><span class="trainer-name">${o.k==='jra'?'🇯🇵 ':''}${o.R.name}</span><span class="trainer-skill">移籍費 ${yen(o.fee)}</span></div>
      <div class="trainer-desc">${o.R.desc}</div><div class="trainer-meta">賞金水準 ${o.k==='jra'?'南関東の約8倍':`南関東の${Math.round(o.R.prize*100)}%`} ・ ${lvl}${o.ok?'':` ・ <span style="color:#ffb3a8">${o.why}</span>`}</div></div>`);
    if(o.ok) card.onclick=()=>askConfirm({title:`${h.name}を${o.R.name}へ移籍させますか?`,text:`移籍費 ${yen(o.fee)}。移籍先の厩舎を選び直します。`,okLabel:'移籍する',onOk:()=>doTransfer(h,o.k,o.fee)});
    box.appendChild(card);
  });
  const close=el(`<button class="cheat-close" style="margin-top:8px">やめる</button>`);
  close.onclick=()=>{transferHorseId=null;render();};
  box.appendChild(close);
  overlay.appendChild(box);
  return overlay;
}
function horseClassLabel(h){
  if(horseRegion(h)==='jra') return JRA_CLASSES[jraClassOf(h)].k;
  return horseClass(h).key;
}

/* ================= 天候・馬場状態・季節 =================
   週ごとに競馬場ごとの天気が決まり、同じ週・同じ競馬場のレースは同じ馬場で行われる。
   雨の多い梅雨(6月)・秋雨と台風(9月)は道悪になりやすい。ダートは水を含むと時計が速くなり前が残りやすく、
   芝は重くなるとスタミナが要る。冬は北の競馬場で雪、南関東でもまれに降雪で開催中止になる。 */
const RAIN_P={1:0.14,2:0.2,3:0.3,4:0.3,5:0.3,6:0.52,7:0.38,8:0.32,9:0.46,10:0.34,11:0.24,12:0.15};
const SNOW_VENUES=['mizusawa','morioka','monbetsu','sapporo'];
function weatherFor(venue,week){
  if(!S.weatherCache||S.weatherCache.week!==week) S.weatherCache={week,v:{}};
  const c=S.weatherCache.v;
  if(c[venue]) return c[venue];
  const m=calendarParts(week).month;
  const snowy=(m<=2||m===12)&&(SNOW_VENUES.includes(venue)?0.35:0.04);
  let w;
  const x=Math.random();
  if(snowy&&x<snowy) w={k:'snow',label:'雪',icon:'❄',going:x<snowy*0.3?3:2,cancel:Math.random()<(SNOW_VENUES.includes(venue)?0.25:0.35)};
  else {
    const rp=RAIN_P[m]||0.3,y=Math.random();
    if(y<rp*0.45) w={k:'rain',label:'雨',icon:'☔',going:Math.random()<0.55?3:2};
    else if(y<rp) w={k:'drizzle',label:'小雨',icon:'🌂',going:Math.random()<0.6?1:2};
    else if(y<rp+0.25) w={k:'cloudy',label:'曇',icon:'☁',going:Math.random()<0.25?1:0};
    else w={k:'sunny',label:'晴',icon:'☀',going:Math.random()<0.08?1:0};
  }
  // 夏の夕立は短時間で馬場が回復しやすい
  c[venue]=w;
  return w;
}
// 道悪適性(重・不良馬場の上手下手)。父の傾向+個体差
const SIRE_MUD={'ゴールドシップ':15,'ステイゴールド':12,'オルフェーヴル':10,'エピファネイア':6,'ハーツクライ':4,'シニスターミニスター':10,'ヘニーヒューズ':8,
  'パイロ':8,'ホッコータルマエ':6,'キングカメハメハ':5,'ロードカナロア':0,'ディープインパクト':-10,'キズナ':-2,'コントレイル':-8,'イクイノックス':-4,'ドゥラメンテ':2,
  'Into Mischief':6,'Tapit':4,'Curlin':8,'Gun Runner':6,'Sea the Stars':4,'Frankel':0,'Dubawi':4};
function ensureMud(h){if(h.mudApt==null)h.mudApt=clamp(Math.round(50+(SIRE_MUD[h.sireName]||0)+randInt(-22,22)),5,95);return h.mudApt;}
function mudLabel(v){return v>=70?'◎':v>=55?'○':v>=40?'△':'×';}
function mudPowerAdj(apt,r){
  const gi=r.goingIdx||0;if(gi<2) return 0;
  return (apt-50)/50*(r.surface==='turf'?5:3.5)*(gi-1)/2;
}
function npcMud(n){if(n.mudApt==null)n.mudApt=clamp(Math.round(50+seededNoise(n.id+'mud')*30),5,95);return n.mudApt;}

/* ================= 故障の種類 =================
   実際の競走馬に多い故障をモデルにした。熱発・挫石は軽く、ソエは若い馬に多い。骨折や屈腱炎は長期休養になり、
   屈腱炎は再発しやすく引退のきっかけになることも多い。獣医師(サポーター)がいると早期発見で軽く済むことがある。 */
const INJURIES={
  fever:{name:'熱発',w:[1,2],perm:0,desc:'発熱。数日〜1週ほどで回復する。'},
  bruise:{name:'挫石・打撲',w:[1,3],perm:0,desc:'蹄や脚の打撲。軽症。'},
  soe:{name:'ソエ',w:[2,5],perm:0,desc:'若馬に多い管骨の炎症。成長とともに治まる。'},
  sprain:{name:'捻挫',w:[3,6],perm:0,desc:'関節の捻挫。'},
  fracture:{name:'骨折',w:[10,24],perm:2,desc:'剥離骨折・ヒビ。手術や長期休養が必要。'},
  tendon:{name:'屈腱炎',w:[30,56],perm:4,desc:'「競走馬の癌」とも呼ばれる腱の炎症。再発しやすい。'},
};
function rollInjury(h,ctx){
  // ctx: 'race' | 'train'
  const age=h.age||3,fr=h.frail==null?35:h.frail,old=age>=6?1:0;
  const w=ctx==='race'
    ?{fever:2,bruise:4,soe:age<=3?4:0.5,sprain:3,fracture:2+fr/40,tendon:0.8+fr/50+old+(h.tendonHist?3:0)+tendonOf(h)/60}
    :{fever:5,bruise:3,soe:age<=3?5:0.5,sprain:1.5,fracture:0.6,tendon:0.3+fr/80+(h.tendonHist?2:0)+tendonOf(h)/120};
  let x=Math.random()*Object.values(w).reduce((a,b)=>a+b,0),k='fever';
  for(const [kk,v] of Object.entries(w)){x-=v;if(x<0){k=kk;break;}}
  // 獣医師の早期発見(重い故障ほど効く)
  const lv=supporterLevel('vet');let saved=false;
  if(lv&&(k==='tendon'||k==='fracture')&&Math.random()<[0,0.3,0.5,0.7][lv]){k=k==='tendon'?'sprain':'bruise';saved=true;}
  const I=INJURIES[k];
  const weeks=randInt(I.w[0],I.w[1]);
  h.injury=weeks;h.injuryName=I.name;
  if(I.perm){['speed','stamina','guts'].forEach(s=>{if(h[s]<150)h[s]=clamp(h[s]-randInt(Math.max(1,I.perm-1),I.perm+1),10,99);});}
  if(k==='tendon') h.tendonHist=(h.tendonHist||0)+1;
  return {k,name:I.name,weeks,desc:I.desc,saved,serious:!!I.perm};
}
function injuryText(h,inj,ctx){
  const head=ctx==='race'?`${h.name}がレース後に`:`${h.name}が調教中に`;
  let t=`🩹 ${head}「${inj.name}」を発症。全治${inj.weeks}週の見込み。${inj.desc}`;
  if(inj.saved) t+=` 👨‍⚕️ 森下獣医師が異変を早期に発見し、軽症で済んだ。`;
  if(inj.k==='tendon') t+=` ${h.tendonHist>=2?'屈腱炎の再発…。引退も考えたほうがいいかもしれない。':'復帰まで長い道のりになる。'}`;
  if(inj.serious) t+=' 能力が少し落ちた。';
  return t;
}

/* ================= 共同所有(共有馬主) =================
   高額馬は馬主仲間と共同で所有できる(実際の「共有馬主」)。購入費・預託料・出走経費・賞金・売却額を持ち分で分け合う。
   出走や引退の判断は代表馬主(あなた)が行う。あとから仲間の持ち分を買い取ることもできる。 */
const PARTNER_NAMES=['小松 義雄','有村 千鶴','大河内 誠','三上 晴美','長谷部 浩','久保田 修'];
function shareOf(h){return h&&h.share!=null?h.share:1;}
function shareLabel(h){const s=shareOf(h);return s>=1?'':`共有${Math.round(s*100)}%`;}
function buyoutPrice(h){return Math.max(100000,Math.round(resaleValue(h)*1.3*(1-shareOf(h))/10000)*10000);}

/* ================= 年度表彰(NARグランプリ型)と馬主リーディング =================
   実際の地方競馬の年度表彰(NARグランプリ)にならい、1年の成績から年度代表馬と部門別の最優秀馬を選ぶ。
   あわせて、その年の獲得賞金で馬主リーディングを集計する(他の馬主は架空)。 */
function raceScore(name,rank){
  const n=name||'';
  let base=/JpnI(?!I)|G1|\(SI\)/.test(n)?10:/JpnII(?!I)|G2|\(SII\)/.test(n)?6:/JpnIII|G3|\(SIII\)|重賞/.test(n)?4:1;
  if(rank===1) return base;
  if(rank<=3) return base*0.25;
  return 0;
}
function estPrize(name,rank){
  if(rank>3) return 0;
  const n=name||'';
  const p=/JRA・G1|海外・G1/.test(n)?[15e6,5e6,2e6]:/JpnI(?!I)|\(SI\)/.test(n)?[8e6,2.8e6,1.2e6]:/Jpn|\(S/.test(n)?[4e6,1.4e6,6e5]:/A[12]/.test(n)?[2e6,7e5,3e5]:/B[123]/.test(n)?[1.2e6,4.5e5,2e5]:[7e5,2.5e5,1.2e5];
  return p[rank-1];
}
function yearEndAwards(report){
  const yi=calendarParts(S.week-1).yearIndex;
  const inYear=w=>calendarParts(w).yearIndex===yi;
  // 候補:所有馬(引退した馬も含む)と地方所属の他厩舎の馬
  const cands=[];
  const pushP=(h,cur)=>{const hs=(h.history||[]).filter(x=>inYear(x.week));if(!hs.length)return;
    cands.push({name:h.name,age:h.age,sex:h.sex,player:true,score:hs.reduce((a,x)=>a+raceScore(x.raceName,x.rank),0),wins:hs.filter(x=>x.rank===1).length,
      big:hs.filter(x=>x.rank===1&&raceScore(x.raceName,1)>=4).map(x=>shortRaceName(x.raceName)),prize:hs.reduce((a,x)=>a+(x.prize||0),0)*(cur?shareOf(h):1)});};
  S.horses.filter(h=>horseRegion(h)!=='jra').forEach(h=>pushP(h,true));
  (S.retired||[]).filter(r=>r.soldYear===yi||r.soldYear===yi+1).forEach(r=>pushP(r,false));
  (S.npcs||[]).filter(n=>n.cat==='local').forEach(n=>{const hs=n.hist.filter(x=>inYear(x.week));if(!hs.length)return;
    cands.push({name:n.name,age:n.age,sex:n.sex,player:false,npc:n,score:hs.reduce((a,x)=>a+raceScore(x.race,x.rank),0),wins:hs.filter(x=>x.rank===1).length,
      big:hs.filter(x=>x.rank===1&&raceScore(x.race,1)>=4).map(x=>shortRaceName(x.race)),prize:hs.reduce((a,x)=>a+estPrize(x.race,x.rank),0)});});
  cands.forEach(c=>{const m={};c.big.forEach(x=>m[x]=(m[x]||0)+1);c.big=Object.entries(m).map(([k,v])=>v>1?`${k}×${v}`:k);});
  const best=f=>cands.filter(f).sort((a,b)=>b.score-a.score||b.prize-a.prize)[0];
  const cats=[
    ['年度代表馬',c=>c.score>=4],
    ['最優秀2歳牡馬',c=>c.age===2&&c.sex!=='牝'],['最優秀2歳牝馬',c=>c.age===2&&c.sex==='牝'],
    ['最優秀3歳牡馬',c=>c.age===3&&c.sex!=='牝'],['最優秀3歳牝馬',c=>c.age===3&&c.sex==='牝'],
    ['最優秀4歳以上牡馬',c=>c.age>=4&&c.sex!=='牝'],['最優秀4歳以上牝馬',c=>c.age>=4&&c.sex==='牝'],
  ];
  if(!S.awards) S.awards=[];
  const lines=[];let mine=0;
  cats.forEach(([cat,f])=>{
    const w=best(f);if(!w||w.score<1) return;
    S.awards.push({y:yi,org:'nar',cat,name:w.name,player:w.player,big:w.big.slice(0,3)});
    lines.push(`<b>${cat}</b>:${w.player?'🏆 ':''}${w.name}${w.player?'(あなたの馬)':''}${w.big.length?` — ${w.big.slice(0,3).join('・')}`:` — ${w.wins}勝`}`);
    if(w.player){mine++;adjustRep(cat==='年度代表馬'?3:1,cat==='年度代表馬'?8:3,`${w.name}:${cat}を受賞`);
      if(cat==='年度代表馬') addFeat(report,{title:`${w.name}、開業${yi}年目の年度代表馬に!`,body:`${w.big.length?w.big.join('・')+'を制した':'年間'+w.wins+'勝の'}${w.name}が、地方競馬の年度代表馬に選ばれた。`});}
  });
  jraAwards(report,yi,inYear);
  // 馬主リーディング
  const owners=NPC_OWNERS.map(n=>({name:n,prize:0,wins:0}));
  cands.filter(c=>!c.player).forEach(c=>{const o=owners.find(x=>x.name===c.npc.owner)||owners[0];o.prize+=c.prize;o.wins+=c.wins;});
  const jraMine=S.horses.filter(h=>horseRegion(h)==='jra').map(h=>(h.history||[]).filter(x=>inYear(x.week)));
  const me={name:S.ownerName||'あなた',prize:cands.filter(c=>c.player).reduce((a,c)=>a+c.prize,0)+jraMine.reduce((a,hs)=>a+hs.reduce((b,x)=>b+(x.prize||0),0),0),wins:cands.filter(c=>c.player).reduce((a,c)=>a+c.wins,0)+jraMine.reduce((a,hs)=>a+hs.filter(x=>x.rank===1).length,0),me:true};
  const table=[...owners,me].sort((a,b)=>b.prize-a.prize);
  const rank=table.indexOf(me)+1;
  if(!S.ownerRanks) S.ownerRanks=[];
  S.ownerRanks.push({y:yi,rank,prize:me.prize,wins:me.wins,top:table.slice(0,3).map(o=>o.name)});
  if(rank===1){adjustRep(3,6,`馬主リーディング1位`);addFeat(report,{title:`開業${yi}年目の馬主リーディング1位!`,body:`獲得賞金${yen(me.prize)}・${me.wins}勝で、地方競馬の馬主リーディングの頂点に立った。`});}
  else if(rank<=3) adjustRep(1,3,`馬主リーディング${rank}位`);
  {const rv=owners.find(o=>o.name===ensureRival());if(rv) report.push({type:'notice',text:`⚔ ライバル「${rv.name}」の獲得賞金 ${yen(Math.round(rv.prize))}(${rv.wins}勝)。あなたとの差は ${yen(Math.round(Math.abs(rv.prize-me.prize)))}${rv.prize>me.prize?'。追われる立場です':'。リードしています'}`});}
  const top=table.slice(0,5).map((o,i)=>`${i+1}位 ${o.me?'<b>'+o.name+'</b>':o.name} ${yen(Math.round(o.prize))}(${o.wins}勝)`).join('<br>');
  report.push({type:'notice',text:`🏅 開業${yi}年目 NARグランプリ(地方競馬の年度表彰)<br>${lines.join('<br>')||'該当馬なし'}<br><br>📊 馬主リーディング(獲得賞金)<br>${top}${rank>5?`<br>…${rank}位 <b>${me.name}</b> ${yen(me.prize)}(${me.wins}勝)`:''}`});
}
/* ---- JRA賞(中央の年度表彰) ----
   実際のJRA賞にならい、中央のレースでの成績から年度代表馬と部門別の最優秀馬を選ぶ。 */
function isJraRaceName(n){return /JRA・G|🇯🇵|\(L|クラス\(|新馬\(|未勝利\(|中央/.test(n||'');}
const JRA_SPRINT=/スプリンターズ|高松宮|安田記念|マイルチャンピオンシップ(?!南部杯)|ヴィクトリアマイル|NHKマイル/;
function jraAwards(report,yi,inYear){
  const cands=[];
  const jScore=(name,rank)=>isJraRaceName(name)?raceScore(name,rank):0;
  const dirtScore=(name,rank)=>(/JRA・G|Jpn/.test(name||'')&&!/芝/.test(name||''))?raceScore(name,rank):0;
  const sprintScore=(name,rank)=>JRA_SPRINT.test(name||'')?raceScore(name,rank):0;
  const add=(o,hs,key,player)=>{
    const sc=hs.reduce((a,x)=>a+jScore(x[key],x.rank),0);
    const ds=hs.reduce((a,x)=>a+dirtScore(x[key],x.rank),0);
    const ss=hs.reduce((a,x)=>a+sprintScore(x[key],x.rank),0);
    if(sc<=0&&ds<=0) return;
    const m={};hs.filter(x=>x.rank===1&&(jScore(x[key],1)>=4||dirtScore(x[key],1)>=4)).forEach(x=>{const k=shortRaceName(x[key]);m[k]=(m[k]||0)+1;});
    cands.push({name:o.name,age:o.age,sex:o.sex,player,score:sc,dirt:ds,sprint:ss,wins:hs.filter(x=>x.rank===1&&isJraRaceName(x[key])).length,
      big:Object.entries(m).map(([k,v])=>v>1?`${k}×${v}`:k)});
  };
  S.horses.forEach(h=>add(h,(h.history||[]).filter(x=>inYear(x.week)),'raceName',true));
  (S.retired||[]).filter(r=>r.soldYear===yi||r.soldYear===yi+1).forEach(r=>add(r,(r.history||[]).filter(x=>inYear(x.week)),'raceName',true));
  (S.npcs||[]).filter(n=>n.cat==='jra').forEach(n=>add(n,n.hist.filter(x=>inYear(x.week)),'race',false));
  const best=(f,k)=>cands.filter(f).sort((a,b)=>b[k||'score']-a[k||'score'])[0];
  const cats=[
    ['年度代表馬',c=>c.score>=6,'score'],
    ['最優秀2歳牡馬',c=>c.age===2&&c.sex!=='牝'],['最優秀2歳牝馬',c=>c.age===2&&c.sex==='牝'],
    ['最優秀3歳牡馬',c=>c.age===3&&c.sex!=='牝'],['最優秀3歳牝馬',c=>c.age===3&&c.sex==='牝'],
    ['最優秀4歳以上牡馬',c=>c.age>=4&&c.sex!=='牝'],['最優秀4歳以上牝馬',c=>c.age>=4&&c.sex==='牝'],
    ['最優秀短距離馬',c=>c.sprint>=4,'sprint'],['最優秀ダートホース',c=>c.dirt>=4,'dirt'],
  ];
  const lines=[];
  cats.forEach(([cat,f,k])=>{
    const w=best(f,k);if(!w||w[k||'score']<1) return;
    S.awards.push({y:yi,org:'jra',cat,name:w.name,player:w.player,big:w.big.slice(0,3)});
    lines.push(`<b>${cat}</b>:${w.player?'🏆 ':''}${w.name}${w.player?'(あなたの馬)':''}${w.big.length?` — ${w.big.slice(0,3).join('・')}`:` — 中央${w.wins}勝`}`);
    if(w.player){adjustRep(cat==='年度代表馬'?4:2,cat==='年度代表馬'?12:5,`${w.name}:JRA賞${cat}を受賞`);
      if(cat==='年度代表馬') addFeat(report,{title:`${w.name}、JRA賞年度代表馬に!`,body:`${w.big.length?w.big.join('・')+'を制した':''}${w.name}が、中央競馬の頂点・JRA賞年度代表馬に選ばれた。`});
      else addFeat(report,{title:`${w.name}、JRA賞${cat}を受賞`,body:`開業${yi}年目のJRA賞で${cat}に選ばれた。`});}
  });
  report.push({type:'notice',text:`🇯🇵 開業${yi}年目 JRA賞(中央競馬の年度表彰)<br>${lines.join('<br>')||'該当馬なし'}`});
}

/* ================= 馬主名と勝負服 =================
   日本の勝負服と同じく、13色(白・黒・赤・青・黄・緑・桃・水色・紫・薄紫・茶・海老・鼠)と、
   一本輪・縦縞・襷・十字襷・山形・菱山形・元禄などの柄、袖の色を組み合わせて登録する。 */
const SILK_COLORS=[['白','#f4f4f0'],['黒','#1c1c1c'],['赤','#d0302c'],['青','#2350b8'],['黄','#f2cc22'],['緑','#1f8a46'],['桃','#f29cb8'],
  ['水色','#6cc6ee'],['紫','#6a2c8e'],['薄紫','#b9a0dc'],['茶','#7a4a24'],['海老','#8a2a35'],['鼠','#8d8d8d']];
const SILK_PATTERNS=[['plain','無地'],['hoop','一本輪'],['hoops','二本輪'],['stripes','縦縞'],['sash','襷'],['cross','十字襷'],['chevron','山形'],['diamond','菱山形'],['genroku','元禄']];

function silkSVG(silk,size){

  const body='M9,6 L15,3 Q20,7 25,3 L31,6 L31,34 L9,34 Z';
  const lArm='M9,6 L1,17 L6,21 L9,15 Z',rArm='M31,6 L39,17 L34,21 L31,15 Z';
  const pat={
    plain:'',hoop:`<rect x="0" y="16" width="40" height="6" fill="${C}"/>`,
    hoops:`<rect x="0" y="12" width="40" height="4" fill="${C}"/><rect x="0" y="22" width="40" height="4" fill="${C}"/>`,
    stripes:[11,17,23,29].map(x=>`<rect x="${x}" y="0" width="3" height="40" fill="${C}"/>`).join(''),

    sl==='stripes'?`<line x1="3" y1="15" x2="8" y2="9" stroke="${C}" stroke-width="1.6"/><line x1="5" y1="18" x2="9" y2="12" stroke="${C}" stroke-width="1.6"/><line x1="37" y1="15" x2="32" y2="9" stroke="${C}" stroke-width="1.6"/><line x1="35" y1="18" x2="31" y2="12" stroke="${C}" stroke-width="1.6"/>`:'';
  return `<svg class="silk-svg" viewBox="0 0 40 36" width="${size}" height="${Math.round(size*0.9)}"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>
    <path d="${lArm}" fill="${armFill}" stroke="#0006" stroke-width=".6"/><path d="${rArm}" fill="${armFill}" stroke="#0006" stroke-width=".6"/>${armDeco}
    <path d="${body}" fill="${B}"/><g clip-path="url(#${id})">${pat}</g><path d="${body}" fill="none" stroke="#0008" stroke-width=".8"/></svg>`;

function silkName(silk){silk=silk||silkOf();const P=(SILK_PATTERNS.find(p=>p[0]===silk.pattern)||['',''])[1];
  return `${SILK_COLORS[silk.base][0]}${silk.pattern==='plain'?'':`、${SILK_COLORS[silk.sub][0]}${P}`}${silk.sleeve==='sub'?`、${SILK_COLORS[silk.sub][0]}袖`:silk.sleeve==='band'?`、袖${SILK_COLORS[silk.sub][0]}一本輪`:silk.sleeve==='stripes'?`、袖${SILK_COLORS[silk.sub][0]}縦縞`:''}`;}

/* ================= 競馬新聞の見出しとファンレター ================= */
function makeHeadline(r,field){
  const players=field.filter(f=>f.isPlayer);
  if(!players.length) return null;
  const sorted=[...field].sort((a,b)=>a.rank-b.rank);
  const w=sorted[0],second=sorted[1];
  const rn=shortRaceName(r.name);
  const g=r.grade||'';
  const big=isG1Grade(g),graded=!!g;
  const p=players.sort((a,b)=>a.rank-b.rank)[0];
  const mg=second?marginText(second.timeSec-w.timeSec):'';
  const fav=[...field].sort((a,b)=>(a.winOdds||99)-(b.winOdds||99))[0];
  const jk=p.jockeyName?p.jockeyName.split(' ')[0]:'';
  let h,sub;
  if(p.rank===1){
    const style=p.styleIdx;
    const lead=(second&&second.timeSec-w.timeSec>=1.0)?`${p.name} 圧勝!後続に${mg}`:
      style===0?`${p.name} 逃げ切り!${mg}差で押し切る`:style===1?`${p.name} 好位から抜け出す`:style===3?`${p.name} 直線一気!大外から差し切る`:`${p.name} 鮮やか差し切り`;
    if(big) h=`${p.name}、${rn}制覇!${jk}騎手と頂点へ`;
    else if(graded){const first=!(p.horse.history||[]).slice(0,-1).some(x=>x.rank===1&&x.grade);h=first?`${p.name} 重賞初制覇!${rn}`:`${p.name}、${rn}も制す`;}
    else h=lead;
    sub=`${rn} ${raceCondLabel(r)} 勝ちタイム${formatRaceTime(w.timeSec)}${p.winOdds?` 単勝${p.winOdds.toFixed(1)}倍`:''}`;
    if(p.winOdds&&p.winOdds>=30) h=`波乱!${p.winOdds.toFixed(0)}倍の伏兵${p.name}が${big||graded?rn+'を':''}激走V`;
  } else if(p.rank===2&&p.timeSec-w.timeSec<0.15){
    h=`${p.name} 惜敗 ${w.name}に${marginText(p.timeSec-w.timeSec)}差及ばず`;sub=`${rn} 勝ち馬${w.name}(${formatRaceTime(w.timeSec)})`;
  } else if(fav===p&&p.rank>=6){
    h=`1番人気${p.name} まさかの${p.rank}着`;sub=`${rn}は${w.name}が制す`;
  } else if(p.rank<=3){
    h=`${p.name} ${p.rank}着 見せ場つくる`;sub=`${rn}は${w.name}が制す(${formatRaceTime(w.timeSec)})`;
  } else {
    h=`${rn}は${w.name}が快勝`;sub=`${p.name}は${p.rank}着`;
  }
  if(!S.papers) S.papers=[];
  const item={week:S.week,h,sub,win:p.rank===1,big:big||graded};

/* ================= ファン投票(有馬記念・宝塚記念) =================
   実際の2レースと同じく、ファン投票の上位10頭は優先して出走できる。
   投票はレースの2週間前に発表。あなたの馬はファン満足度が高いほど票が集まる。 */
const FAN_VOTE_RACES=['宝塚記念','有馬記念'];
function fanVoteWeek(week){
  return FAN_VOTE_RACES.map(n=>CROWN_RACES.find(c=>c.name===n)).filter(c=>{
    const d=new Date(Date.UTC(weekToDate(week).getUTCFullYear(),c.m-1,c.d-14));
    return weekInWindow(week,d.getUTCMonth()+1,d.getUTCDate());});
}
function voteScoreFromHist(list,key){
  return list.filter(x=>S.week-x.week<=52).reduce((a,x)=>{
    const sc=raceScore(x[key],x.rank)*(S.week-x.week<=12?1.5:1);
    return a+sc;},0);
}
function runFanVote(c,report){
  const yi=calendarParts(S.week).yearIndex;
  const cands=[];
  (S.npcs||[]).filter(n=>n.age>=3&&n.cat!=='intl').forEach(n=>{
    const sc=voteScoreFromHist(n.hist,'race')+n.g1*3+n.graded*0.8;
    if(sc<2) return;
    cands.push({name:n.name,votes:Math.round((6000+sc*7000*(n.cat==='jra'?1.25:0.8))*(0.85+Math.random()*0.3)),player:false,npcId:n.id});
  });
  S.horses.filter(h=>h.age>=3&&!h.unnamed).forEach(h=>{
    const g=gradeSummary(h);
    const sc=voteScoreFromHist(h.history||[],'raceName')+g.g1*3+g.graded*0.8;
    const fanBoost=(S.fans||30)*1800*(0.6+Math.min(1,sc/20)); // ファンが多いほど票が伸びる
    cands.push({name:h.name,votes:Math.round((3000+sc*7000+fanBoost)*(0.9+Math.random()*0.2)),player:true,horseId:h.id});
  });
  cands.sort((a,b)=>b.votes-a.votes);
  cands.forEach((x,i)=>x.rank=i+1);
  if(!S.fanVotes) S.fanVotes={};
  S.fanVotes[c.name]={y:yi,top:cands.slice(0,10).map(x=>({...x})),mine:cands.filter(x=>x.player).map(x=>({...x}))};
  const mine=cands.filter(x=>x.player);
  mine.filter(x=>x.rank<=10).forEach(x=>adjustRep(0,2,`${x.name}:${c.name}ファン投票${x.rank}位`));
  const top=cands.slice(0,10).map(x=>`${x.rank}位 ${x.player?'<b>🏆 '+x.name+'</b>':x.name} ${x.votes.toLocaleString()}票`).join('<br>');
  const extra=mine.filter(x=>x.rank>10).slice(0,3).map(x=>`…${x.rank}位 <b>${x.name}</b> ${x.votes.toLocaleString()}票`).join('<br>');
  report.push({type:'notice',text:`🗳 ${c.name}ファン投票 最終結果(上位10頭は優先出走)<br>${top}${extra?'<br>'+extra:''}${mine.some(x=>x.rank<=10)?'<br><br>あなたの馬がファン投票で選ばれた!条件を満たしていなくても出走できる。':''}`});
}
function fanVoted(h,r){
  if(!r.crownRace||!FAN_VOTE_RACES.includes(r.crownRace)) return false;
  const v=(S.fanVotes||{})[r.crownRace];
  return !!(v&&v.y===calendarParts(S.week).yearIndex&&v.top.some(x=>x.horseId===h.id));
}

/* ================= 送り出した馬たちが他厩舎の馬として走る =================
   種牡馬・繁殖牝馬にした馬の産駒、セリで売った生産馬、ほかの馬主に譲った馬は、
   他厩舎の馬(NPC)として実際にレースに出てくる。活躍すればニュースが届く。 */
function npcGrowthFrom(g){return g==='early'?'early':g==='late'||g==='long'?'late':'normal';}
function makeNpcFromHorse(h,cat,origin,owner){
  const used=npcUsedNames();used.delete(h.name);
  const n=makeNpc(cat,h.age,used);
  if(!h.unnamed) n.name=h.name;n.sex=h.sex;n.sire=h.sireName;n.growth=npcGrowthFrom(h.growth);
  const avg=h.speed*0.4+h.stamina*0.35+h.guts*0.25;
  const g=(NPC_GROWTH[n.growth]||NPC_GROWTH.normal)[Math.min(9,Math.max(2,h.age))]||0.9;
  // 今の実力から、将来の伸びしろ(ポテンシャル)を逆算する
  n.potential=clamp(Math.round((avg*1.15+12)/g),35,175);
  n.runStyle=h.runStyle||n.runStyle;n.optDist=h.optDist||n.optDist;n.turf=h.turfApt||n.turf;n.dirt=h.dirtApt||n.dirt;n.temper=h.temper==null?n.temper:h.temper;
  n.wins=h.wins||0;n.races=h.races||0;n.top3=h.top3||0;
  const gs=gradeSummary(h);n.g1=gs.g1;n.graded=gs.graded;
  n.origin=origin;if(owner) n.owner=owner;
  n.hist=(h.history||[]).slice(-12).map(x=>({week:x.week,race:x.raceName,rank:x.rank,n:x.fieldSize||10}));
  S.npcs.push(n);
  return n;
}
function spawnOffspringNpc(sireName,damName,age,cat,quality,origin){
  const used=npcUsedNames();

  n.potential=cat==='jra'?clamp(Math.round(92+quality*48+randInt(-10,10)),90,150):clamp(Math.round(42+quality*55+randInt(-12,12)),38,110);
  n.optDist=pickOptDist(randInt(35,65),randInt(35,65),sireName,null);
  n.origin=origin;n.damName=damName||null;
  S.npcs.push(n);
  return n;
}

/* ================= 他の馬主からの購入オファー ================= */
function offerValue(h){
  const g=gradeSummary(h);
  let v=resaleValue(h)*2+g.g1*30000000+g.other*8000000+h.wins*500000;
  v*=(h.age<=4?1.2:h.age>=7?0.5:1)*(0.85+Math.random()*0.4);
  return Math.max(1000000,Math.round(v/100000)*100000);
}
function weeklyOffers(report){
  if(!S.offers) S.offers=[];
  S.offers=S.offers.filter(o=>o.expires>S.week&&S.horses.some(h=>h.id===o.horseId));
  S.horses.forEach(h=>{
    if(h.unnamed||h.age<2||S.offers.some(o=>o.horseId===h.id)) return;
    const g=gradeSummary(h);
    const hs=horseRegion(h)==='jra'?jraClassOf(h)+3:horseSub(h);
    const p=(g.graded?0.03:0)+(g.g1?0.03:0)+(hs>=7?0.012:0)+(h.wins>=5?0.006:0);
    if(Math.random()>=p) return;
    const o={id:uid(),horseId:h.id,owner:pickFrom(NPC_OWNERS),price:offerValue(h),expires:S.week+4};
    S.offers.push(o);
    report.push({type:'notice',text:`📨 ${o.owner}から、${h.name}を${yen(o.price)}で譲ってほしいとオファーが届いた(厩舎タブで返事ができる。4週間有効)。`});
  });
}
function acceptOffer(o){
  const h=S.horses.find(x=>x.id===o.horseId);if(!h) return;
  const pay=Math.round(o.price*shareOf(h));
  const star=gradeSummary(h).graded>0;
  S.money+=pay;
  S.horses=S.horses.filter(x=>x.id!==h.id);
  S.pendingAdmissions=(S.pendingAdmissions||[]).filter(id=>id!==h.id);
  makeNpcFromHorse(h,horseRegion(h)==='jra'?'jra':'local',{type:'sold',label:'あなたが手放した馬'},o.owner);
  S.offers=S.offers.filter(x=>x.id!==o.id);
  adjustRep(0,star?-3:-0.5,`${h.name}を${o.owner}へ売却`);
  addNews(`${h.name}を${o.owner}へ${yen(pay)}で譲った。これからは他厩舎の馬として走る。`,'money-in');
  toast(`${h.name}を売却しました(${yen(pay)})`);
}
function declineOffer(o){

function checkHallOfFame(h,report){

/* ================= 追い切りとパドック =================
   週の半ばに追い切り(調教の時計)が出る。追い切りが良い週はレース当日の気配も良くなりやすい。
   レース当日はパドックで気配が見られる(他厩舎の馬は相馬眼サポーターのレベルが高いほど正確)。 */
function drillNoise(h,week){return seededNoise(h.id+'drill'+week);}
const WOOD_TRAINERS=['t1','t3','t5','tj2'];
function drillInfo(h,week){
  week=week==null?S.week:week;
  if(h.age<2||!h.trainerKey||h.injury>0||h.layoff) return null;
  const n=drillNoise(h,week);
  const avg=(h.speed+h.stamina+h.guts)/3;
  const q=clamp(((h.condition-60)/40)*0.45+((avg-50)/50)*0.3+n*0.6,-1.2,1.4);
  const wood=WOOD_TRAINERS.includes(h.trainerKey);
  const strong=h.condition>=75?'強め':h.condition>=55?'馬なり':'軽め';
  let txt;
  if(wood){const t6=clamp(84.5-q*2.6-(avg-50)*0.03,78.5,90);const l1=clamp(12.2-q*0.35,11.1,13.5);txt=`W 6F ${t6.toFixed(1)}-${l1.toFixed(1)}`;}
  else {const t4=clamp(53.5-q*2.3-(avg-50)*0.03,49.0,58);const l1=clamp(12.6-q*0.4,11.6,14);txt=`坂路 4F ${t4.toFixed(1)}-${l1.toFixed(1)}`;}
  const mark=q>=0.7?'◎':q>=0.3?'○':q>=-0.2?'△':'×';
  const word=q>=0.9?'一番時計の動き':q>=0.7?'抜群の動き':q>=0.3?'好調キープ':q>=-0.2?'まずまず':'動き一息';
  return {txt:`${txt}(${strong})`,mark,word,q};
}
function drillHtml(h){
  const d=drillInfo(h);
  if(!d) return '';
  return `<div class="drill-line">🏃 今週の追い切り:${d.txt} <b class="dm dm${d.mark}">${d.mark}</b> ${d.word}</div>`;
}
// レース当日の気配。追い切りの良し悪しを半分くらい引き継ぐ
function setDayForm(f){
  const h=f.horse,n=f.npc;
  const base=h?drillNoise(h,S.week)*0.6:0;
  f.dayForm=clamp(base+(Math.random()-0.5)*1.4,-1,1);
  const temper=h?(h.temper==null?35:h.temper):(n?n.temper:35);
  f.irekomi=Math.random()<Math.max(0,temper-25)/160;
}
function paddockLabel(df,ire){
  if(ire) return ['▲','イレ込み気味'];
  return df>=0.55?['◎','気配絶好']:df>=0.15?['○','好気配']:df>=-0.35?['△','平凡']:['×','気配一息'];
}
function paddockFor(f,item){
  if(f.dayForm==null) return '';
  let df=f.dayForm,ire=f.irekomi;
  if(!f.isPlayer){
    const lv=supporterLevel('soma');
    const favs=[...item.gateOrder].sort((a,b)=>a.winOdds-b.winOdds).slice(0,5);
    if(lv===0||(lv===1&&!favs.includes(f))) return '';
    const err=[0,0.3,0.15,0.05][lv];
    const s=seededNoise(f.name+'pd'+S.week);
    if(Math.abs(s)<err){df=-df;ire=false;}
  }
  const [m,w]=paddockLabel(df,ire);
  return ` <span class="pd pd${m}">${m}${w}</span>`;
}

/* ================= 放牧と外厩 =================
   放牧:牧場でのんびり休ませる。状態とケガの回復が早いが、長く休むと休み明けは少し走りにくい。
   外厩:大手の育成施設で調整しながら休ませる。費用は高いが、休み明けから走れて能力も少し伸びる。 */
const LAYOFF={farm:{name:'放牧',fee:8000,rec:18},gaikyu:{name:'外厩',fee:25000,rec:14}};
function sendLayoff(h,type,weeks){
  h.layoff={type,weeks,total:weeks};h.pendingAction=null;
  addNews(`${h.name}を${LAYOFF[type].name}に出した(${weeks}週)。`,'');
  toast(`${h.name}を${LAYOFF[type].name}に出しました`);
}
function layoffWeekly(h,lines){
  const L=h.layoff,T=LAYOFF[L.type];
  L.weeks--;
  h.condition=clamp(h.condition+T.rec,0,100);
  if(h.injury>0) h.injury=Math.max(0,h.injury-(L.type==='farm'?2:1));
  if(h.injury<=0) h.injuryName=null;
  if(L.type==='gaikyu'&&Math.random()<0.5){const k=pickFrom(['speed','stamina','guts']);if(h[k]<99)h[k]+=1;}
  if(L.weeks<=0){
    h.freshBonus=L.type==='gaikyu'?3:(L.total>=8?-2:0);
    lines.push(`<b>${h.name}</b>:${T.name}から帰厩。${L.type==='gaikyu'?'外厩でしっかり乗り込まれ、休み明けから走れる状態。':L.total>=8?'リフレッシュできたが、久々の実戦は割り引きが必要。':'リフレッシュして戻ってきた。'}`);
    h.layoff=null;
  } else lines.push(`<b>${h.name}</b>:🌾 ${T.name}中(あと${L.weeks}週)`);
}
function renderLayoffRow(h){
  const row=el(`<div class="stable-row"><span>🌾 ${h.layoff?`${LAYOFF[h.layoff.type].name}中(あと${h.layoff.weeks}週)`:'放牧・外厩'}</span></div>`);
  if(h.layoff){
    const b=el(`<button class="act-btn">呼び戻す</button>`);
    b.onclick=()=>{h.layoff.weeks=1;toast(`${h.name}は来週帰厩します`);render();};
    row.appendChild(b);return row;
  }
  [['farm',4],['farm',8],['gaikyu',4]].forEach(([t,w])=>{
    const b=el(`<button class="act-btn">${LAYOFF[t].name}${w}週</button>`);
    b.onclick=()=>askConfirm({title:`${h.name}を${LAYOFF[t].name}に出しますか?`,text:`${w}週間、レースには出られません。費用は週${yen(LAYOFF[t].fee)}(預託料の代わり)。<br>${t==='farm'?'状態とケガの回復が早くなります。8週以上休むと休み明けは少し走りにくくなります。':'状態が回復し、調整しながら能力も少し伸びます。休み明けから力を出せます。'}`,okLabel:'出す',
      onOk:()=>{sendLayoff(h,t,w);}});
    row.appendChild(b);
  });
  return row;
}

/* ================= 騎手の世界 =================
   騎手も年をとる。若手は伸び、ベテランは衰えて引退する。毎年、競馬学校から新人がデビューし、
   冬(12〜3月)には外国人騎手が短期免許で来日する。年末には騎手リーディングが発表される。 */
const BASE_JOCKEYS=JOCKEYS.map(j=>({...j}));
const JOCKEY_START_AGE={j1:34,j2:29,j3:26,j4:41,j5:31,j6:23,j7:19};
const ROOKIE_FAMILY=['桐生','朝比奈','真田','柊','宮城','北条','神楽','鳴海','如月','天野','綾瀬','久遠'];
const ROOKIE_GIVEN_M=['颯','陸斗','蒼真','大翔','悠真','隼人'],ROOKIE_GIVEN_F=['結衣','紗良','凛','美月','ひなた','楓'];
const FOREIGN_JOCKEYS=[{name:'C.ルフェーヴル',country:'フランス'},{name:'R.ハミルトン',country:'イギリス'},{name:'D.オコナー',country:'アイルランド'},{name:'M.ベルナール',country:'フランス'},{name:'J.マクレガー',country:'オーストラリア'}];
function feeForSkill(sk){return [0,0,8000,16000,28000,40000,60000][clamp(Math.round(sk),1,6)];}
function ensureJockeyWorld(){
  if(!S.jockeyData){
    S.jockeyData={};
    BASE_JOCKEYS.forEach(j=>{S.jockeyData[j.key]={skill:j.skill,age:JOCKEY_START_AGE[j.key]||30,retired:false,yearWins:0};});
  }
  if(!S.jockeyExtra) S.jockeyExtra=[];
  syncJockeys();
}
function syncJockeys(){
  JOCKEYS.length=0;
  [...BASE_JOCKEYS,...(S.jockeyExtra||[])].forEach(b=>{
    const d=S.jockeyData[b.key]||{};
    const sk=d.skill!=null?d.skill:b.skill;
    JOCKEYS.push({...b,skill:Math.round(sk*10)/10,fee:b.foreign?60000:feeForSkill(sk),age:d.age,retired:!!d.retired});
    if(S.jockeyAffection&&S.jockeyAffection[b.key]==null) S.jockeyAffection[b.key]=0;
  });
}
function jockeyInSeason(j){if(!j.foreign) return true;const c=calendarParts(S.week);return [12,1,2,3].includes(c.month)&&j.season===c.yearIndex-(c.month===12?0:1);}
function jockeyYearEnd(report){
  ensureJockeyWorld();
  const yi=calendarParts(S.week-1).yearIndex;
  // 騎手リーディング:あなたの馬での勝利+他の馬での勝利(腕前から推定)
  const table=JOCKEYS.filter(j=>!j.retired||((S.jockeyData[j.key]||{}).yearWins>0)).map(j=>{
    const d=S.jockeyData[j.key]||{};
    const other=j.foreign?Math.round(j.skill*4+randInt(0,6)):Math.round(Math.max(0,j.skill-0.5)*16+randInt(-6,10));
    return {j,wins:(d.yearWins||0)+other};
  }).sort((a,b)=>b.wins-a.wins);
  const lines=table.slice(0,5).map((x,i)=>`${i+1}位 ${x.j.name}${x.j.foreign?'(短期免許)':''} ${x.wins}勝`);
  const notes=[];
  // 加齢・成長・衰え・引退
  BASE_JOCKEYS.concat(S.jockeyExtra).forEach(b=>{
    const d=S.jockeyData[b.key];if(!d||d.retired||b.foreign) return;
    d.age++;
    const dv=d.age<=24?0.35:d.age<=30?0.15:d.age<=38?0:d.age<=44?-0.12:-0.3;
    const before=Math.round(d.skill);
    d.skill=clamp(d.skill+dv+(d.yearWins||0)*0.02+(Math.random()-0.5)*0.2,1,5);
    if(Math.round(d.skill)>before) notes.push(`📈 ${b.name}騎手が腕を上げた(☆${Math.round(d.skill)})`);
    if(d.age>=47&&S.spouseKey!==b.key&&(d.age>=53||Math.random()<0.35)){d.retired=true;notes.push(`🎌 ${b.name}騎手(${d.age}歳)が引退を発表した。`);}
    d.yearWins=0;
  });
  // 新人デビュー
  const g=Math.random()<0.4?'female':'male';
  const key='jr'+uid();
  let name;for(let i=0;i<30;i++){name=pickFrom(ROOKIE_FAMILY)+' '+pickFrom(g==='female'?ROOKIE_GIVEN_F:ROOKIE_GIVEN_M);if(!JOCKEYS.some(j=>j.name===name))break;}
  S.jockeyExtra.push({key,name,style:pickFrom(['逃げ型','差し型','万能型']),skill:1,fee:0,gender:g,rookie:true});
  S.jockeyData[key]={skill:1+Math.random()*0.6,age:randInt(18,20),retired:false,yearWins:0};
  notes.push(`🔰 競馬学校から新人の${name}騎手がデビューする。`);
  // 騎乗機会の少ない騎手は引退していく(所属騎手は10人まで)
  const act=BASE_JOCKEYS.concat(S.jockeyExtra).filter(b=>!b.foreign&&S.jockeyData[b.key]&&!S.jockeyData[b.key].retired&&b.key!==key);
  if(act.length>=10){
    const out=act.filter(b=>S.spouseKey!==b.key).sort((a,b)=>S.jockeyData[a.key].skill-S.jockeyData[b.key].skill||S.jockeyData[b.key].age-S.jockeyData[a.key].age)[0];
    if(out){S.jockeyData[out.key].retired=true;notes.push(`🎌 ${out.name}騎手が騎乗機会に恵まれず、引退を決めた。`);}
  }
  syncJockeys();
  report.push({type:'notice',text:`🏇 開業${yi}年目 騎手リーディング<br>${lines.join('<br>')}<br><br>${notes.join('<br>')}`});
}
function shortTermNotice(report){
  const c=calendarParts(S.week);
  if(c.month===12&&calendarParts(S.week-1).month===11){
    ensureJockeyWorld();
    // 冬の短期免許で外国人騎手が来日(12〜3月)
    const pick=pickFrom(FOREIGN_JOCKEYS),fk='jf'+uid();
    S.jockeyExtra=S.jockeyExtra.filter(j=>!j.foreign||j.season>=c.yearIndex-1);
    S.jockeyExtra.push({key:fk,name:pick.name,style:'万能型',skill:5.6,fee:60000,gender:'male',foreign:true,season:c.yearIndex,country:pick.country});
    S.jockeyData[fk]={skill:5.6,age:randInt(28,40),retired:false,yearWins:0};
    syncJockeys();
    const fj=JOCKEYS.find(j=>j.key===fk);
    if(fj) report.push({type:'notice',text:`✈ ${fj.country}の${fj.name}騎手が短期免許で来日(3月まで)。腕前は☆5以上、騎乗料${yen(fj.fee)}。`});
  }
}

/* ================= セーブの書き出し・読み込み ================= */
let saveIOOpen=false,saveIOText='',saveIOMsg='';
function b64FromBytes(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function bytesFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function exportSaveCode(){
  const json=JSON.stringify({v:1,S,STABLE_CAP,raceViewMode,savedAt:Date.now()});
  const bytes=new TextEncoder().encode(json);
  if(typeof CompressionStream!=='undefined'){
    try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'NBK1:'+b64FromBytes(buf);}catch(e){}
  }
  return 'NBK0:'+b64FromBytes(bytes);
}
async function importSaveCode(code){
  code=(code||'').trim().replace(/\s+/g,'');
  let bytes;
  if(code.startsWith('NBK1:')){
    const ds=new Blob([bytesFromB64(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  } else if(code.startsWith('NBK0:')) bytes=bytesFromB64(code.slice(5));
  else throw new Error('コードの形式が違います');
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||!d.S||!Array.isArray(d.S.horses)) throw new Error('セーブの中身が読めません');
  return d;
}
function renderSaveIO(){
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);
  box.appendChild(el(`<div class="modal-title">セーブの書き出し・読み込み</div>`));
  box.appendChild(el(`<div class="modal-sub">セーブを文字のコードにして、別の端末やアプリに移せます。コードをメモ帳などに保存しておけばバックアップにもなります。</div>`));
  const ex=el(`<button class="modal-next">今のセーブを書き出す</button>`);
  ex.onclick=async()=>{saveIOText=await exportSaveCode();saveIOMsg=`書き出しました(${saveIOText.length.toLocaleString()}文字)。下のコピーを押して保存してください。`;render();};
  box.appendChild(ex);
  const ta=el(`<textarea class="save-code" id="save-code" placeholder="ここに書き出したコードが出ます。読み込むときは、ここにコードを貼り付けてください。"></textarea>`);
  ta.value=saveIOText;ta.oninput=()=>{saveIOText=ta.value;};
  box.appendChild(ta);
  const row=el(`<div class="seg-row"></div>`);
  const cp=el(`<button class="ctl-btn">コピー</button>`);
  cp.onclick=()=>{try{navigator.clipboard.writeText(ta.value).then(()=>toast('コピーしました'),()=>{ta.select();toast('選択しました。長押しでコピーしてください');});}catch(e){ta.select();toast('選択しました。長押しでコピーしてください');}};
  const im=el(`<button class="ctl-btn active">このコードを読み込む</button>`);
  im.onclick=async()=>{
    try{const d=await importSaveCode(ta.value);
      askConfirm({title:'このセーブを読み込みますか?',text:`${calendarLong(d.S.week)} / 所持金 ${yen(d.S.money)} / 所有馬 ${d.S.horses.length}頭<br>今のデータは上書きされます。`,okLabel:'読み込む',danger:true,
        onOk:()=>{applySave(d);saveGame();saveIOOpen=false;saveIOText='';saveIOMsg='';toast('セーブを読み込みました');}});
    }catch(e){saveIOMsg='読み込めませんでした:'+e.message;render();}
  };
  row.append(cp,im);box.appendChild(row);
  if(saveIOMsg) box.appendChild(el(`<div class="modal-sub" style="margin-top:6px">${saveIOMsg}</div>`));
  const close=el(`<button class="cheat-close" style="margin-top:8px">閉じる</button>`);
  close.onclick=()=>{saveIOOpen=false;saveIOMsg='';render();};
  box.appendChild(close);
  overlay.appendChild(box);
  return overlay;
}

/* ================= 第8弾: ナイター特別・引退レース・ライバル馬主・騎手コンビ・気性・施設・年度振り返り・コラム ================= */
let facilityOpen=false;
// ---- クラシック登録(入厩時に登録。登録しなかった馬は3歳の1〜3月に追加登録できる) ----
const CLASSIC_REG_FEE=1000000, CLASSIC_ADD_FEE=3000000;
function classicOk(h){return h.classicReg==='reg'||h.classicReg==='add';}
function isClassicRace(r){return !!(r.crownRace&&r.req&&r.req.age==='3');}
function classicLabel(h){return h.classicReg==='reg'?'🎫 クラシック登録':h.classicReg==='add'?'🎫 追加登録済み':'';}
function renderClassicRow(h){
  const row=el(`<div class="stable-row"></div>`);
  const m=calendarParts(S.week).month;
  if(classicOk(h)){
    row.appendChild(el(`<span>${classicLabel(h)}(3歳クラシックに出られます)</span>`));
    return row;
  }
  if(h.age===3&&m<=3){
    row.appendChild(el(`<span>クラシック未登録(1〜3月の追加登録期間)</span>`));
    const b=el(`<button class="act-btn">追加登録(${yen(CLASSIC_ADD_FEE)})</button>`);
    b.onclick=()=>{
      if(S.money<CLASSIC_ADD_FEE){toast('資金が足りません');return;}
      askConfirm({title:'クラシックの追加登録',text:`${h.name}を3歳クラシックに追加登録します。費用 <b>${yen(CLASSIC_ADD_FEE)}</b>。`,okLabel:'追加登録する',
        onOk:()=>{S.money-=CLASSIC_ADD_FEE;h.classicReg='add';toast(`${h.name}を追加登録しました`);}});
    };
    row.appendChild(b);
  } else if(h.age===3){
    row.appendChild(el(`<span style="color:var(--text-dim);font-size:11px;">クラシック未登録(追加登録は3歳の1〜3月のみ)</span>`));
  }
  return row;
}
// ---- 1. ナイター特別(夏の大井ナイター。南関東の馬だけ出走可) ----
function nightRaceDef(){
  return {classKey:'ナイター',name:'ナイター特別',baseline:Math.round(CLASSES[4].baseline*1.05),entryFee:60000,travelFee:0,
    surface:'dirt',prize:[12000000,4500000,2000000],venue:'ooi',dist:1800,nightRace:true};
}
// ---- 2. 気性・癖(馬ごとに一つ。40%の馬だけ持つ) ----
const QUIRKS={
  gate:{name:'ゲート難',desc:'ゲートで出遅れることがある(15%で大きく後手)'},
  trailer:{name:'輸送が苦手',desc:'遠征・移籍のレースで力を出しにくい'},
  rainy:{name:'道悪が苦手',desc:'重・不良馬場で力が落ちる'},
  hot:{name:'暑がり',desc:'7〜8月のレースで本来の力を出しにくい'},
  night:{name:'夜の競馬が好き',desc:'ナイター特別で力を発揮する'}
};
function ensureQuirk(h){
  if(h.quirk===undefined) h.quirk=Math.random()<0.4?pickFrom(Object.keys(QUIRKS)):null;
  return h.quirk;
}
// レースの力に上乗せする癖・騎手相性の補正
function extraPower(h,r,jockey){
  let p=0;
  const q=ensureQuirk(h);
  if(q==='gate'&&Math.random()<0.15) p-=6;
  if(q==='trailer'&&(r.travelFee||0)>0) p-=3;
  if(q==='rainy'&&(r.goingIdx||0)>=2) p-=4;
  if(q==='hot'&&[7,8].includes(calendarParts(S.week).month)) p-=2;
  if(q==='night'&&r.classKey==='ナイター') p+=4;
  if(jockey&&h.combo) p+=Math.min(h.combo[jockey.key]||0,5)*0.6; // 騎手との相性(同じ騎手で何度も組むほど上がる)
  return p;
}
// ---- 3. 引退レース(ラストラン) ----
// h.farewell={pending:true,since} → 引退先を選ぶ → {career|kind,st,price,since}。次の出走が引退レースになる。
function setFarewellChoice(h,choice){
  h.farewell={...h.farewell,...choice,pending:false};
}
function doFarewell(h,report,why){
  const fw=h.farewell; h.farewell=null;
  const last=(h.history||[]).slice(-1)[0];
  const lastTxt=last&&last.week===S.week?`${shortRaceName(last.raceName)} ${last.rank}着`:'';
  const fanUp=last&&last.week===S.week&&last.rank===1?5:2;
  adjustRep(1,fanUp,`${h.name}:引退レース`);
  report.push({type:'notice',text:`🎌 ${h.name}の引退レース${lastTxt?`(${lastTxt})`:''}。${why}。スタンドからは大きな拍手が送られた。`});
  if(fw.kind){
    const st=[...STUD_STATIONS,...BROODMARE_FARMS].find(s=>s.key===fw.st)||STUD_STATIONS[0];
    retireToBreeding(h,fw.kind,st,fw.price||0);
  } else {
    const c=CAREERS.find(x=>x.key===fw.career)||CAREERS[0];
    if(c.action) c.action(h); else applyCareer(h,c,true);
  }
  if(horseDetail&&horseDetail.id===h.id) horseDetail=null;
}
function farewellCheck(report){
  const ran=S.horses.filter(h=>h.farewell&&!h.farewell.pending&&(h.history||[]).some(x=>x.week===S.week));
  ran.forEach(h=>doFarewell(h,report,'ラストラン'));
  const timeout=S.horses.filter(h=>h.farewell&&!h.farewell.pending&&S.week-h.farewell.since>=12);
  timeout.forEach(h=>doFarewell(h,report,'出走機会がないまま引退'));
}
// ---- 4. ライバル馬主(ゲーム開始時に1人決まる) ----
function ensureRival(){
  if(!S.rivalOwner) S.rivalOwner=pickFrom(NPC_OWNERS);
  return S.rivalOwner;
}
function rivalRaceNotes(r,field,report){
  const rv=ensureRival();
  const mine=field.filter(f=>f.isPlayer);
  const rivals=field.filter(f=>!f.isPlayer&&f.npc&&f.npc.owner===rv).sort((a,b)=>a.rank-b.rank);
  if(!rivals.length||!mine.length) return;
  const best=rivals[0];
  if(best.rank===1){
    report.push({type:'notice',text:`⚔ ライバル「${rv}」の${best.name}が${shortRaceName(r.name)}を制した。`});
  } else {
    const beat=mine.filter(m=>m.rank>best.rank).sort((a,b)=>a.rank-b.rank)[0];
    if(beat) report.push({type:'notice',text:`⚔ ライバル「${rv}」の${best.name}(${best.rank}着)が、あなたの${beat.name}(${beat.rank}着)を下した。`});
  }
}
// ---- 5. 年度振り返り(開業年ごとの成績) ----
function yearStatAdd(h,f,r,p){
  const y=calendarParts(S.week).yearIndex;
  S.yearStats=S.yearStats||{};
  const d=S.yearStats[y]||(S.yearStats[y]={races:0,wins:0,top3:0,prize:0,graded:0,gradedNames:[]});
  d.races++;
  if(f.rank===1) d.wins++;
  if(f.rank<=3) d.top3++;
  d.prize+=Math.round(p*shareOf(h));
  if(f.rank===1&&r.grade){d.graded++;d.gradedNames.push({h:h.name,r:r.name});}
}
function yearReviewReport(yi,report){
  const d=(S.yearStats||{})[yi];
  if(d) report.push({type:'review',year:yi,data:d});
}
// ---- 6. 競馬新聞のコラム(毎週、所有馬かその週の主役について1本) ----
function weeklyColumn(report){
  const wk=S.week-1;
  const mine=S.horses.filter(h=>(h.history||[]).some(x=>x.week===wk));
  const wins=mine.filter(h=>h.history.some(x=>x.week===wk&&x.rank===1));
  let text=null;
  if(wins.length){
    const h=pickFrom(wins), x=h.history.find(y=>y.week===wk&&y.rank===1);
    text=`【記者の目】${h.name}の${shortRaceName(x.raceName)}制覇。${x.jockeyName||'鞍上'}の手綱さばきが光った一戦だった。`;
  } else {
    const raceItem=report.find(it=>it.type==='race'&&it.field&&it.field.some(f=>f.rank===1&&!f.isPlayer));
    if(raceItem){
      const w=raceItem.field.find(f=>f.rank===1&&!f.isPlayer);
      text=`【記者の目】他厩舎の${w.name}(${(w.npc&&w.npc.owner)||'他馬主'})が${shortRaceName(raceItem.raceName)}を制した。今年の主役候補か。`;
    }
  }
  if(!text) return;
  if(!S.papers) S.papers=[];
  S.papers.push({week:wk,h:text,sub:'',win:false,col:true});

const TRACK_CURVE_SPLIT=0.55;
function bezierPt(p0,p1,p2,p3,u){
  const mt=1-u;
  return {
    x:mt*mt*mt*p0.x+3*mt*mt*u*p1.x+3*mt*u*u*p2.x+u*u*u*p3.x,
    y:mt*mt*mt*p0.y+3*mt*mt*u*p1.y+3*mt*u*u*p2.y+u*u*u*p3.y
  };
}
function trackPoint(progress,laneShift){
  const P0={x:8.3,y:10+laneShift}, P1={x:35.4,y:10+laneShift},
        P2={x:39.6,y:75+laneShift}, P3={x:66.7,y:75+laneShift}, P4={x:95.8,y:75+laneShift};
  if(progress<TRACK_CURVE_SPLIT){
    return bezierPt(P0,P1,P2,P3,progress/TRACK_CURVE_SPLIT);
  }
  const v=(progress-TRACK_CURVE_SPLIT)/(1-TRACK_CURVE_SPLIT);
  return {x:P3.x+(P4.x-P3.x)*v, y:P3.y+(P4.y-P3.y)*v};
}

/* ================= ODDS / 馬券 ================= */
function computeOdds(field){
  const maxP=Math.max(...field.map(f=>f.power));
  const temps=field.map(f=>Math.exp((f.power-maxP)/14)); // 最大値を基準にして桁あふれを防ぐ
  const sumT=temps.reduce((a,b)=>a+b,0);
  field.forEach((f,i)=>{
    f.winP=temps[i]/sumT;
    f.placeP=clamp(f.winP*2.6,0.03,0.92);
    f.winOdds=clamp(Math.round((0.78/Math.max(f.winP,1e-6))*10)/10,1.1,999.9);
    f.placeOdds=clamp(Math.round((0.82/f.placeP)*10)/10,1.1,999.9);
  });
}
function pairOdds(fieldArr,gateA,gateB,kind){
  const fa=fieldArr.find(f=>f.gateNo===gateA), fb=fieldArr.find(f=>f.gateNo===gateB);
  const factor=kind==='quinella'?6:14;
  const cap=kind==='quinella'?0.55:0.8;
  const takeout=kind==='quinella'?0.74:0.78;
  const p=clamp(fa.winP*fb.winP*factor,0.005,cap);
  return Math.max(1.1,Math.round((takeout/p)*10)/10);
}
function tripleOdds(fieldArr,gateA,gateB,gateC,kind){
  const fa=fieldArr.find(f=>f.gateNo===gateA), fb=fieldArr.find(f=>f.gateNo===gateB), fc=fieldArr.find(f=>f.gateNo===gateC);
  const raw=fa.winP*fb.winP*fc.winP;
  if(kind==='trifecta'){
    const p=clamp(raw*40,0.001,0.12);
    return Math.max(1.1,Math.round((0.72/p)*10)/10);
  }
  const p=clamp(raw*220,0.002,0.4);
  return Math.max(1.1,Math.round((0.75/p)*10)/10);
}
function formatRaceTime(sec){
  const m=Math.floor(sec/60);
  const s=(sec-m*60).toFixed(1).padStart(4,'0');
  return `${m}:${s}`;
}
function judgeBet(item,bet){
  const byGate=(g)=>item.field.find(f=>f.gateNo===g);
  let hit=false, payout=0;
  if(bet.type==='win'){
    const f=byGate(bet.picks[0]);
    if(f.rank===1){hit=true;payout=Math.round(bet.amount*f.winOdds);}
  } else if(bet.type==='place'){
    const f=byGate(bet.picks[0]);
    if(f.rank<=3){hit=true;payout=Math.round(bet.amount*f.placeOdds);}
  } else if(bet.type==='quinella'){
    const top2=item.field.filter(f=>f.rank<=2).map(f=>f.gateNo).sort((a,b)=>a-b);
    const pick=[...bet.picks].sort((a,b)=>a-b);
    if(top2[0]===pick[0] && top2[1]===pick[1]){hit=true;payout=Math.round(bet.amount*bet.odds);}
  } else if(bet.type==='wide'){
    const top3=item.field.filter(f=>f.rank<=3).map(f=>f.gateNo);
    if(top3.includes(bet.picks[0]) && top3.includes(bet.picks[1])){hit=true;payout=Math.round(bet.amount*bet.odds);}
  } else if(bet.type==='trifecta'){
    const order=item.field.filter(f=>f.rank<=3).sort((a,b)=>a.rank-b.rank).map(f=>f.gateNo);
    if(order[0]===bet.picks[0] && order[1]===bet.picks[1] && order[2]===bet.picks[2]){hit=true;payout=Math.round(bet.amount*bet.odds);}
  } else if(bet.type==='trio'){
    const top3set=item.field.filter(f=>f.rank<=3).map(f=>f.gateNo).sort((a,b)=>a-b);
    const pickSet=[...bet.picks].sort((a,b)=>a-b);
    if(top3set[0]===pickSet[0] && top3set[1]===pickSet[1] && top3set[2]===pickSet[2]){hit=true;payout=Math.round(bet.amount*bet.odds);}
  }
  return {hit,payout};
}
function settleBets(item){
  if(!item.bets || item.bets.length===0 || item.betsSettled) return;
  item.bets.forEach(bet=>{
    const r=judgeBet(item,bet);
    bet.hit=r.hit;
    bet.payout=r.payout;
    if(r.payout>0) S.money+=r.payout;
  });
  item.betsSettled=true;
}

function timeAtDist(hist,dt,d){
  const last=hist.length-1;
  if(hist[last]<d) return last*dt;
  let lo=0,hi=last;
  while(lo<hi){const mid=(lo+hi)>>1;if(hist[mid]>=d)hi=mid;else lo=mid+1;}
  if(lo===0) return 0;
  const a=hist[lo-1],b=hist[lo];
  return (lo-1+(d-a)/((b-a)||1))*dt;
}
function posAtTime(hist,dt,t){

}
