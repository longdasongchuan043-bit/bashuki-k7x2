/* 実際の良馬場の時計(1勝クラス〜地方A級あたりの標準的な走破タイム)。距離の間は線形補間。 */
const REF_TIME={
  dirt:[[1000,60.5],[1200,72],[1400,84.5],[1600,97],[1800,110.5],[2000,123.5],[2100,130.5],[2400,151.5],[2600,165],[3000,193]],
  turf:[[1000,57.5],[1200,69.5],[1400,82],[1600,94.5],[1800,107.5],[2000,120.5],[2100,127],[2400,147.5],[2500,154],[3000,186],[3200,199.5],[3400,212],[3600,226]]
};
function refSpeed(dist,turf){
  const t=REF_TIME[turf?'turf':'dirt'];
  let time;
  if(dist<=t[0][0]) time=t[0][1]*dist/t[0][0];
  else if(dist>=t[t.length-1][0]) time=t[t.length-1][1]*dist/t[t.length-1][0];
  else for(let i=1;i<t.length;i++){
    if(dist<=t[i][0]){time=t[i-1][1]+(t[i][1]-t[i-1][1])*(dist-t[i-1][0])/(t[i][0]-t[i-1][0]);break;}
  }
  return dist/time;
}
/* 強さ(power)→速度。標準(70)から、下は1ポイント0.17%、上は0.05%ずつ(上に行くほど時計は縮みにくい) */
function powerSpeedMult(pw){
  pw=clamp(pw,10,220);
  return pw<70?1-(70-pw)*0.0017:1+(pw-70)*0.0005;
}
const TIME_ADJ=1.007;
const REC_SLOW=1.025; // 勝ち馬は出走馬の中で最速なので、レコードより少し遅い水準に合わせる
/* ペースの影響の強さ(ハイペース=前が消耗し差し有利、スロー=前残り) */
const PACE={nige:1.8,sen:1.1,save:0.8,spurt:2.0,slowBlock:6};
/* 0.4秒刻みで各馬の位置を計算する。着順・タイムはこの結果から決まる。 */
function simulateRace(r,field,pace){
  const dist=r.dist,turf=r.surface==='turf',gi=r.goingIdx||0,n=field.length,dt=0.4;
  // 実在のコースレコードがあるコースは、それを基準に時計を合わせる(力のある馬=強さ175でレコード相当)
  const rcd=(typeof realRecord==='function'&&r.venue)?realRecord(r):null;
  const ovs=['meydan','kaa','gulfstream','delmar','longchamp','ascot','mooneevalley','shatin','churchill','pimlico','saratoga'].includes(r.venue)?1.02:1; // 海外は相手が強い設定のぶん基準を補正
  const refV=rcd?dist/(rcd.time*REC_SLOW*ovs*powerSpeedMult(175)/powerSpeedMult(70)):refSpeed(dist,turf);
  const goingMult=turf?1-0.008*gi:1+0.004*gi;
  const heat=pace.heat;
  const noiseScale=pace.label==='平均ペース'?0.55:1; // 平均ペースは展開に左右されず、馬の強さが出やすい
  // 直線が長いコース(東京など)は差し・追込、短いコース(浦和など)は逃げ・先行が有利
  const vS=(typeof venueCourse==='function'&&r.venue)?venueCourse(r).S:330;
  const stK=clamp((vS-330)/300,-0.4,0.6);
  const sims=field.map(f=>{
    const pw=Math.min(f.power,220);
    const optD=f.optDist||dist;
    const dFit=(dist-optD)/800;
    const shortPen=dist<optD?1-clamp((optD-dist)/1000,0,0.4)*0.05:1;
    const temper=f.temper==null?35:f.temper; // 気性(高いほど気性難)
    const form=1+(f.dayForm!=null?f.dayForm*0.025:(Math.random()-0.5)*0.05)*noiseScale*(1+Math.max(0,temper-35)/120); // 当日の気配(気性難ほどムラ)
    f.kakari=Math.random()<Math.max(0,temper-30)/220*(f.irekomi?2.2:1); // 掛かる(イレ込んでいると掛かりやすい)
    const costMul=(1+clamp(dFit,-0.4,0.8)*0.5)*(1.08-0.08*clamp(f.stamRatio||1,0.6,1.5))*(turf?1+0.04*gi:1);
    const lag=Math.random()*0.3+(Math.random()<0.02+temper*0.0011?0.7+Math.random()*0.5:0); // 気性難ほど出遅れやすい
    f.lag=lag;
    return {f,pos:0,eff:0,v:0,E:1,vBase:refV*powerSpeedMult(pw)*goingMult*shortPen*form*TIME_ADJ,costMul,
            extra:(f.gateNo-1)/Math.max(1,n-1)*6*clamp(1-stK,0.6,1.5),lag,noise:0,block:0,blockedAt:null,fin:null,hist:[0]};
  });
  let t=0;
  while(t<400 && sims.some(s=>s.fin===null)){
    t+=dt;
    sims.forEach(s=>{
      const f=s.f;
      if(t<=s.lag){s.hist.push(0);return;}
      const x=s.eff/dist,rem=dist-s.eff,si=f.styleIdx;
      let m;
      if(x<0.25) m=[1.024,1.028,0.99,0.975][si];
      else if(x<0.7) m=[1.008,1.004,1.0,0.994][si];
      else m=[1.0,1.004,1.030,1.050][si]*(si>=2?1+stK*0.012:1-stK*0.004)*(!turf&&gi>=2?(si<=1?1+0.004*gi:1-0.003*gi):1); // 水を含んだダートは前が止まりにくい
      if(f.kakari&&x<0.45) m*=1.02;
      const heatMul=si===0?1+heat*PACE.nige:si===1?1+heat*PACE.sen:1-heat*PACE.save;
      s.E-=dt/(dist/s.vBase)*0.85*s.costMul*Math.pow(m,4)*heatMul*(f.kakari&&x<0.45?1.35:1);
      let spd=s.vBase*m;
      if(rem<400){
        const g=clamp(f.gutsRatio||1,0.6,1.5);
        const eff=clamp((s.E+0.1)/0.35,0,1.3);
        spd*=1+(0.012+0.012*g)*eff*(si>=2?1+heat*PACE.spurt:1);
      }
      if(s.E<0.18) spd*=0.91+0.5*Math.max(s.E,-0.1);
      s.noise=s.noise*0.9+(Math.random()-0.5)*0.01*noiseScale;
      spd*=1+s.noise;
      // 直線で前が壁になる
      if(x>0.72 && rem>60){
        if(s.block>0){s.block-=dt;spd*=0.975;}
        else if(sims.some(o=>o!==s && o.eff>s.eff && o.eff-s.eff<2.2 && o.v<spd*0.995)){
          if(Math.random()<(0.3-0.04*(f.jockeySkill||2))*(si>=2&&heat<0?1+(-heat)*PACE.slowBlock:1)){
            s.block=0.8+Math.random()*0.8;
            if(s.blockedAt===null) s.blockedAt=t;
          }
        }
      }
      s.v+=(spd-s.v)*0.35;
      s.pos+=s.v*dt;
      const prev=s.eff;
      s.eff=s.pos/(1+s.extra/dist);
      if(s.fin===null && s.eff>=dist){
        s.fin=t-dt+dt*(dist-prev)/((s.eff-prev)||1);
      }
      s.hist.push(s.eff);
    });
  }
  sims.forEach(s=>{
    if(s.fin===null) s.fin=t;
    s.f.timeSec=s.fin+Math.random()*0.001;
    s.f.hist=s.hist;
    s.f.blockedAt=s.blockedAt;
  });
  field.forEach(f=>{
    f.last3F=f.timeSec-timeAtDist(f.hist,dt,Math.max(0,dist-600));
    const checkpoints=[0.3,0.5,0.7,0.9].map(p=>p*dist);
    f.passing=[];
    checkpoints.forEach((d,ci)=>{
      const ord=[...field].sort((a,b)=>timeAtDist(a.hist,dt,d)-timeAtDist(b.hist,dt,d));
      f.passing.push(ord.indexOf(f)+1);
    });
  });
  const byFin=[...field].sort((a,b)=>a.timeSec-b.timeSec);
  byFin.forEach((f,i)=>{f.rank=i+1;f.margin=i===0?'':marginText(f.timeSec-byFin[i-1].timeSec);});
  const winner=byFin[0];
  // 勝ち馬のラップ(200mごと。端数は最初の区間)
  const laps=[];
  const rest=dist%200;
  let prevD=0,prevT=0;
  const cuts=[];
  if(rest>0) cuts.push(rest);
  for(let d=(rest>0?rest:0)+200;d<=dist;d+=200) cuts.push(d);
  cuts.forEach(d=>{const tt=timeAtDist(winner.hist,dt,d);laps.push(tt-prevT);prevT=tt;prevD=d;});
  const front3F=timeAtDist(winner.hist,dt,Math.min(600,dist));
  // 実況イベント(実際の競馬中継の流れを参考に)
  const V=(typeof venueOf==='function'&&r.venue)?venueOf(r):null;
  const CS=(typeof venueCourse==='function'&&r.venue)?venueCourse(r).S:330;
  const nm=f=>f.name;
  const byTime=d=>[...field].sort((a,b)=>timeAtDist(a.hist,dt,d)-timeAtDist(b.hist,dt,d));
  const posAt=(f,t)=>posAtTime(f.hist,dt,t);
  const orderAt=t=>[...field].sort((a,b)=>posAt(b,t)-posAt(a,t));
  const lenTxt=L=>L<0.3?'並んで':L<0.8?'半馬身':L<1.3?'1馬身':L<1.8?'1馬身半':L<6?`${Math.round(L)}馬身`:'大きく離れて';
  const secTxt=t=>t>=60?`${Math.floor(t/60)}分${(t%60).toFixed(1).padStart(4,'0').replace('.','秒')}`:`${t.toFixed(1).replace('.','秒')}`;
  const raceShort=(r.name||'').replace(/^[^\sぁ-んァ-ン一-龥A-Za-z0-9]+\s*/,'').replace(/\((JRA|Jpn|海外|SI|S1|M1|M2|準重賞)[^)]*\)$/,'');
  const callAt=d=>{const o=[...field].sort((a,b)=>timeAtDist(a.hist,dt,d)-timeAtDist(b.hist,dt,d));return {o,t:timeAtDist(o[0].hist,dt,d)};};
  const ev=[{t:0,text:`${V?V.name+'、':''}${raceShort}、${turf?'芝':'ダート'}${dist}メートル。各馬ゲートに収まって……スタートしました!`}];
  field.filter(f=>f.lag>0.6).slice(0,2).forEach(f=>ev.push({t:0.9,text:`${nm(f)}はダッシュがつかない、出遅れました。`}));
  {const d0=Math.min(dist*0.18,350);const {o,t}=callAt(d0);
   {const L0=(posAt(o[0],t)-posAt(o[1],t))/2.4;ev.push({t,text:`さあ先行争い。ハナを切ったのは${nm(o[0])}、${L0<0.3?`${nm(o[1])}が並びかけて`:`${lenTxt(L0)}差で${nm(o[1])}`}、続いて${nm(o[2]||o[1])}。`});}}
  field.filter(f=>f.kakari).slice(0,2).forEach(f=>ev.push({t:timeAtDist(f.hist,dt,dist*0.15)+0.5,text:`${nm(f)}は掛かっている!頭を上げて行きたがっています。`}));
  if(dist>=1400){
    const {t}=callAt(1000);
    ev.push({t,text:`1000メートルの通過は${secTxt(t)}。${pace.label==='ハイペース'?'これは速い流れ!前の馬には厳しいペース。':pace.label==='スローペース'?'ゆったりとした流れ、前の馬には楽な展開。':'平均的な流れです。'}`});
  }
  {const d1=dist*0.55;const {o,t}=callAt(d1);
   const L=(posAt(o[0],t)-posAt(o[1],t))/2.4;
   const mid=o.slice(3,Math.max(4,o.length-2)).map(nm);
   let txt=`隊列を確認しましょう。先頭は${nm(o[0])}、リードは${lenTxt(L)}。2番手に${nm(o[1])}、その後ろ${nm(o[2]||o[1])}。`;
   if(mid.length) txt+=`中団に${mid.slice(0,2).join('、')}。`;
   txt+=`最後方に${nm(o[o.length-1])}。`;
   const me=o.findIndex(f=>f.isPlayer);
   if(me>=0) txt+=` あなたの${nm(o[me])}は${me===0?'先頭':me+1+'番手'}。`;
   ev.push({t,text:txt});}
  {const d2=Math.max(dist*0.6,dist-CS-280);const {o,t}=callAt(d2);
   const prevT=callAt(dist*0.4).t;
   const gain=[...field].map(f=>({f,g:orderAt(prevT).indexOf(f)-o.indexOf(f)})).sort((a,b)=>b.g-a.g)[0];
   ev.push({t,text:`3コーナーから4コーナーへ。${nm(o[0])}が先頭${gain&&gain.g>=2?`、外から${nm(gain.f)}が一気に押し上げてくる!`:'、後続も差を詰めてきた。'}`});}
  {const d3=Math.max(dist*0.65,dist-CS);const {o,t}=callAt(d3);
   const longS=CS>=450,shortS=CS<=300;
   ev.push({t,text:`直線コースに向きました!${V?V.name.replace('競馬場',''):''}の直線は${CS}メートル${longS?'、長い直線の追い比べ!':shortS?'、短い直線、前が残るか!':'!'}先頭は${nm(o[0])}!`});
   const me=o.findIndex(f=>f.isPlayer);
   if(me>0&&me<6) ev.push({t:t+0.4,text:`あなたの${nm(o[me])}は${me+1}番手、ここから伸びるか!`});}
  const bm=field.filter(f=>f.isPlayer&&f.blockedAt!==null&&f.rank>1)[0];
  if(bm) ev.push({t:bm.blockedAt,text:`${nm(bm)}、前が壁!進路がありません!`});
  {const {o,t}=callAt(dist-200);
   const closer=o.slice(2,6).find(f=>f===winner||f.styleIdx>=2);
   ev.push({t,text:`残り200を切った!${nm(o[0])}先頭、${nm(o[1])}が迫る!${closer?`外から${nm(closer)}も伸びてくる!`:''}`});}
  {const {o,t}=callAt(dist-80);
   const L=(posAt(o[0],t)-posAt(o[1],t))/2.4;
   if(L<1) ev.push({t,text:`${nm(o[0])}か!${nm(o[1])}か!${o[2]&&(posAt(o[0],t)-posAt(o[2],t))/2.4<1.5?nm(o[2])+'も!':''}`});
   else if(o[0]===winner) ev.push({t,text:`${nm(o[0])}、完全に抜け出した!`});}
  const close=byFin.length>1&&byFin[1].timeSec-byFin[0].timeSec<0.06;
  ev.push({t:winner.timeSec,text:close?`ほとんど並んでゴールイン!写真判定です……勝ったのは${nm(winner)}!`:`${nm(winner)}、ゴールイン!`});
  ev.push({t:winner.timeSec+0.6,text:`1着${nm(winner)}、${byFin[1]?`${byFin[1].margin}差の2着に${nm(byFin[1])}`:''}${byFin[2]?`、3着${nm(byFin[2])}`:''}。勝ちタイム${formatRaceTime(winner.timeSec)}。`});
  ev.sort((a,b)=>a.t-b.t);
  // 再生用の時間割(序盤は早送り、最後の600mはゆっくり)
  const leaderT=timeAtDist(byTime(dist-600)[0].hist,dt,dist-600);
  return {dt,tEnd:byFin[byFin.length-1].timeSec+0.8,tSplit:Math.min(leaderT,byFin[byFin.length-1].timeSec),
          events:ev,laps,front3F,last3F:winner.last3F,pace};
}

/* 所有馬・引退馬・他厩舎の馬・市場の馬と名前がかぶらないようにする */
function uniqueHorseName(){
  let used;
  try{used=npcUsedNames();if(typeof S!=='undefined'&&S){[S.market,S.summerSaleMarket,S.mixSaleMarket,S.secondSaleMarket,S.osSaleMarket,S.mixLeftover].forEach(l=>(l||[]).forEach(h=>used.add(h.name)));}}catch(e){used=new Set();}
  for(let i=0;i<120;i++){const n=PREFIXES[randInt(0,PREFIXES.length-1)]+SUFFIXES[randInt(0,SUFFIXES.length-1)];if(!used.has(n))return n;}
  return PREFIXES[randInt(0,PREFIXES.length-1)]+SUFFIXES[randInt(0,SUFFIXES.length-1)];
}
function makeHorse(age,starter){
  const name=uniqueHorseName();
  const sex=Math.random()<0.5?"牡":"牝";
  const growth=(age-2)*randInt(1,4);
  const base=()=>clamp(randInt(22,42)+growth+(starter?8:0),10,80);

  const sireLine=SIRE_LINES[randInt(0,SIRE_LINES.length-1)];
  const damLine=SIRE_LINES[randInt(0,SIRE_LINES.length-1)];
  const nick=findNick(sireLine.key,damLine.key);

  const h={
    id:uid(),name,sex,age,
    speed:base(),stamina:base(),guts:base(),
    condition:randInt(70,95),
    wins:0,top3:0,races:0,
    silk:SILKS[randInt(0,SILKS.length-1)],
    pendingAction:null,
    retired:false,
    trainerKey:null,
    sire:sireLine.key,dam:damLine.key,
    sireName:pickRealSire(),
    damName:randomDamName(),
    damSireName:pickRealSire(),
    nick:nick?nick.label:null,
    turfApt:clamp(randInt(25,45)+sireLine.turf+Math.round(damLine.turf*0.5),10,99),
    dirtApt:clamp(randInt(45,65)+sireLine.dirt+Math.round(damLine.dirt*0.5),10,99),
    coat:pickCoat().key,
    blaze:Math.random()<0.3
  };
  // 血統ボーナス: 父系は全反映、母父系は半分反映。ニック成立でさらに加算。
  ['speed','stamina','guts'].forEach(stat=>{
    let bonus=sireLine.bonus[stat]+Math.round(damLine.bonus[stat]*0.5);
    if(nick) bonus+=nick.bonus;
    h[stat]=clamp(h[stat]+bonus,10,99);
  });
  h.title=assignTitle(h);
  h.runStyle=pickRunStyle(h.speed,h.stamina,h.guts);
  h.optDist=computeOptDist(h);
  ensurePedFict(h); // 5代血統表の牝系(架空馬とその父)を決める
  applyInbreedTraits(h); // インブリード:能力↑・気性難・体質弱になりやすい
  h.uniqueSkill=rollUniqueSkill();
  h.history=[];
  h.pastHistory=starter?null:generatePastHistory(age);

  const statSum=h.speed+h.stamina+h.guts;
  const pedigreeMult=sireLine.priceMult*(1+(damLine.priceMult-1)*0.4)*(nick?1.2:1)*(h.uniqueSkill?1.6:1);
  h.price=Math.round((statSum*3600+randInt(-30000,30000))*(age<=3?1.15:age>=6?0.7:1)*pedigreeMult);
  ensureGrowth(h);
  return h;
}

function sireLineName(key){return SIRE_LINES.find(s=>s.key===key).name;}

/* ================= 南関東型のクラス編成(C3〜A1) =================
   実際の南関東競馬と同じく、クラスは「収得賞金」で決まる。直近1年の賞金を重く、それ以前は軽く数えるため、
   勝てなくなった馬はクラスが下がる(降級)。1レースにつき1つ上のクラスまでは格上挑戦できる。 */
const SUBCLASSES=[
  {k:'新馬',big:'新馬',bl:34,fee:6000,prize:[400000,150000,80000],th:0},
  {k:'C3',big:'C級',bl:42,fee:9000,prize:[550000,200000,100000],th:0},
  {k:'C2',big:'C級',bl:46,fee:11000,prize:[650000,230000,110000],th:500000},
  {k:'C1',big:'C級',bl:50,fee:13000,prize:[800000,280000,130000],th:1300000},
  {k:'B3',big:'B級',bl:55,fee:17000,prize:[1000000,360000,170000],th:2600000},
  {k:'B2',big:'B級',bl:60,fee:22000,prize:[1200000,450000,200000],th:4500000},
  {k:'B1',big:'B級',bl:66,fee:28000,prize:[1500000,550000,250000],th:7000000},
  {k:'A2',big:'A級',bl:72,fee:34000,prize:[1900000,700000,300000],th:10000000},
  {k:'A1',big:'A級',bl:78,fee:40000,prize:[2500000,900000,400000],th:15000000},
];
const SUB_EST_BY_WINS=[0,700000,1400000,2500000,3500000,5000000,6500000,8000000,10000000,13000000,16000000];
function classEarnings(h){
  const hist=h.history||[];
  if(!hist.length) return SUB_EST_BY_WINS[Math.min(10,h.wins||0)];
  let e=0;
  hist.forEach(x=>{if(!x.prize)return;e+=S.week-x.week<=52?x.prize:x.prize*0.25;});
  // 移籍してきた馬などで記録より勝ち星が多いぶんは推定で補う
  const est=SUB_EST_BY_WINS[Math.min(10,h.wins||0)]*0.4;
  return Math.max(e,est);
}
function horseSub(h){
  if((h.races||0)===0&&!(h.pastHistory&&h.pastHistory.length)) return 0;
  const e=classEarnings(h)/regionClassScale(h);
  let s=1;
  for(let i=2;i<SUBCLASSES.length;i++) if(e>=SUBCLASSES[i].th) s=i;
  return s;
}
function horseClass(h){
  const i=horseSub(h),c=SUBCLASSES[i];
  return {key:c.k,label:c.k==='新馬'?'新馬戦':`${c.k}クラス`,sub:i,big:c.big};
}
function classRaces(){
  return SUBCLASSES.map((c,i)=>({classKey:c.big,sub:i,name:c.k==='新馬'?'新馬戦':`${c.k}特別`,baseline:c.bl,entryFee:c.fee,travelFee:0,surface:'dirt',prize:c.prize.slice()}));
}
function classChangeCheck(report){
  const lines=[];
  S.horses.forEach(h=>{
    if(h.age<2||h.unnamed) return;
    const s=horseSub(h);
    if(h.lastSub!=null&&s!==h.lastSub&&s>0&&h.lastSub>0){
      lines.push(s>h.lastSub?`⬆ ${h.name}が${SUBCLASSES[s].k}へ昇級`:`⬇ ${h.name}が${SUBCLASSES[s].k}へ降級(直近1年の賞金が減ったため)`);
    }
    h.lastSub=s;
  });
  if(lines.length) report.push({type:'notice',text:lines.join('<br>')});
}


function pickWeekRaces(week){
  const rs=pickWeekRacesRaw(week);
  if(calendarParts(week).month===8&&weekOfMonth(week)===2) rs.push(nightRaceDef()); // 夏のナイター開催
  rs.forEach(r=>{setRaceConditions(r);r.grade=gradeOfRace(r);});
  return rs;
}
/* 重賞・遠征レースは確率ではなく、毎年決まった週に開催する(開催月のうち第何週かはレース名で固定)。
   条件を満たしている馬には、その週になれば必ず選択肢に出る。 */
function raceSlot(name){let x=7;for(let i=0;i<name.length;i++)x=(x*31+name.charCodeAt(i))>>>0;return x%4;}
function weekOfMonth(week){return Math.floor((calendarParts(week).day-1)/7);}
function thisWeeks(list,month,wom){return list.filter(g=>g.month===month&&raceSlot(g.name)===wom);}
function pickWeekRacesRaw(week){
  const month=calendarParts(week).month;
  const wom=weekOfMonth(week);

  const races=[...classRaces(),...thisWeeks(GRADE_RACES,month,wom).map(g=>{
    const c=CLASSES[4];
    {
      const mult=TIER_MULT[g.tier];
      return{
        classKey:c.key,
        name:`${g.name}(${g.tier})`,
        baseline:Math.round(c.baseline*(0.85+mult*0.18)),
        entryFee:Math.round(c.entryFee*mult),
        travelFee:0,
        surface:'dirt',
        prize:c.prize.map(p=>Math.round(p*mult)),
        req:g.age2?{age:'2',sex:g.sex||null,min:1}:undefined,minAge:g.minAge
      };
    }
  })];

  // 中央(JRA)重賞への挑戦。史実の開催月のみ。地方馬は中央のリステッド競走を勝った馬だけが出走できる。
  thisWeeks(JRA_RACES,month,wom).forEach(g=>{
    const isG1=g.tier.includes('G1');
    races.push({
      classKey:'中央',
      name:`🇯🇵 ${g.name}(${g.tier})`,
      baseline:Math.round(CLASSES[4].baseline*(isG1?1.32:1.15)),
      entryFee:isG1?80000:50000,
      travelFee:200000,
      surface:'dirt',
      prize:isG1?[15000000,5000000,2000000]:[8000000,3000000,1200000],minAge:g.minAge
    });
  });
  // 海外遠征。世界最高峰のダート王者たちとの真剣勝負。史実の開催月のみ。
  thisWeeks(OVERSEAS_RACES,month,wom).forEach(g=>{
    races.push({
      classKey:'海外',
      name:`🌍 ${g.name}(${g.tier})`,
      baseline:Math.round(CLASSES[4].baseline*1.7),
      entryFee:120000,
      travelFee:2000000,
      surface:'dirt',
      prize:[40000000,15000000,6000000]
    });
  });
  // 地方芝重賞。盛岡競馬場の芝シーズン(6月末〜11月上旬)に合わせて開催。
  thisWeeks(LOCAL_TURF_RACES,month,wom).forEach(g=>{
    const mult=LOCAL_TURF_TIER_MULT[g.tier];
    races.push({
      classKey:'地方芝',
      name:`🌱 ${g.name}(${g.tier}・芝)`,
      baseline:Math.round(CLASSES[4].baseline*(0.75+mult*0.2)),
      entryFee:Math.round(18000*mult),
      travelFee:0,
      surface:'turf',
      prize:[5000000,1750000,1000000].map(p=>Math.round(p*mult))
    });
  });
  // 中央芝挑戦。史実の開催月のみ。
  thisWeeks(JRA_TURF_RACES.filter(g=>!CROWN_RACES.some(c=>c.name===g.name)),month,wom).forEach(g=>{ // 三冠路線のG1は決まった日付で開催
    const isG1=g.tier.includes('G1');
    races.push({
      classKey:'中央芝',
      name:`🇯🇵🌱 ${g.name}(${g.tier}・芝)`,
      baseline:Math.round(CLASSES[4].baseline*(isG1?1.35:1.18)),
      entryFee:isG1?90000:55000,
      travelFee:220000,
      surface:'turf',
      prize:isG1?[18000000,6000000,2500000]:[9000000,3300000,1400000],
      req:g.age2?{age:'2',sex:g.sex||null,min:1}:undefined,minAge:g.minAge
    });
  });
  // 海外芝挑戦。世界最高峰の芝の祭典。史実の開催月のみ。
  thisWeeks(OVERSEAS_TURF_RACES,month,wom).forEach(g=>{
    races.push({
      classKey:'海外芝',
      name:`🌍🌱 ${g.name}(${g.tier}・芝)`,
      baseline:Math.round(CLASSES[4].baseline*1.72),
      entryFee:130000,
      travelFee:2200000,
      surface:'turf',
      prize:[42000000,16000000,6500000]
    });
  });
  races.push(...crownRacesThisWeek(week)); // 三冠路線・主要G1(毎年同じ時期)
  // 中央のリステッド競走(L)。地方所属馬も3勝以上で出走でき、勝てば中央の重賞へ挑戦できる
  { // 毎週1レース、芝とダートが交互。名前・距離・開催場は週で決まる
    const turf=week%2===0,vs=JRA_VENUE_BY_MONTH[month];
    const LN=turf?['春雷','スピカ','メイ','ストークス','ケフェウス','オーロラ','ディセンバー']:['ブリリアント','アハルテケ','ポルックス','カノープス','ペルセウス','エニフ','ベテルギウス'];
    const k=Math.floor(week/2);
    races.push({classKey:'中央L',name:`🇯🇵${turf?'🌱':''} ${LN[k%LN.length]}ステークス(L${turf?'・芝':''})`,baseline:Math.round(CLASSES[4].baseline*1.1),entryFee:40000,travelFee:200000,
      surface:turf?'turf':'dirt',venue:vs[k%2],dist:(turf?[1400,1600,1800,2000]:[1400,1600,1800,2100])[k%4],prize:[7000000,2800000,1800000]});
  }
  races.push(...regionRaces(week)); // 他地区・中央へ移籍した馬のための条件戦
  return races;
}

function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}

function render(){
  const app=document.getElementById('app');
  const scrollY=window.scrollY;
  const oldBox=app.querySelector('.modal-box');
  const oldBoxY=oldBox?oldBox.scrollTop:0,oldKey=currentModalKey;
  app.innerHTML='';
  if(S.gameOver&&!autoState){app.appendChild(renderGameOver());return;}
  if(!resumePrompt&&!autoState) planTrainerEntries(false); // 今週の調教師の予定を入れる

  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  const main=document.createElement('main');
  if(activeTab==='stable') main.appendChild(renderStable());
  else if(activeTab==='market') main.appendChild(renderMarket());
  else if(activeTab==='farm') main.appendChild(renderFarm());
  else if(activeTab==='retired') main.appendChild(renderRetired());
  else main.appendChild(renderNews());
  app.appendChild(main);
  app.appendChild(renderBottomBar());

  // 背景をタップして閉じられる画面
  const closable=(ov,fn)=>{ov.addEventListener('click',e=>{if(e.target===ov){fn();render();}});return ov;};
  let key='';
  if(resumePrompt){
    key='resume';app.appendChild(renderResumePrompt());
  } else if(autoState){
    key='auto';app.appendChild(renderAutoProgress());
  } else if(autoSetupOpen){
    key='autoset';app.appendChild(closable(renderAutoSetup(),()=>{autoSetupOpen=false;}));
  } else if(admissionHorseId && S.horses.some(x=>x.id===admissionHorseId)){
    key='adm:'+admissionHorseId;app.appendChild(renderAdmissionModal());
  } else if(modalQueue.length>0){
    key='q:'+modalIndex;app.appendChild(renderModal());
  } else if(auction){
    key='auc';app.appendChild(renderAuctionModal());
  } else if(facilityOpen){
    key='fac';app.appendChild(closable(renderFacilityModal(),()=>{facilityOpen=false;}));
  } else if(saveIOOpen){
    key='saveio';app.appendChild(renderSaveIO());
  } else if(ownerSetupOpen){
    key='owner';app.appendChild(renderOwnerSetup());
  } else if(transferHorseId){
    key='xfer';app.appendChild(closable(renderTransferModal(),()=>{transferHorseId=null;}));
  } else if(farmMatingMareId){
    key='mate:'+farmMatingMareId+(farmMatingPick||'');app.appendChild(closable(renderMatingModal(),()=>{farmMatingMareId=null;farmMatingPick=null;}));
  } else if(careerHorseId){
    key='career';app.appendChild(closable(renderCareerModal(),()=>{careerHorseId=null;}));
  } else if(supportersOpen){
    key='sup';app.appendChild(closable(renderSupporters(),()=>{supportersOpen=false;}));
  } else if(repOpen){
    key='rep';app.appendChild(closable(renderRepScreen(),()=>{repOpen=false;}));
  } else if(retireOffer){
    key='offer';app.appendChild(closable(renderRetireOfferModal(),()=>{retireOffer=null;}));
  } else if(retiredDetailId){
    key='rd:'+retiredDetailId;app.appendChild(closable(renderRetiredDetailModal(),()=>{retiredDetailId=null;}));
  } else if(npcDetailId){
    key='npc:'+npcDetailId;app.appendChild(closable(renderNpcDetail(),()=>{npcDetailId=null;}));
  } else if(horseDetail){
    key='hd:'+horseDetail.id;app.appendChild(closable(renderHorseDetailModal(),()=>{horseDetail=null;}));
  } else if(romanceOpen){
    key='rom';app.appendChild(closable(renderRomancePanel(),()=>{romanceOpen=false;}));
  } else if(cheatPanelOpen){
    key='cheat';app.appendChild(closable(renderCheatPanel(),()=>{cheatPanelOpen=false;}));
  } else if(helpOpen){
    key='help';app.appendChild(closable(renderHelp(),()=>{helpOpen=false;}));
  } else if(menuOpen){
    key='menu';app.appendChild(closable(renderMenu(),()=>{menuOpen=false;}));
  }
  if(confirmDialog) app.appendChild(renderConfirmDialog());
  currentModalKey=key;
  // 再描画してもスクロール位置が先頭に戻らないようにする
  window.scrollTo(0,scrollY);
  const nb=app.querySelector('.modal-box');
  if(nb && key===oldKey) nb.scrollTop=oldBoxY;
  // 週の合間(結果表示中でないとき)に自動セーブ
  if(!resumePrompt && modalQueue.length===0 && !admissionHorseId && !(autoState&&!autoState.finished)) scheduleSave();
}

function renderTabs(){
  const tabs=[['stable','厩舎'],['market','市場'],['farm',`牧場${ownedMares().length+(S.homebreds||[]).length?'('+(ownedMares().length+(S.homebreds||[]).length)+')':''}`],['retired',`引退馬${(S.retired||[]).length?'('+S.retired.length+')':''}`],['news','ニュース']];
  const wrap=el(`<div class="tabs"></div>`);

function renderHorseCard(h,gateNo){
  if(h.age<2) return renderYearlingCard(h,gateNo);
  const cls=horseClass(h);
  const coat=coatInfo(h.coat);
  const open=expandedCards.has(h.id);
  const card=el(`<div class="horse-card"></div>`);
  const condCls=h.condition>=70?'good':h.condition>=40?'mid':'low';
  const top=el(`<div class="horse-top tappable">
    <div class="horse-avatar">${horseIconSVG(h)}</div>
    <div style="flex:1;min-width:0">
      <div class="horse-title">『${h.title}』</div>
      <div class="horse-name">${h.name}</div>
      <div class="horse-meta">${h.sex}${h.age} / ${horseRegion(h)!=='minami'?REGIONS[horseRegion(h)].name.replace(/\(.*\)/,'')+'・':''}${horseClassLabel(h)} / ${h.races}戦${h.wins}勝${h.top3>h.wins?'(複'+h.top3+')':''} / ${(trainerOf(h)||{stable:'未入厩'}).stable}${shareLabel(h)?' / 🤝'+shareLabel(h):''}</div>
      <div class="cond-row"><span>状態</span><div class="cond-track"><div class="cond-fill ${condCls}" style="width:${clamp(h.condition,0,100)}%"></div></div><b>${h.condition}</b></div>
      <div class="badges">${statusBadgesHtml(h)}</div>
      ${drillHtml(h)}
    </div>
    <div class="detail-chev">›</div>
  </div>`);
  top.onclick=()=>{horseDetail=h;render();};
  card.appendChild(top);

  // ---- 今週のレース ----
  const sec=el(`<div class="race-sec"><div class="sec-h">今週のレース</div></div>`);
  const tPlan=trainerPlanOf(trainerOf(h));
  if(tPlan){
    const mode=h.raceMode==='owner'?'owner':'trainer';
    const mrow=el(`<div class="mode-row"><span>レース選び</span><div class="seg"></div></div>`);
    [['trainer','調教師におまかせ'],['owner','自分で選ぶ']].forEach(([m,l])=>{
      const b=el(`<button class="ctl-btn ${mode===m?'active':''}">${l}</button>`);
      b.onclick=()=>{h.raceMode=m;h.trainerPlanWeek=null;h.ownerChoiceWeek=null;if(m==='owner')h.pendingAction=null;render();};
      mrow.querySelector('.seg').appendChild(b);
    });
    sec.appendChild(mrow);
    if(mode==='trainer'){
      const overridden=h.ownerChoiceWeek===S.week;
      sec.appendChild(el(`<div class="trainer-note">🧑‍🏫 ${trainerOf(h).name}調教師(${tPlan.label}):${overridden?'<span class="ov">今週はあなたの指示で変更中(来週から調教師に戻ります)</span>':(h.trainerNote||'—')}</div>`));
    }
  }
  const races=eligibleRacesFor(h);
  const blocked=h.injury>0?`故障療養中のため出走できません(あと${h.injury}週)`:h.condition<40?'疲労のため今週は出走できません(状態40以上で出走可)':'';
  if(blocked) sec.appendChild(el(`<div class="race-note bad">${blocked}</div>`));
  else if(races.length===0) sec.appendChild(el(`<div class="race-note">今週はクラス条件に合うレースがありません</div>`));
  else {
    const list=el(`<div class="race-list"></div>`);
    const none=el(`<button class="race-opt ${!(h.pendingAction&&h.pendingAction.type==='race')?'selected':''}"><b>出走しない</b><small>調教師に調教・休養をまかせる</small></button>`);
    none.onclick=()=>{h.pendingAction=null;h.ownerChoiceWeek=S.week;render();};
    list.appendChild(none);
    const specialMap={'中央':'jra','中央芝':'jra','海外':'ov','海外芝':'ov','地方芝':'turf'};
    races.forEach(({r,i,tag})=>{
      const sel=h.pendingAction&&h.pendingAction.type==='race'&&h.pendingAction.raceIdx===i;
      const fee=r.entryFee+(r.travelFee||0);
      const fit=Math.abs(r.dist-(h.optDist||r.dist))<=200?'<span class="fit ok">距離◎</span>':Math.abs(r.dist-(h.optDist||r.dist))<=400?'<span class="fit">距離○</span>':'<span class="fit ng">距離△</span>';
      const b=el(`<button class="race-opt ${specialMap[r.classKey]||''} ${sel?'selected':''}"><b>${shortRaceName(r.name)}${tag?`<span class="race-tag">${tag}</span>`:''}</b><small>${venueShortName(r)} ${r.surface==='turf'?'芝':'ダート'}${r.dist}m ${fit} ・ 1着 ${yen(r.prize[0])} ・ 費用 ${yen(fee)}</small></button>`);
      b.onclick=()=>{
        const keep=(h.pendingAction&&h.pendingAction.type==='race')?h.pendingAction.jockeyKey:null;
        h.pendingAction={type:'race',raceIdx:i,jockeyKey:keep,by:'owner'};
        h.ownerChoiceWeek=S.week;
        render();
      };
      list.appendChild(b);
    });
    sec.appendChild(list);
    if(h.pendingAction&&h.pendingAction.type==='race'&&S.weekRaces[h.pendingAction.raceIdx]){
      sec.appendChild(renderJockeyRow(h));
      sec.appendChild(el(`<div class="cost-line">この馬の参戦費用 合計 <b>${yen(raceCostFor(h))}</b>(登録料・遠征費・騎乗料)</div>`));
    }
  }
  card.appendChild(sec);

  // ---- 詳細(能力・血統・各種操作) ----
  const tog=el(`<button class="toggle-btn">${open?'▲ 閉じる':'▼ 能力・血統・転厩・引退'}</button>`);
  tog.onclick=()=>{open?expandedCards.delete(h.id):expandedCards.add(h.id);render();};
  card.appendChild(tog);
  if(open){
    const det=el(`<div class="card-detail"></div>`);
    det.appendChild(el(`<div class="pedigree-line">${h.foreign?`<span class="mk">(外)</span>${h.foreign.country} `:''}父:<b>${h.sireName}</b> 母:<b>${h.damName}</b> 母父:<b>${h.damSireName}</b>${h.nick?`<span class="nick-badge">◎${h.nick}</span>`:''}</div>`));
    det.appendChild(el(`<div class="pedigree-line">${coat.name}${h.blaze?'・流星':''} / 脚質:<b>${h.runStyle}</b> 適距離:<b>${optDistRange(h)}</b>${traitLineHtml(h)}${lineSummary(h)}${crossSummary(h)}</div>`));
    if(h.uniqueSkill){
      const sk=uniqueSkillInfo(h.uniqueSkill);
      det.appendChild(el(`<div class="skill-badge">✨ 固有能力:${sk.name}<span class="skill-desc">${sk.desc}</span></div>`));
    }
    const bars=el(`<div class="bars"></div>`);
    bars.innerHTML=statBar('スピード',h.speed,'speed')+statBar('スタミナ',h.stamina,'stamina')+statBar('根性',h.guts,'guts')+statBar('ダート適性',h.dirtApt,'dirt')+statBar('芝適性',h.turfApt,'turf');
    det.appendChild(bars);
    det.appendChild(renderHorseActions(h));
    card.appendChild(det);
  }
  return card;
}

/* ================= WEEK ADVANCE / RACE LOGIC ================= */
function advanceWeek(opts){
  const silent=!!(opts&&opts.silent===true);
  const injuryNotices=[];
  const simulatedNpc=new Set();
  const report=[]; // queue items {type:'race',...}|{type:'notice',text}|{type:'summary',...}
  let prizeTotal=0;

  // group entrants per race index
  const raceGroups=S.weekRaces.map(()=>[]);
  S.horses.forEach(h=>{
    if(h.pendingAction && h.pendingAction.type==='race' && h.condition>=40 && !(h.injury>0)){
      raceGroups[h.pendingAction.raceIdx].push(h);
    }
  });

  // resolve races that have at least 1 player entrant
  S.weekRaces.forEach((r,i)=>{
    const entrants=raceGroups[i];
    if(entrants.length===0) return;
    if(r.snowCancel){ // 降雪のため開催中止
      injuryNotices.push(`❄ ${venueOf(r).name}は降雪のため開催中止。${entrants.map(h=>h.name).join('、')}の${shortRaceName(r.name)}は取りやめ(費用はかからない)。`);
      entrants.forEach(h=>{h.pendingAction=null;});
      return;
    }
    const field=[];
    const surface=r.surface||'dirt';
    entrants.forEach(h=>{
      let jockey=getJockey(h.pendingAction.jockeyKey);
      if(jockey&&!jockeyAvailable(jockey).ok){ // 評判が足りず騎乗を断られた
        const alt=JOCKEYS.map(j=>getJockey(j.key)).filter(j=>jockeyAvailable(j).ok).sort((a,b)=>b.skill-a.skill)[0];
        const why=jockeyAvailable(jockey).reason;
        injuryNotices.push(why==='引退'||why==='短期免許の期間外'?`🔁 ${jockey.name}騎手は${why==='引退'?'引退した':'帰国した'}ため、${alt.name}騎手が${h.name}に騎乗。`:`🙅 ${jockey.name}騎手に${h.name}への騎乗を断られた(馬主の評判不足)。${alt.name}騎手が代わりに騎乗。`);
        jockey=alt;
      }
      const base=h.speed*0.4+h.stamina*0.35+h.guts*0.25;
      const condFactor=0.6+0.4*(h.condition/100);
      const turfFactor=surface==='turf'?(0.55+0.5*(h.turfApt/100)):1;
      const dirtFactor=surface==='dirt'?(0.75+0.35*(h.dirtApt/100)):1;
      const skillBonus=uniqueSkillBonus(h,r,jockey.style);
      const trainerBonus=trainerOf(h)?trainerOf(h).skill*1.2:0; // 調教師の仕上げの腕
      const avgStat=Math.max(1,(h.speed+h.stamina+h.guts)/3);
      const distPen=Math.abs(r.dist-(h.optDist||r.dist))/100*0.7; // 距離が合わないぶんの割引
      const power=base*condFactor*turfFactor*dirtFactor+jockeyBonus(h,jockey)+skillBonus+trainerBonus+randInt(-12,12)-distPen+mudPowerAdj(ensureMud(h),r)+(h.freshBonus||0)+extraPower(h,r,jockey);
      field.push({isPlayer:true,horse:h,power,name:h.name,jockeyName:jockey.name,jockeyFee:jockey.fee,jockeyKey:jockey.key,
        runStyle:h.runStyle,optDist:h.optDist,stamRatio:h.stamina/avgStat,gutsRatio:h.guts/avgStat,
        jockeyStyle:jockey.style,jockeySkill:jockey.skill,temper:h.temper,frail:h.frail});
    });
    // 他厩舎の馬(NPC)。年齢・成績・クラスを持ち、毎年成長・引退していく
    r._simulated=true;
    const target=(r.grade||r.crownRace)?randInt(12,16):randInt(8,12);
    const aiCount=Math.max(3,Math.min(16,target)-entrants.length);
    pickNpcField(r,aiCount,simulatedNpc).forEach(n=>{
      simulatedNpc.add(n.id);
      const surf=r.surface==='turf'?(0.7+0.3*n.turf/100)/0.94:(0.85+0.15*n.dirt/100)/0.97;
      const power=npcPower(n)*surf+randInt(-8,8)-Math.abs(r.dist-n.optDist)/100*0.7+mudPowerAdj(npcMud(n),r);
      field.push({isPlayer:false,npc:n,power,name:n.name,runStyle:n.runStyle,optDist:n.optDist,stamRatio:n.stamRatio,gutsRatio:n.gutsRatio,temper:n.temper});
    });
    // ランダムな枠順(ゲート番号)を決める。着順とは無関係の表示順なので、
    // ここでネタバレせずに出走表・オッズを見せられる。
    for(let i=field.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [field[i],field[j]]=[field[j],field[i]];
    }
    field.forEach((f,idx)=>{f.gateNo=idx+1;});
    const gateOrder=[...field];
    const pace=assignRunStyles(field);
    field.forEach(setDayForm); // 当日の気配(パドック)
    computeOdds(field);
    const sim=simulateRace(r,field,pace); // 着順・タイムはレース展開から決まる
    field.sort((a,b)=>a.rank-b.rank);

    // apply outcomes to player horses
    let feeTotal=0, prizeGain=0;
    entrants.forEach(h=>{
      const f=field.find(x=>x.horse===h);
      feeTotal+=Math.round((r.entryFee+(r.travelFee||0)+f.jockeyFee)*shareOf(h));
      {const lw=lastRaceWeekOf(h);
       if(h.age>=8) adjustRep(-0.5,0,`${h.name}:${h.age}歳でも出走`);
       if(h.condition<50) adjustRep(-1,-0.3,`${h.name}:状態${h.condition}のまま出走`);
       if(lw!=null&&S.week-lw<=1) adjustRep(-0.5,0,`${h.name}:連闘`);}
      h.races+=1;
      h.condition=clamp(h.condition-randInt(25,35)-Math.round((h.frail==null?35:h.frail)*0.12),5,100);
      if(Math.random()<((h.frail==null?35:h.frail)*0.0007+tendonOf(h)*0.0005)*(hasFac('vet')?0.8:1)){ // 体質が弱いほど故障しやすい
        const inj=rollInjury(h,'race');
        adjustRep(inj.serious?-0.5:-0.2,inj.serious?-1:0,`${h.name}:レースで${inj.name}`);
        injuryNotices.push(injuryText(h,inj,'race'));
      }
      if(f.rank<=3) h.top3+=1;
      h.freshBonus=0;
      if(f.rank===1&&f.jockeyKey&&S.jockeyData&&S.jockeyData[f.jockeyKey]) S.jockeyData[f.jockeyKey].yearWins=(S.jockeyData[f.jockeyKey].yearWins||0)+1;
      if(horseRegion(h)==='jra') h.jraRaces=(h.jraRaces||0)+1;
      if(f.rank===1){h.wins+=1;if(horseRegion(h)==='jra')h.jraWins=(h.jraWins||0)+1;adjustRep(0,isG1Grade(r.grade)?5:r.grade?2:0.5,isG1Grade(r.grade)?`${h.name}:${r.name}優勝`:r.grade?`${h.name}:重賞${r.name}優勝`:'');}
      if(f.jockeyKey){
        h.combo=h.combo||{};h.combo[f.jockeyKey]=(h.combo[f.jockeyKey]||0)+1;
        const gain=3+(f.rank===1?5:f.rank<=3?2:0);
        S.jockeyAffection[f.jockeyKey]=clamp((S.jockeyAffection[f.jockeyKey]||0)+gain,0,100);
      }
      const p=f.rank<=3?r.prize[f.rank-1]:0;
      yearStatAdd(h,f,r,p);
      lineageStatAdd(h,f,r);
      prizeGain+=Math.round(p*shareOf(h)); // 共有馬は持ち分ぶんだけ
      if(!h.history) h.history=[];
      h.history.push({week:S.week,raceName:r.name,rank:f.rank,fieldSize:field.length,prize:p,jockeyName:f.jockeyName,timeSec:f.timeSec,dist:r.dist,going:r.going,grade:r.grade||null,venue:r.venue});
      h.pendingAction=null;
    });
    S.money+=prizeGain-feeTotal;
    prizeTotal+=prizeGain-feeTotal;

    const featItems=[];
    checkFeats(r,field,featItems,sim);
    // ライバル・宿敵との再戦を実況で
    field.filter(f=>f.isPlayer).forEach(p=>{
      field.filter(f=>f.npc).forEach(f=>{
        const rec=(p.horse.rivals||{})[f.npc.id];
        if(!rec||!rec.status) return;
        const lb=rec.status==='nemesis'?'宿敵':'ライバル';
        sim.events.push({t:0.4,text:`注目は${p.name}と${lb}${f.name}の再戦!これまで${rec.met}度の対戦、${p.name}の${rec.behind}勝${rec.ahead}敗。`});
        if(Math.min(p.rank,f.rank)===1&&Math.max(p.rank,f.rank)<=3) sim.events.push({t:Math.min(p.timeSec,f.timeSec)+1.0,text:`${lb}対決を制したのは${p.rank<f.rank?p.name:f.name}!`});
      });
    });
    sim.events.sort((a,b)=>a.t-b.t);
    rivalRaceNotes(r,field,featItems);
    afterRaceNpc(r,field,featItems);
    const cond=raceCondLabel(r);
    const headline=makeHeadline(r,field);
    fanLetterAfterRace(featItems,r,field);
    const raceItem={type:'race',headline,raceName:r.name,prizeTable:r.prize,field,feeTotal,prizeGain,bets:[],sim,cond,dist:r.dist,venue:r.venue,surface:r.surface||'dirt',recordAfter:recordText(r)};
    const entryItem={type:'entry',raceName:r.name,gateOrder,race:raceItem,cond,pace,record:recordText(r),crown:crownLabelForRace(r.name)};
    report.push(entryItem);
    report.push(raceItem);
    featItems.forEach(x=>report.push(x));
  });

  farewellCheck(report);
  injuryNotices.forEach(t=>report.push({type:'notice',text:t}));
  // 出走しなかった馬は、調教師が状態を見て調教するか休養させるかを決める
  const trainingLines=[];
  S.horses.forEach(h=>{
    const raced=raceGroups.some(g=>g.includes(h));
    h.pendingAction=null;
    if(raced) return;
    if(h.age<2) return; // 1歳馬は育成牧場にいる
    if(h.layoff){layoffWeekly(h,trainingLines);return;}
    if(h.injury>0){
      h.injury--;
      h.condition=clamp(h.condition+15,0,100);
      trainingLines.push(`<b>${h.name}</b>:🩹 ${h.injuryName||'故障'}で療養中${h.injury>0?`(あと${h.injury}週)`:'。全快した!'}`);
      if(h.injury<=0) h.injuryName=null;
      return;
    }
    const t=trainerOf(h);
    const plan=trainerPlan(h,t);
    const who=t?`${t.stable}`:'';
    if(plan.kind==='rest'){
      h.condition=clamp(h.condition+plan.recover+(hasFac('hill')?2:0),0,100);
      trainingLines.push(`<b>${h.name}</b>(${who}):疲労が残っているため休養。状態が回復した。`);
    } else {
      h[plan.stat]=bumpStat(h[plan.stat],plan.gain*(hasFac('wood')?1.15:1));
      h.condition=clamp(h.condition-plan.cost-Math.round((h.frail==null?35:h.frail)*0.06)-([7,8].includes(calendarParts(S.week).month)&&(h.frail||35)>=55?3:0),0,100); // 体質の弱い馬は夏負けしやすい
      trainingLines.push(`<b>${h.name}</b>(${who}):${TRAIN_STAT_LABEL[plan.stat]}を強化。${TRAIN_STAT_LABEL[plan.stat]} +${plan.gain}`);
      if(Math.random()<((h.frail==null?35:h.frail)*0.00018+tendonOf(h)*0.00012)*(hasFac('vet')?0.8:1)){
        const inj=rollInjury(h,'train');
        trainingLines.push(injuryText(h,inj,'train'));
      }
    }
  });
  if(trainingLines.length>0){
    report.push({type:'training',lines:trainingLines});
  }

  npcWeekly(simulatedNpc,report); // 他厩舎の馬もそれぞれのレースを走る
  // 預託料(各厩舎への週あたりの支払い)
  const upkeep=weeklyFees()+supporterFees()+farmFees();
  S.money-=upkeep;

  // 暦を進める
  const prevCal=calendarParts(S.week);
  S.week+=1;
  const newCal=calendarParts(S.week);

  // 加齢は実際の競走馬と同じく1月1日に一斉に1歳を重ねる
  if(newCal.yearIndex>prevCal.yearIndex){
    const retiredNames=[];
    yearEndAwards(report); // 前年の年度表彰と馬主リーディング
    jockeyYearEnd(report); // 騎手リーディング・引退・新人デビュー
    yearReviewReport(prevCal.yearIndex,report); // 1年の振り返りカード
    updateLineTrends(report); // 父系の流行り廃り
    sireYearNotice(report,prevCal.yearIndex);
    S.horses.forEach(h=>h.age+=1);
    const grown=S.horses.filter(h=>h.unnamed&&h.age>=2);
    if(grown.length>0){
      if(!S.pendingAdmissions) S.pendingAdmissions=[];
      grown.forEach(h=>{if(!S.pendingAdmissions.includes(h.id)) S.pendingAdmissions.push(h.id);});
      report.push({type:'notice',text:`🐴 ${grown.map(h=>h.name).join('、')}が2歳になった。馬名をつけて、預ける厩舎を決めよう。`});
    }
    farmYearEnd(report);
    growthSeasonReport(report,0);
    processBreedingYear(newCal.yearIndex,report); // 種牡馬・繁殖牝馬の1年(種付・産駒・成績)
    npcYearEnd(report); // 他厩舎の馬も加齢・引退・新馬デビュー
    // 年が明けると評判は少しずつ戻り、ファンの熱は少し冷める(活躍し続けないと維持できない)
    {ensureRep();const dR=S.rep<50?3:1,dF=-Math.round(S.fans*0.1*10)/10;adjustRep(dR,dF,'年明け(評判の回復・ファンの入れ替わり)');}
    S.horses.filter(h=>h.age>=9).forEach(h=>{
      const kind=h.sex==='牡'?(sireEligible(h)?'sire':null):'dam';
      if(kind){
        // 年齢引退と同時に、最も条件の良い施設へ種牡馬・繁殖入りする
        const best=buildOffers(h,kind).filter(o=>o.ok).sort((a,b)=>b.price-a.price)[0];
        if(best){
          retireToBreeding(h,kind,best.st,best.price);
          retiredNames.push(`${h.name}(${kind==='sire'?'種牡馬入り':'繁殖入り'}:${best.st.name} ${yen(best.price)})`);
          return;
        }
      }
      const c=CAREERS.find(x=>x.key===((h.temper==null?35:h.temper)<75?'riding':'pension'));
      applyCareer(h,c,true);
      retiredNames.push(`${h.name}(${c.name})`);
    });
    S.horses=S.horses.filter(h=>h.age<9);
    if(retiredNames.length>0){
      report.push({type:'notice',text:`1月1日、馬たちは一斉に1歳を重ねた。年齢のため引退:${retiredNames.join('、')}`});
    } else {
      report.push({type:'notice',text:`1月1日、所有馬は一斉に1歳を重ねた。`});
    }
  }

  farmWeekly(report); // 自家生産:出産・入厩待ち
  weeklyOffers(report);
  retiredLetters(report);
  shortTermNotice(report);
  fanVoteWeek(S.week).forEach(c=>runFanVote(c,report));
  fanLetterWeekly(report);
  if(newCal.month===7&&prevCal.month!==7) growthSeasonReport(report,1);
  classChangeCheck(report);
  // 繁殖馬セール(12月)
  if(newCal.month===12&&prevCal.month!==12){S.mareSaleActive=true;S.mareSaleMarket=Array.from({length:7},()=>makeMareLot());
    report.push({type:'notice',text:`🏡 繁殖馬セールが開幕した。引退した名牝や良血牝馬、受胎済みの馬などが数十万〜数億円で上場されている(市場タブ)。`});}
  else if(newCal.month!==12&&prevCal.month===12&&S.mareSaleActive){S.mareSaleActive=false;S.mareSaleMarket=[];report.push({type:'notice',text:'繁殖馬セールが閉幕した。'});}
  // market refresh every 4 weeks
  if(S.week%4===0){
    S.market=[makeHorse(randInt(2,9)),makeHorse(randInt(2,9)),makeHorse(randInt(2,9)),makeHorse(randInt(2,9))];
    report.push({type:'notice',text:`市場に新しい馬が入荷した。`});
  }

  // サマーセール。実際の夏(7月)に合わせて開催される小規模〜中規模牧場のセリ。
  if(newCal.month===7 && prevCal.month!==7){
    S.summerSaleActive=true;
    S.summerSaleMarket=[makeSummerSaleHorse(),makeSummerSaleHorse(),makeSummerSaleHorse(),makeSummerSaleHorse(),makeSummerSaleHorse()];
    report.push({type:'notice',text:`サマーセールが開幕した。中小牧場の馬たちが安く並ぶ一方、掘り出し物の大物が紛れていることも…?`});
  } else if(newCal.month!==7 && prevCal.month===7){
    S.summerSaleActive=false;
    S.summerSaleMarket=[];
    report.push({type:'notice',text:`サマーセールが閉幕した。`});
  }

  // 開催中のセールでは、毎週いくらかの馬が他の馬主に落札されていく
  const sellOff=(list,label)=>{
    const sold=[];
    const rest=list.filter(h=>{
      if(Math.random()<0.18){sold.push(h);return false;}
      return true;
    });
    if(sold.length>0){
      report.push({type:'notice',text:`${label}:${sold.map(h=>`${h.name}(${yen(Math.round(h.price*(1+randInt(0,25)/100)))})`).join('、')}が他の馬主に落札された。`});
    }
    return rest;
  };
  if(S.mixSaleActive && !(newCal.month===10 && prevCal.month!==10)) S.mixSaleMarket=sellOff(S.mixSaleMarket,'ミックスセール');
  if(S.secondSaleActive && !(newCal.month===11 && prevCal.month!==11)) S.secondSaleMarket=sellOff(S.secondSaleMarket,'セカンドセール');

  // 海外の1歳馬セール(8月アルカナ・9月キーンランド・10月タタソールズ)
  {const os=OVERSEAS_SALES.find(x=>x.m===newCal.month);
   if(os&&prevCal.month!==newCal.month){
     S.osSaleActive=true;S.osSaleKey=os.key;S.osSaleMarket=Array.from({length:6},()=>makeOverseasSaleHorse(os));
     report.push({type:'notice',text:`🌍 ${os.name}(${os.place})が開幕。${os.region==='us'?'Into Mischief・Tapit・Curlin・Gun Runner・Justify':'Frankel・Dubawi・Sea the Stars・Kingman'}などの産駒が上場されている。`});
   } else if(!os&&S.osSaleActive){
     S.osSaleActive=false;S.osSaleMarket=[];
     report.push({type:'notice',text:`海外セールの期間が終わった。`});
   } else if(S.osSaleActive&&!(newCal.month===prevCal.month)&&os){}
  }
  // ミックスセール(1月)。大手から零細まで、超良血から無名血統までが並ぶ。
  if(newCal.month===10 && prevCal.month!==10){
    S.mixSaleActive=true;
    S.mixSaleMarket=Array.from({length:8},()=>makeMixSaleHorse());
    S.mixLeftover=[];
    consignAtSale('mix',report);
    report.push({type:'notice',text:`ミックスセール(1歳馬セール)が開幕した。大手牧場の超良血から零細牧場の無名血統まで、数百万〜数億円の1歳馬が上場されている。`});
  } else if(newCal.month!==10 && prevCal.month===10 && S.mixSaleActive){
    S.mixLeftover=S.mixSaleMarket.slice();
    S.mixSaleActive=false;
    S.mixSaleMarket=[];
    report.push({type:'notice',text:`ミックスセールが閉幕した。売れ残り${S.mixLeftover.length}頭はセカンドセールに回される。`});
  }
  // セカンドセール(3月)。ミックスセールの売れ残りと、庭先取引で売れなかった馬。
  if(newCal.month===11 && prevCal.month!==11){
    const left=(S.mixLeftover||[]).slice(0,4).map(toSecondSale);
    const fresh=Array.from({length:8-left.length},()=>makeSecondSaleHorse());
    S.secondSaleActive=true;
    S.secondSaleMarket=[...left,...fresh];
    S.mixLeftover=[];
    consignAtSale('second',report);
    report.push({type:'notice',text:`セカンドセール(1歳馬セール)が開幕した。ミックスセールの売れ残りや、零細牧場の庭先取引で売れなかった1歳馬が数百万〜数千万円で並ぶ。`});
  } else if(newCal.month!==11 && prevCal.month===11 && S.secondSaleActive){
    S.secondSaleActive=false;
    S.secondSaleMarket=[];
    report.push({type:'notice',text:`セカンドセールが閉幕した。`});
  }

  S.weekRaces=pickWeekRaces(S.week);
  S.totals.prize+=prizeTotal;
  S.totals.upkeep+=upkeep;

  // build news entries from report
  report.forEach(item=>{
    if(item.type==='race'){
      const mine=item.field.filter(f=>f.isPlayer);
      mine.forEach(f=>{
        addNews(`${f.name}(${f.jockeyName})が${item.raceName}で${f.rank}着(全${item.field.length}頭)。`,f.rank<=3?'win':'');
      });
    } else if(item.type==='notice'){
      addNews(item.text,'');
    }
  });
  addNews(`週間収支:賞金等 ${yen(prizeTotal)} / 預託料 ${yen(-upkeep)}`, (prizeTotal-upkeep)>=0?'money-in':'money-out');

  weeklyColumn(report);
  report.push({type:'summary',prizeTotal,upkeep,net:prizeTotal-upkeep});

  if(S.money<-500000){
    S.gameOver=true;
  }

  if(silent) return report;
  modalQueue=report;
  modalIndex=0;
  render();
}

/* ================= MODAL ================= */
function renderModal(){
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);
  const item=modalQueue[modalIndex];

  if(item.type==='entry'){
    if(!item.draft) item.draft={type:'win',picks:[],amount:0};
    const draft=item.draft;
    const NEED_PICKS={win:1,place:1,quinella:2,wide:2,trifecta:3,trio:3};
    const TYPE_LABEL={win:'単勝',place:'複勝',quinella:'馬連',wide:'ワイド',trifecta:'三連単',trio:'三連複'};
    box.appendChild(el(`<div class="modal-title">出走表:${item.raceName}</div>`));
    box.appendChild(el(`<div class="modal-sub">オッズを見て、馬券を何枚でも買ってからレースへ進もう</div>`));
    box.appendChild(el(`<div class="mk-legend">${markLegendHtml(item.race)}</div>`));
    box.appendChild(el(`<div class="race-cond">${item.crown?`<span class="crown-tag">👑 ${item.crown}</span><br>`:''}${item.cond}<br><small>${item.record||''}</small><br>展開予想:<b>${item.pace.label}</b>(逃げ${item.pace.nige}頭・先行${item.pace.sen}頭)<small>${item.pace.label==='ハイペース'?' 前が潰れやすく差し・追込向き':item.pace.label==='スローペース'?' 前残りで逃げ・先行向き':' 力通りの決着になりやすい'}</small></div>`));

    const list=el(`<div class="entry-list"></div>`);
    item.gateOrder.forEach(f=>{
      const pickIdx=draft.picks.indexOf(f.gateNo);
      const isSel=pickIdx>=0;
      const orderTag=(draft.type==='trifecta' && isSel)?`<span class="pick-order">${pickIdx+1}着予想</span>`:'';
      const row=el(`<div class="entry-row ${isSel?'selected':''}">
        <span class="entry-gate" style="background:${wakuOf(f.gateNo,item.gateOrder.length).bg};color:${wakuOf(f.gateNo,item.gateOrder.length).fg}">${f.gateNo}</span>
        ${f.isPlayer?`<span class="jockey-avatar" style="width:22px;height:22px;">${horseIconSVG(f.horse)}</span>`:'<span style="width:18px;text-align:center;">🐎</span>'}
        <span class="entry-name">${f.isPlayer?silkSVG(null,14):''}${horseMarkHtml(f,item.race)}${f.name}${f.isPlayer?' <b>(自厩舎)</b>':''}${paddockFor(f,item)}${orderTag}<br><small class="style-line"><span class="style-tag">${f.style}</span>${f.isPlayer?` 適距離${f.optDist}m`:f.npc?` ${NPC_CAT_LABEL[f.npc.cat]} ${f.npc.sex}${f.npc.age} ${f.npc.races}戦${f.npc.wins}勝${f.npc.g1?' G1級'+f.npc.g1+'勝':''}`:''}${(()=>{if(!f.npc)return'';const st=item.gateOrder.filter(x=>x.isPlayer).map(x=>((x.horse.rivals||{})[f.npc.id]||{}).status).filter(Boolean);const s2=st.includes('nemesis')?'nemesis':st[0];return s2?` <span class="rv-tag ${s2}">${RIVAL_LABEL[s2]}</span>`:'';})()}</small></span>
        <span class="entry-odds">単${f.winOdds.toFixed(1)}<br><small>複${f.placeOdds.toFixed(1)}</small></span>
      </div>`);
      row.onclick=()=>{
        const maxPicks=NEED_PICKS[draft.type];
        if(isSel){
          draft.picks=draft.picks.filter(g=>g!==f.gateNo);
        } else {
          if(draft.picks.length>=maxPicks) draft.picks.shift();
          draft.picks.push(f.gateNo);
        }
        render();
      };
      list.appendChild(row);
    });
    box.appendChild(list);

    const typeRow=el(`<div class="bet-type-row"></div>`);
    [['win','単勝'],['place','複勝'],['quinella','馬連'],['wide','ワイド'],['trifecta','三連単'],['trio','三連複']].forEach(([k,label])=>{
      const b=el(`<button class="act-btn ${draft.type===k?'selected':''}">${label}</button>`);
      b.onclick=()=>{draft.type=k;draft.picks=[];render();};
      typeRow.appendChild(b);
    });
    box.appendChild(typeRow);
    if(draft.type==='trifecta'){
      box.appendChild(el(`<div class="warn-line" style="padding:0 0 8px;color:var(--text-dim);">三連単はタップした順が予想着順になる(1頭目→1着予想)</div>`));
    }

    const amtRow=el(`<div class="bet-amount-row"></div>`);
    const amtInput=el(`<input type="number" inputmode="numeric" class="bet-amount-input" min="0" step="100" placeholder="金額を入力" value="${draft.amount||''}">`);
    const summaryDiv=el(`<div class="bet-summary">この馬券: ${yen(draft.amount)}</div>`);
    const allInBtn=el(`<button class="act-btn">全額</button>`);
    const clearBtn=el(`<button class="act-btn">リセット</button>`);
    amtRow.appendChild(amtInput);
    amtRow.appendChild(allInBtn);
    amtRow.appendChild(clearBtn);
    box.appendChild(amtRow);
    box.appendChild(summaryDiv);

    const needPicks=NEED_PICKS[draft.type];
    const refreshBuyState=()=>{
      const ok=draft.picks.length===needPicks && draft.amount>0 && draft.amount<=S.money;
      addBtn.disabled=!ok;
      summaryDiv.textContent=`この馬券: ${yen(draft.amount)}`;
      return ok;
    };
    amtInput.oninput=()=>{
      let v=parseInt(amtInput.value,10);
      if(isNaN(v)||v<0) v=0;
      draft.amount=v;
      refreshBuyState();
    };
    allInBtn.onclick=()=>{draft.amount=S.money;amtInput.value=draft.amount;refreshBuyState();};
    clearBtn.onclick=()=>{draft.amount=0;amtInput.value='';refreshBuyState();};

    const addBtn=el(`<button class="modal-next">この馬券をカートに追加</button>`);
    addBtn.onclick=()=>{
      if(!refreshBuyState()) return;
      let odds;
      if(draft.type==='win') odds=item.gateOrder.find(f=>f.gateNo===draft.picks[0]).winOdds;
      else if(draft.type==='place') odds=item.gateOrder.find(f=>f.gateNo===draft.picks[0]).placeOdds;
      else if(draft.type==='quinella'||draft.type==='wide') odds=pairOdds(item.gateOrder,draft.picks[0],draft.picks[1],draft.type);
      else odds=tripleOdds(item.gateOrder,draft.picks[0],draft.picks[1],draft.picks[2],draft.type);
      S.money-=draft.amount;
      item.race.bets.push({type:draft.type,picks:[...draft.picks],amount:draft.amount,odds});
      draft.picks=[];
      draft.amount=0;
      render();
    };
    refreshBuyState();
    box.appendChild(addBtn);

    if(item.race.bets.length>0){
      const cart=el(`<div class="bet-cart"></div>`);
      cart.appendChild(el(`<div class="jockey-label" style="margin-top:10px;">購入済みの馬券(${item.race.bets.length}枚)</div>`));
      let total=0;
      item.race.bets.forEach((bet,bi)=>{
        total+=bet.amount;
        const picksLabel=bet.type==='trifecta'?bet.picks.map(g=>`${g}番`).join('→'):bet.picks.map(g=>`${g}番`).join('・');
        const row=el(`<div class="bet-cart-row">
          <span>${TYPE_LABEL[bet.type]} ${picksLabel} / ${yen(bet.amount)} (${bet.odds}倍)</span>
        </div>`);
        const cancel=el(`<button class="bet-cart-cancel">取消</button>`);
        cancel.onclick=()=>{
          S.money+=bet.amount;
          item.race.bets.splice(bi,1);
          render();
        };
        row.appendChild(cancel);
        cart.appendChild(row);
      });
      cart.appendChild(el(`<div class="bet-summary" style="margin-top:6px;">合計購入額: ${yen(total)}</div>`));
      box.appendChild(cart);
    }

    const viewRow=el(`<div class="race-ctl"><span class="ctl-label">レース演出</span></div>`);
    [['normal','通常'],['fast','早送り'],['skip','毎回スキップ']].forEach(([m,label])=>{
      const b=el(`<button class="ctl-btn ${raceViewMode===m?'active':''}">${label}</button>`);
      b.onclick=()=>{raceViewMode=m;viewRow.querySelectorAll('.ctl-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
      viewRow.appendChild(b);
    });
    box.appendChild(viewRow);
    const proceedBtn=el(`<button class="modal-next">${item.race.bets.length>0?'レースへ進む':'馬券を買わずにレースへ'}</button>`);
    proceedBtn.onclick=()=>{modalIndex++;render();};
    box.appendChild(proceedBtn);

  } else if(item.type==='race'){
    const sim=item.sim,dist=item.dist;
    box.appendChild(el(`<div class="modal-title">${item.raceName}</div>`));
    box.appendChild(el(`<div class="modal-sub">${item.cond} / 出走 ${item.field.length}頭 / 参戦料 ${yen(item.feeTotal)}</div>`));
    const goingCls=/馬場不良/.test(item.cond||'')?'going-bad':/馬場重/.test(item.cond||'')?'going-heavy':/馬場稍重/.test(item.cond||'')?'going-slight':'';
    const track=el(`<div class="track ${goingCls} ${/ナイター/.test(item.raceName||'')?'night':''}"></div>`);
    const course=makeCourseView(item.venue,item.surface,dist);
    track.appendChild(el(course.svg));

    const laneOrder=[...item.field].sort((a,b)=>a.gateNo-b.gateNo);
    const n=laneOrder.length;
    laneOrder.forEach((f,idx)=>{
      f.lane=n>1?(idx/(n-1)-0.5)*(course.W-4):0; // 枠順に内から外へ
      const wk=wakuOf(f.gateNo,n);
      const marker=el(`<div class="lane-marker ${f.isPlayer?'you':''}"><span class="horse-dot" style="background:${wk.bg};color:${wk.fg}">${f.gateNo}</span>${f.isPlayer?`<span class="tag">${silkSVG(null,13)}${f.name}</span>`:''}</div>`);
      const p0=course.horsePos(0,f.lane);
      marker.style.left=p0.x+'%';
      marker.style.top=p0.y+'%';
      track.appendChild(marker);
      f.markerEl=marker;
    });
    const twrap=el(`<div class="track-wrap"></div>`);twrap.appendChild(track);box.appendChild(twrap);

    const board=el(`<div class="race-board"><div class="rb-head"><span class="rb-clock">0:00.0</span><span class="rb-rem">残り ${dist}m</span><button class="rb-skip">結果へスキップ ▶▶</button></div><div class="rb-list"></div></div>`);
    box.appendChild(board);
    const comm=el(`<div class="race-comm"></div>`);
    box.appendChild(comm);
    let skip=(raceViewMode==='skip');
    board.querySelector('.rb-skip').onclick=()=>{skip=true;};
    const ctl=el(`<div class="race-ctl"></div>`);
    [['normal','通常'],['fast','早送り'],['skip','毎回スキップ']].forEach(([m,label])=>{
      const b=el(`<button class="ctl-btn ${raceViewMode===m?'active':''}">${label}</button>`);
      b.onclick=()=>{
        raceViewMode=m;
        ctl.querySelectorAll('.ctl-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        if(m==='skip') skip=true;
      };
      ctl.appendChild(b);
    });
    let camMe=false;
    const camBtn=el(`<button class="ctl-btn">📷 自馬カメラ</button>`);
    camBtn.onclick=()=>{camMe=!camMe;camBtn.classList.toggle('active',camMe);track.classList.toggle('cam',camMe);if(!camMe)track.style.transform='';};
    ctl.appendChild(camBtn);
    box.appendChild(ctl);
    // 写真判定(1着と2着の差が0.1秒未満)
    const byT=[...item.field].sort((a,b)=>a.timeSec-b.timeSec);
    const photoClose=byT.length>1&&(byT[1].timeSec-byT[0].timeSec)<0.1;

    // 序盤は早送り、最後の600mはじっくり見せる
    const A=11,B=3.4;
    const tSplit=sim.tSplit,tEnd=sim.tEnd;
    const phase1=tSplit/A,animDur=phase1+(tEnd-tSplit)/B;
    const toRaceT=sec=>sec<phase1?sec*A:tSplit+(sec-phase1)*B;
    let shown=false,evIdx=0;
    const commLines=[];
    const clockText=T=>{const m=Math.floor(T/60);return `${m}:${(T-m*60).toFixed(1).padStart(4,'0')}`;};

    function showResults(){
      if(shown) return;
      shown=true;
      board.querySelector('.rb-skip').style.display='none';
      settleBets(item);
      if(item.headline) box.appendChild(el(`<div class="paper"><div class="paper-mast">ナイター競馬新聞 ${calendarShort(item.headline.week)}</div><div class="paper-h">${item.headline.h}</div><div class="paper-sub">${item.headline.sub}</div></div>`));
      const pn=el(`<div class="pace-note">ペース:<b>${sim.pace.label}</b>(前半3F ${sim.front3F.toFixed(1)} - 後半3F ${sim.last3F.toFixed(1)})<br>勝ち馬ラップ: ${sim.laps.map(x=>x.toFixed(1)).join(' - ')}<br>${item.recordAfter||''}</div>`);
      box.appendChild(pn);
      const wrap=el(`<div class="result-table-wrap"></div>`);
      const tbl=el(`<table class="result-table"><thead><tr><th>着</th><th>馬名</th><th>タイム</th><th>上3F</th><th>通過</th><th>賞金</th></tr></thead><tbody></tbody></table>`);
      const tbody=tbl.querySelector('tbody');
      const bestL3=Math.min(...item.field.map(f=>f.last3F));
      [...item.field].sort((a,b)=>a.rank-b.rank).forEach(f=>{
        const medal=f.rank===1?'🥇':f.rank===2?'🥈':f.rank===3?'🥉':`${f.rank}`;
        const prize=f.rank<=3?item.prizeTable[f.rank-1]:0;
        tbody.appendChild(el(`<tr class="${f.isPlayer?'you':''}"><td class="rank-medal">${medal}</td><td>${f.gateNo} ${f.isPlayer?silkSVG(null,13):''}${horseMarkHtml(f,item)}${f.name}${f.isPlayer?' ('+f.jockeyName+')':''}<div class="rt-sub">${f.style}</div></td><td>${formatRaceTime(f.timeSec)}<div class="rt-sub">${f.margin||'&nbsp;'}</div></td><td class="${f.last3F===bestL3?'best':''}">${f.last3F.toFixed(1)}</td><td>${f.passing.join('-')}</td><td>${prize?yen(prize):'-'}</td></tr>`));
      });
      wrap.appendChild(tbl);
      wrap.style.overflowX='auto';
      box.appendChild(wrap);

      if(item.bets && item.bets.length>0){
        const typeLabel={win:'単勝',place:'複勝',quinella:'馬連',wide:'ワイド',trifecta:'三連単',trio:'三連複'};
        let totalStake=0,totalPayout=0;
        item.bets.forEach(bet=>{
          totalStake+=bet.amount;
          totalPayout+=bet.payout;
          const picksLabel=bet.type==='trifecta'?bet.picks.map(g=>`${g}番`).join('→'):bet.picks.map(g=>`${g}番`).join('・');
          const line=bet.hit
            ? el(`<div class="bet-result hit">🎯 的中!${typeLabel[bet.type]} ${picksLabel} / ${yen(bet.amount)} → 払戻 ${yen(bet.payout)}</div>`)
            : el(`<div class="bet-result miss">不的中:${typeLabel[bet.type]} ${picksLabel} / ${yen(bet.amount)}</div>`);
          box.appendChild(line);
        });
        const net=totalPayout-totalStake;
        box.appendChild(el(`<div class="bet-summary">馬券収支: ${net>=0?'+':''}${yen(net)}</div>`));
      }

      const next=el(`<button class="modal-next">${modalIndex<modalQueue.length-1?'次へ':'結果を見る'}</button>`);
      next.onclick=()=>{modalIndex++;render();};
      box.appendChild(next);
    }

    setTimeout(()=>{
      let lastNow=null,animT=0;
      function frame(now){
        if(shown) return;
        if(!box.isConnected){return;}
        if(lastNow===null) lastNow=now;
        animT+=(now-lastNow)/1000*(raceViewMode==='fast'?2.4:1);
        lastNow=now;
        let sec=animT;
        if(skip) sec=animDur;
        const T=Math.min(toRaceT(sec),tEnd);
        const cur=laneOrder.map(f=>({f,p:posAtTime(f.hist,sim.dt,T)}));
        cur.forEach(c=>{
          const blk=(c.f.blockedAt!=null&&T>=c.f.blockedAt&&T<c.f.blockedAt+1.8)?(c.f.gateNo%2?2.2:-2.2):0; // 前が壁になって外へ逃げる
          const pt=course.horsePos(Math.min(c.p,dist+40),c.f.lane+Math.sin(T*0.9+c.f.gateNo*1.7)*0.6+blk);
          c.f.markerEl.style.left=pt.x+'%';
          c.f.markerEl.style.top=pt.y+'%';
          const dot=c.f.markerEl.querySelector('.horse-dot');
          if(dot) dot.classList.toggle('run',T>(c.f.lag||0)&&!(T>=c.f.timeSec));
        });
        if(camMe){ // 自馬を画面の中央に寄せて拡大
          const me=cur.find(c=>c.f.isPlayer);
          if(me){const pt=course.horsePos(Math.min(me.p,dist+40),me.f.lane);const sc=1.8;
            track.style.transformOrigin='0 0';
            const cl=(v)=>Math.min(0,Math.max(-(sc-1)*100,v)); // 端に空白が出ないように移動範囲を制限
            track.style.transform=`translate(${cl(50-sc*pt.x)}%,${cl(50-sc*pt.y)}%) scale(${sc})`;}
        }
        // 順位ボード(ゴール済みは確定着順、走行中は位置順)
        cur.forEach(c=>{c.done=T>=c.f.timeSec;});
        const ord=[...cur].sort((a,b)=>(a.done&&b.done)?a.f.rank-b.f.rank:a.done?-1:b.done?1:b.p-a.p);
        const lead=ord[0].p;
        const rows=[];
        ord.forEach((c,i)=>{
          if(i<5 || c.f.isPlayer){
            const gap=(i===0||c.done)?'':`<span class="rb-gap">${((lead-c.p)/2.4).toFixed(1)}馬身</span>`;
            rows.push(`<div class="rb-row ${c.f.isPlayer?'you':''}"><span>${i+1}位 ${c.f.gateNo}番 ${c.f.name}<small style="color:var(--text-dim)"> ${c.f.style}</small></span>${gap}</div>`);
          }
        });
        board.querySelector('.rb-list').innerHTML=rows.join('');
        board.querySelector('.rb-clock').textContent=clockText(T);
        board.querySelector('.rb-rem').textContent=lead>=dist?'ゴール!':`残り ${Math.max(0,Math.round(dist-lead))}m`;
        if(photoClose&&T>=tEnd-1.5&&sec<animDur) board.querySelector('.rb-rem').textContent='📷 写真判定中';
        // 実況
        let changed=false;
        while(evIdx<sim.events.length && sim.events[evIdx].t<=T){commLines.push(sim.events[evIdx].text);evIdx++;changed=true;}
        if(changed){
          const last=commLines[commLines.length-1],prev=commLines[commLines.length-2];
          comm.innerHTML=(prev?`<div class="old">${prev}</div>`:'')+`<div>${last}</div>`;
        }
        if(sec<animDur) requestAnimationFrame(frame); else showResults();
      }
      requestAnimationFrame(frame);
    },60);

  } else if(item.type==='notice'){
    box.appendChild(el(`<div class="modal-title">週間ニュース</div>`));
    box.appendChild(el(`<div class="modal-notice">${item.text}</div>`));
    const next=el(`<button class="modal-next">次へ</button>`);
    next.onclick=()=>{modalIndex++;render();};
    box.appendChild(next);

  } else if(item.type==='feat'){
    box.appendChild(el(`<div class="feat-paper"><div class="fp-head">号外 ・ ${calendarLong(item.week)}</div><div class="fp-title">${item.title}</div><div class="fp-body">${item.body}</div></div>`));
    const next=el(`<button class="modal-next">次へ</button>`);
    next.onclick=()=>{modalIndex++;render();};
    box.appendChild(next);

  } else if(item.type==='training'){
    box.appendChild(el(`<div class="modal-title">調教師からの報告</div>`));
    box.appendChild(el(`<div class="modal-notice">${item.lines.length?item.lines.join('<br>'):'今週は出走馬のみで、調教報告はありません。'}</div>`));
    const next=el(`<button class="modal-next">次へ</button>`);
    next.onclick=()=>{modalIndex++;render();};
    box.appendChild(next);

  } else if(item.type==='review'){
    const d=item.data||{};
    box.appendChild(el(`<div class="modal-title">開業${item.year}年目の振り返り</div>`));
    box.appendChild(el(`<div class="modal-sub">この1年の成績をまとめました(画面を保存すれば記念になります)</div>`));
    const grid=el(`<div class="summary-grid"></div>`);
    const cell=(l,v,c)=>grid.appendChild(el(`<div class="summary-cell"><div class="lbl">${l}</div><div class="val ${c||''}">${v}</div></div>`));
    cell('出走',`${d.races||0}戦`);cell('勝利',`${d.wins||0}勝`,'win');cell('3着以内',`${d.top3||0}回`);cell('重賞勝ち',`${d.graded||0}勝`,'win');
    cell('賞金等',yen(d.prize||0),'win');
    box.appendChild(grid);
    const gl=d.gradedNames||[];
    box.appendChild(el(`<div class="modal-sub" style="margin-top:10px;">重賞制覇: ${gl.length?gl.map(x=>`${x.h}(${shortRaceName(x.r)})`).join('、'):'今年は重賞制覇なし'}</div>`));
    box.appendChild(el(`<div class="modal-sub">評判 ${Math.round(S.rep)}(${repLabel(S.rep)}) ・ ファン ${Math.round(S.fans)}</div>`));
    const nx=el(`<button class="act-btn" style="margin-top:12px;width:100%;">閉じる</button>`);
    nx.onclick=()=>{modalIndex++;render();};
    box.appendChild(nx);
  } else if(item.type==='summary'){
    box.appendChild(el(`<div class="modal-title">${calendarLong(S.week)}へ</div>`));
    box.appendChild(el(`<div class="modal-sub">今週の収支サマリー</div>`));
    const grid=el(`<div class="summary-grid"></div>`);
    grid.appendChild(el(`<div class="summary-cell"><div class="lbl">賞金等収入</div><div class="val win">${yen(item.prizeTotal>0?item.prizeTotal:0)}</div></div>`));
    grid.appendChild(el(`<div class="summary-cell"><div class="lbl">預託料</div><div class="val loss">-${yen(item.upkeep).replace('-','')}</div></div>`));
    grid.appendChild(el(`<div class="summary-cell" style="grid-column:1/3"><div class="lbl">純増減</div><div class="val ${item.net>=0?'win':'loss'}">${item.net>=0?'+':''}${yen(item.net)}</div></div>`));
    box.appendChild(grid);
    const close=el(`<button class="modal-next">${S.gameOver?'結果を確認':'閉じる'}</button>`);
    close.onclick=()=>{modalQueue=[];modalIndex=0;if(!startPendingAdmission()) render();};
    box.appendChild(close);
  }

  overlay.appendChild(box);
  return overlay;
}

/* ================= HORSE AUCTION (せり) ================= */
function openAuction(h){
  const start=Math.max(20000,Math.round(h.price*0.55));
  auction={
    horseId:h.id,
    price:start,
    fairValue:h.price,
    share:1,
    round:0,
    log:[`せり開始。まずは${yen(start)}から。`]
  };
  render();
}

function auctionHorse(){for(const l of allSaleLists()){const f=l.find(x=>x.id===auction.horseId);if(f)return f;}return null;}

function auctionBid(){
  const h=auctionHorse();
  if(!h){auction=null;render();return;}
  const inc=Math.max(8000,Math.round(auction.price*0.12));
  auction.price+=inc;
  auction.round+=1;
  auction.log.push(`あなたが${yen(auction.price)}で入札。`);

  if(auction.round>=8){
    auction.log.push(`せり終了の合図。${yen(auction.price)}で落札確定。`);
    render();
    return;
  }
  const ratio=auction.price/auction.fairValue;
  const prob=clamp(1.6-ratio*1.1,0.05,0.92);
  if(Math.random()<prob){
    const aiInc=Math.max(6000,Math.round(auction.price*(randInt(8,14)/100)));
    auction.price+=aiInc;
    auction.round+=1;
    auction.log.push(`対抗馬主が${yen(auction.price)}まで対抗した。`);
    if(auction.round>=8){ auction.log.push(`せり終了の合図。${yen(auction.price)}で落札確定。`); }
    render();
  } else {
    auction.log.push(`他に応札なし。${yen(auction.price)}で落札確定。`);
    render();
  }
}

function auctionConfirmWin(){finalizeAuctionWin();}

function finalizeAuctionWin(){
  const h=auctionHorse();
  if(!h){auction=null;render();return;}
  const sh=h.mareLot?1:(auction.share||1);
  if(S.money<auction.price*sh){
    auction.log.push(`資金が足りず落札できなかった…`);
    render();
    return;
  }
  if(h.mareLot){ // 繁殖牝馬は厩舎ではなく自分の牧場へ
    S.money-=auction.price;buyMareLot(h,auction.price);removeFromMarkets(h.id);
    toast(`${h.name}を落札。牧場に繋養します`);auction=null;activeTab='farm';render();return;
  }
  S.money-=Math.round(auction.price*sh);
  if(sh<1){h.share=sh;h.partner=pickFrom(PARTNER_NAMES);addNews(`${h.name}は${h.partner}氏との共同所有(あなたの持ち分${Math.round(sh*100)}%)。`,'');}
  if(h.foreignBred&&h.saleKind==='overseas'){S.money-=IMPORT_COST;addNews(`${h.name}の輸入・検疫費用 ${yen(IMPORT_COST)} を支払った。`,'money-out');}
  h.pendingAction=null;
  h.trainerKey=null;
  S.horses.push(h);
  removeFromMarkets(h.id);
  addNews(`せりで${h.name}(${h.age}歳)を${yen(auction.price)}で落札した。`,'money-out');
  auction=null;
  toast(`${h.name}を落札しました`);
  if(h.age<2){
    addNews(`${h.name}(1歳)は育成牧場へ。2歳になる1月1日に入厩・命名する。`,'');
    render();
  } else {
    openAdmission(h,'purchase'); // 落札したら、どの厩舎に預けるか決める
  }
}

function auctionPass(){
  const h=auctionHorse();
  if(h){
    const soldPrice=Math.round(auction.price*(1+randInt(2,10)/100));
    addNews(`${h.name}は他の馬主が${yen(soldPrice)}で競り落とした。`,'');
    removeFromMarkets(h.id);
  }
  auction=null;
  render();
}

function renderAuctionModal(){
  const h=auctionHorse();
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box"></div>`);
  if(!h){
    box.appendChild(el(`<div class="modal-title">せり終了</div>`));
    box.appendChild(el(`<div class="modal-sub">この馬はすでに取引が終わっています。</div>`));
    const close=el(`<button class="modal-next">閉じる</button>`);
    close.onclick=()=>{auction=null;render();};
    box.appendChild(close);
    overlay.appendChild(box);
    return overlay;
  }
  box.appendChild(el(`<div class="modal-title">せり:${h.name}</div>`));
  box.appendChild(el(`<div class="modal-sub">${h.sex} / ${h.age}歳 / 評価額 ${yen(auction.fairValue)}</div>`));
  box.appendChild(el(`<div class="auction-price">${yen(auction.price)}</div>`));
  box.appendChild(el(`<div class="auction-sub">現在の価格 (第${auction.round}回)</div>`));
  box.appendChild(el(h.mareLot?renderMareAdviceHtml(h):renderAdviceHtml(h)));

  const log=el(`<div class="auction-log"></div>`);
  auction.log.forEach(line=>log.appendChild(el(`<div>${line}</div>`)));
  box.appendChild(log);
  log.scrollTop=log.scrollHeight;

  const resolved=auction.log[auction.log.length-1].includes('落札');
  if(!h.mareLot){
    const shr=el(`<div class="share-row"><span>持ち分</span></div>`);
    [[1,'単独 100%'],[0.5,'共有 50%'],[1/3,'共有 1/3']].forEach(([v,l])=>{
      const b=el(`<button class="ctl-btn ${Math.abs((auction.share||1)-v)<0.01?'active':''}">${l}</button>`);
      b.onclick=()=>{auction.share=v;render();};shr.appendChild(b);
    });
    box.appendChild(shr);
    if((auction.share||1)<1) box.appendChild(el(`<div class="auction-sub">馬主仲間と共同で購入。あなたの負担は <b>${yen(Math.round(auction.price*auction.share))}</b>。賞金・費用も持ち分で分け合います。</div>`));
  }
  const btns=el(`<div class="auction-btns"></div>`);
  if(!resolved){
    const nextInc=Math.max(8000,Math.round(auction.price*0.12));
    const canAfford=S.money>=(auction.price+nextInc)*(auction.share||1);
    const bidBtn=el(`<button class="auction-bid" ${canAfford?'':'disabled'}>${canAfford?`入札する (+${yen(nextInc)})`:'資金不足'}</button>`);
    bidBtn.onclick=auctionBid;
    const passBtn=el(`<button class="auction-pass">降りる</button>`);
    passBtn.onclick=auctionPass;
    btns.appendChild(bidBtn);
    btns.appendChild(passBtn);
  } else {
    if(S.money<auction.price*(h.mareLot?1:(auction.share||1))){
      box.appendChild(el(`<div class="cheat-msg ng">資金が足りず、この価格では落札できません。共有にすると負担が減ります。</div>`));
      const giveUp=el(`<button class="auction-pass" style="width:100%">あきらめる</button>`);
      giveUp.onclick=auctionPass;
      btns.appendChild(giveUp);
    } else {
      const takeBtn=el(`<button class="auction-bid">${yen(auction.price)}で落札する${(auction.share||1)<1&&!h.mareLot?`(負担 ${yen(Math.round(auction.price*auction.share))})`:''}</button>`);
      takeBtn.onclick=auctionConfirmWin;
      btns.appendChild(takeBtn);
    }
  }
  box.appendChild(btns);

  overlay.appendChild(box);
  return overlay;
}

/* ================= JOCKEY ROMANCE ================= */
function renderRomancePanel(){
  const overlay=el(`<div class="modal-overlay"></div>`);
  const box=el(`<div class="modal-box cheat-box"></div>`);

  if(S.spouseKey){
    const spouse=JOCKEYS.find(j=>j.key===S.spouseKey);

  } else {
    box.appendChild(el(`<div class="modal-sub">レースに起用して好感度を高めよう。好感度80以上でプロポーズできる。</div>`));
  }

  const femaleJockeys=JOCKEYS.filter(j=>j.gender==='female');

    const row=el(`<div class="jockey-row" style="border-top:1px solid var(--line);"></div>`);

    if(S.spouseKey===j.key){
      row.appendChild(el(`<div class="cheat-msg ok">💍 結婚済み</div>`));
    } else if(S.spouseKey){
      row.appendChild(el(`<div class="cheat-msg ng">あなたは${JOCKEYS.find(x=>x.key===S.spouseKey).name}と結婚している。</div>`));
    } else if(aff>=80){
      const proposeBtn=el(`<button class="modal-next" style="margin-top:8px;">💍 プロポーズする</button>`);
      proposeBtn.onclick=()=>{
        S.spouseKey=j.key;
