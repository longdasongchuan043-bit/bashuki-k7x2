<title>ナイター馬主記</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --bg:#0E1326;
  --bg-2:#0A0E1C;
  --panel:#1A2140;
  --panel-2:#212a4d;
  --dirt:#8B5A2B;
  --dirt-light:#C98A4E;
  --gold:#E8B94B;
  --gold-soft:#F4D488;
  --text:#EDE7D9;
  --text-dim:#9CA3C4;
  --win:#5FAE7E;
  --loss:#D8695A;
  --line:#333C68;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 50% -10%, #232c56 0%, var(--bg) 55%, var(--bg-2) 100%);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.serif{font-family:'Shippori Mincho',serif;}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---------- Header ---------- */
header{
  background:linear-gradient(180deg,#141B36,#0F1530);
  border-bottom:2px solid var(--gold);
  padding:14px 16px 10px;
  position:sticky;top:0;z-index:20;
}
.hdr-top{display:flex;justify-content:space-between;align-items:baseline;}
.hdr-title{font-size:19px;font-weight:700;letter-spacing:.03em;color:var(--gold-soft);}
.hdr-week{font-size:12px;color:var(--text-dim);}
.hdr-money{
  margin-top:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 6px;
}
.hdr-money .stable-count{white-space:nowrap;}
.money-val{white-space:nowrap;}
@media (max-width:400px){.hdr-money .money-val{flex:1 1 100%;}.hdr-money .stable-count{font-size:11px;padding:3px 6px;}}
.money-val{font-size:24px;font-weight:800;color:var(--gold);font-family:'Shippori Mincho',serif;letter-spacing:.02em;}
.money-val.neg{color:var(--loss);}
.trainer-card.career-card{background:var(--panel);border-color:var(--line);}
.trainer-card.career-card:hover{background:rgba(232,185,75,.08);}
.career-card .trainer-desc,.career-card .trainer-meta{color:var(--text-dim);}
.career-card .trainer-name small{color:var(--text-dim);font-weight:normal;margin-left:6px;font-size:11px;}
.farm-season{margin:6px 0 10px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--text-dim);}
.farm-season.on{border-color:var(--gold);color:var(--gold-soft);background:rgba(232,185,75,.08);}
.farm-plan{flex-wrap:wrap;margin-top:6px;}
.farm-plan .ctl-btn{font-size:11px;padding:4px 7px;}
.mare-card{border-color:#7fb38a;}
.share-row{display:flex;gap:6px;align-items:center;justify-content:center;margin:6px 0;font-size:12px;}
.share-row .ctl-btn{padding:4px 8px;font-size:11px;}
.silk-svg{vertical-align:middle;margin-right:3px;flex:none;}
.silk-preview{display:flex;align-items:center;gap:14px;margin:8px 0 12px;}.silk-preview small{display:block;color:var(--text-dim);font-size:11px;margin-top:4px;}
.silk-row{margin:8px 0;font-size:12px;}.silk-row>span{display:block;color:var(--text-dim);margin-bottom:4px;}
.silk-colors{display:flex;flex-wrap:wrap;gap:6px;}.silk-color{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;}
.silk-color.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}
.owner-input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:14px;box-sizing:border-box;}
.paper{background:#f3ecd9;color:#1b1406;border-radius:4px;padding:8px 10px;margin:8px 0;font-family:'Shippori Mincho',serif;box-shadow:0 1px 4px #0006;}
.paper-mast{font-size:10px;border-bottom:2px solid #1b1406;padding-bottom:2px;margin-bottom:4px;letter-spacing:.1em;}
.paper-h{font-size:18px;font-weight:800;line-height:1.3;}.paper-sub{font-size:11px;margin-top:3px;color:#4a3b1c;}
.paper-mini{border-left:3px solid var(--line);padding:4px 8px;margin:6px 0;font-size:12px;}.paper-mini.win{border-left-color:var(--gold);}
.paper-mini small,.letter-mini small{display:block;color:var(--text-dim);font-size:10.5px;}
.letter-mini{font-size:12px;padding:5px 8px;margin:6px 0;background:rgba(242,156,184,.08);border-radius:4px;}
.circuit-pick{margin:4px 0 10px;}.circuit-row{display:flex;gap:8px;}.circuit-row .ctl-btn{flex:1;padding:9px 6px;font-size:13px;}
.circuit-note{font-size:11.5px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
.drill-line{font-size:11px;color:var(--text-dim);margin-top:3px;}.dm{font-weight:700;}.dm◎{color:#9be37f;}.dm×{color:#ffb3a8;}
.pd{font-size:10.5px;border-radius:3px;padding:0 4px;margin-left:4px;border:1px solid var(--line);white-space:nowrap;}.pd◎{color:#9be37f;border-color:#5FAE7E;}.pd▲,.pd×{color:#ffb3a8;border-color:#D8695A;}
.origin-tag{font-size:10.5px;color:var(--gold-soft);border:1px solid var(--gold);border-radius:3px;padding:0 5px;display:inline-block;margin:2px 0;}
.offer-box{border:1px solid var(--gold);border-radius:6px;padding:8px 10px;margin:10px 0;background:rgba(232,185,75,.06);}
.offer-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;padding:6px 0;border-top:1px dotted var(--line);}
.offer-row small{display:block;color:var(--text-dim);font-size:10.5px;}.offer-btns{display:flex;gap:6px;flex:none;}
.fame-card{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,185,75,.10),var(--panel));}
.save-code{width:100%;min-height:110px;margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:11px;font-family:monospace;box-sizing:border-box;word-break:break-all;}
.advice-box{margin:6px 0;padding:6px 8px;border:1px dashed var(--line);border-radius:4px;font-size:11.5px;background:rgba(255,255,255,.03);text-align:left;}
.advice-box.empty{color:var(--text-dim);}
.adv+.adv{margin-top:5px;border-top:1px dotted var(--line);padding-top:5px;}
.adv-h{font-weight:bold;display:flex;gap:6px;align-items:center;}.adv-h small{color:var(--text-dim);font-weight:normal;}
.adv-stars{margin-left:auto;color:var(--gold);}
.adv-g{color:#9be37f;}.adv-b{color:#ffb3a8;}.adv-n{color:var(--text-dim);font-size:10.5px;}
.adv-verdict{margin-top:5px;font-weight:bold;}.adv-verdict.good{color:#9be37f;}.adv-verdict.bad{color:#ffb3a8;}
.rep-badge{background:none;color:var(--gold);cursor:pointer;font-family:inherit;}
.jockey-chip[disabled]{opacity:.45;cursor:not-allowed;}
.stable-count{font-size:12px;color:var(--text-dim);border:1px solid var(--line);border-radius:3px;padding:3px 8px;}
.cheat-gear{
  background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:3px;
  width:26px;height:26px;font-size:13px;margin-left:8px;flex:none;
}
.cheat-box .modal-title{color:var(--gold-soft);}
.cheat-input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:11px 12px;font-size:15px;letter-spacing:.08em;margin-bottom:10px;
  font-family:'Noto Sans JP',sans-serif;
}
.cheat-msg{font-size:13px;margin-bottom:10px;min-height:18px;}
.cheat-msg.ok{color:var(--win);}
.cheat-msg.ng{color:var(--loss);}
.cheat-close{
  width:100%;background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:4px;
  padding:11px 0;font-size:13px;margin-top:4px;
}

.auction-price{font-family:'Shippori Mincho',serif;font-size:32px;color:var(--gold);text-align:center;margin:12px 0 2px;}
.auction-sub{text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:14px;}
.auction-log{max-height:120px;overflow-y:auto;background:var(--panel-2);border-radius:4px;padding:9px 11px;margin-bottom:14px;font-size:12px;color:var(--text-dim);line-height:1.8;}
.auction-btns{display:flex;gap:10px;}
.auction-bid{flex:2;background:var(--gold);color:#1A1204;font-weight:800;border:none;border-radius:4px;padding:13px 0;font-family:'Shippori Mincho',serif;font-size:14px;}
.auction-bid:disabled{opacity:.35;}
.auction-pass{flex:1;background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:4px;padding:13px 0;font-size:13px;}

/* ---------- Tabs ---------- */
.tabs{display:flex;background:var(--bg-2);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:19;}
.tab-btn{
  flex:1;padding:11px 0;text-align:center;font-size:13px;font-weight:700;color:var(--text-dim);
  background:none;border:none;border-bottom:3px solid transparent;font-family:'Noto Sans JP',sans-serif;
}
.tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}

main{flex:1;padding:14px 14px 100px;}

/* ---------- Section titles ---------- */
.section-label{
  font-size:12px;color:var(--dirt-light);letter-spacing:.08em;margin:4px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}

/* ---------- Horse card (race-program style row) ---------- */
.horse-card{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  margin-bottom:12px;overflow:hidden;
}
.horse-top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);}
.gate-badge{
  width:30px;height:30px;flex:none;background:var(--dirt);border:1px solid var(--gold);
  color:var(--gold-soft);font-weight:800;font-family:'Shippori Mincho',serif;
  display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:14px;
}
.horse-avatar{
  width:36px;height:36px;flex:none;border-radius:50%;background:#0B0F20;
  border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.horse-avatar .horse-icon{width:82%;height:82%;}
.horse-avatar.small{width:28px;height:28px;}
.jockey-avatar{
  width:18px;height:18px;flex:none;border-radius:50%;overflow:hidden;display:inline-block;
  vertical-align:middle;margin-right:5px;background:#0B0F20;
}
.jockey-avatar .jockey-icon{width:100%;height:100%;display:block;}
.silk-swatch{width:14px;height:14px;border-radius:2px;flex:none;border:1px solid rgba(255,255,255,.3);}
.horse-name{font-weight:700;font-size:15px;flex:1;}
.horse-meta{font-size:11px;color:var(--text-dim);}
.fame-badge{font-size:11px;color:var(--gold);white-space:nowrap;}
.pedigree-line{font-size:11px;color:var(--text-dim);padding:6px 12px 0;}
.pedigree-line b{color:var(--gold-soft);font-weight:600;}
.horse-title{font-size:10px;color:var(--dirt-light);letter-spacing:.03em;margin-bottom:1px;}
.skill-badge{
  margin:6px 12px 0;padding:6px 9px;font-size:11px;color:var(--gold-soft);
  background:rgba(232,185,75,.12);border:1px solid var(--gold);border-radius:4px;
}
.skill-badge .skill-desc{display:block;font-size:10px;color:var(--text-dim);margin-top:2px;}
.nick-badge{
  display:inline-block;font-size:10px;background:var(--dirt);color:var(--gold-soft);
  border:1px solid var(--gold);border-radius:2px;padding:1px 6px;margin-left:6px;vertical-align:middle;
}

.bars{padding:8px 12px 4px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bar-label{width:44px;font-size:11px;color:var(--text-dim);flex:none;}
.bar-track{flex:1;height:7px;background:var(--bg-2);border-radius:2px;overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;border-radius:2px;}
.bar-fill.speed{background:linear-gradient(90deg,#4C6FD8,#7C96EA);}
.bar-fill.stamina{background:linear-gradient(90deg,#4C9A6A,#7FCB9B);}
.bar-fill.guts{background:linear-gradient(90deg,#D06A5C,#EA9585);}
.bar-fill.cond{background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.bar-fill.turf{background:linear-gradient(90deg,#3C8F5C,#8FE3AE);}
.bar-fill.dirt{background:linear-gradient(90deg,#8B5A2B,#D9A56A);}
.bar-fill.love{background:linear-gradient(90deg,#D06A5C,#FF9EB0);}
.bar-val{width:26px;font-size:11px;color:var(--text-dim);text-align:right;flex:none;}

.action-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;}
.act-btn{
  font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:7px 10px;border-radius:3px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
}
.act-btn.selected{background:var(--gold);color:#1A1204;border-color:var(--gold);font-weight:700;}
.act-btn.race-chip{border-color:var(--dirt-light);color:var(--gold-soft);}
.act-btn.race-chip.selected{background:var(--dirt-light);color:#221100;}
.act-btn.race-chip-jra{border-color:#6E8FD8;color:#B9C6F2;}
.act-btn.race-chip-jra.selected{background:#6E8FD8;color:#0B1030;}
.act-btn.race-chip-overseas{border-color:var(--gold);color:var(--gold-soft);box-shadow:0 0 0 1px rgba(232,185,75,.3) inset;}
.act-btn.race-chip-overseas.selected{background:var(--gold);color:#1A1204;}
.act-btn.race-chip-turf{border-color:#5FAE7E;color:#BFE8CE;}
.act-btn.race-chip-turf.selected{background:#5FAE7E;color:#08210F;}
.act-btn.race-chip-jra-turf{border-color:#6E8FD8;color:#B9C6F2;box-shadow:0 0 0 1px rgba(95,174,126,.45) inset;}
.act-btn.race-chip-jra-turf.selected{background:#6E8FD8;color:#0B1030;}
.act-btn.race-chip-overseas-turf{border-color:var(--gold);color:var(--gold-soft);box-shadow:0 0 0 1px rgba(95,174,126,.45) inset;}
.act-btn.race-chip-overseas-turf.selected{background:var(--gold);color:#1A1204;}
.act-btn.retire{margin-left:auto;color:var(--loss);border-color:var(--loss);background:none;}
.act-btn:disabled{opacity:.35;}

.warn-line{font-size:11px;color:var(--loss);padding:0 12px 10px;}
.stable-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px 8px;font-size:12px;}
.trainer-card{border:1px solid #d9d2c3;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer;}
.trainer-card:hover{background:#faf6ea;}
.trainer-card.blocked{opacity:.5;cursor:not-allowed;}
.trainer-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.trainer-name{font-weight:700;font-size:14px;}
.trainer-skill{color:#d49a00;font-size:12px;letter-spacing:1px;}
.trainer-meta{font-size:11px;color:#6b6556;margin-top:4px;}
.trainer-desc{font-size:11px;color:#6b6556;margin-top:2px;}

.jockey-row{border-top:1px dashed var(--line);padding:10px 12px 12px;background:rgba(0,0,0,.15);}
.jockey-label{font-size:11px;color:var(--gold-soft);margin-bottom:6px;}
.jockey-chips{display:flex;flex-wrap:wrap;gap:6px;}
.jockey-chip{border-color:#4A5590;color:var(--text);text-align:left;line-height:1.5;}
.jockey-chip.selected{background:#4A5590;color:#fff;border-color:#6E7BC4;}
.jk-sub{display:block;font-size:10px;color:var(--text-dim);}
.jockey-chip.selected .jk-sub{color:#DCE0F5;}

/* ---------- Market card ---------- */
.market-card{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  margin-bottom:12px;padding:12px;
}
.mk-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.tappable{cursor:pointer;}
.tappable:active{opacity:.8;}
.summer-label span:first-child{color:var(--gold);}
.market-card.summer-card{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,185,75,.07),var(--panel));}
.mix-label span:first-child{color:var(--gold);}
.second-label span:first-child{color:#8fd0ff;}
.market-card.mix-card{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,185,75,.12),var(--panel));}
.market-card.second-card{border-color:#5aa3d6;background:linear-gradient(180deg,rgba(90,163,214,.1),var(--panel));}
.grade-badge{display:inline-block;font-size:10px;border:1px solid var(--gold);color:var(--gold-soft);border-radius:3px;padding:0 4px;margin-left:4px;}
.grade-badge.g1{background:var(--gold);color:#1a1a1a;font-weight:700;}
.retired-card{border-color:#6c7bd9;}
.name-box{background:var(--panel-2);border-radius:6px;padding:10px;margin-bottom:12px;}
.name-label{font-size:12px;color:var(--gold-soft);margin-bottom:8px;}
.name-row{display:flex;gap:8px;}
.name-input{flex:1;min-width:0;padding:9px 10px;border-radius:4px;border:1px solid var(--line);background:#0f1530;color:var(--text);font-size:16px;}
.name-rand{flex:none;width:84px;}
.name-err{color:var(--loss);font-size:12px;min-height:16px;margin-top:6px;}
.ped-wrap{margin:8px 0 12px;}
.ped-title{font-size:12px;color:var(--gold-soft);margin-bottom:4px;font-weight:700;}
.ped-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px;line-height:1.25;}
.ped-table td{border:1px solid rgba(255,255,255,.12);padding:2px 3px;vertical-align:middle;word-break:break-all;}
.ped-table td.ped-f{background:rgba(90,140,255,.10);}
.ped-table td.ped-m{background:rgba(255,110,150,.10);}
.ped-table td.pg1{font-size:12px;font-weight:700;}
.ped-table td.pg2{font-size:11px;}
.ped-table td.pg6{font-size:9px;}
.cross-list{margin-top:6px;font-size:11px;}
.cross-title{color:var(--gold-soft);margin-bottom:3px;}
.cross-row{display:flex;align-items:center;gap:5px;padding:1px 0;flex-wrap:wrap;}
.cross-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.cross-tag{font-size:10px;border:1px solid var(--gold);color:var(--gold-soft);border-radius:3px;padding:0 4px;}
.cross-tag.dim{border-color:var(--line);color:var(--text-dim);}
.cross-none{font-size:11px;color:var(--text-dim);margin-top:6px;}
.cross-inline{color:#ffcf5a;}

.line-inline{color:#9fd3ff;}
.line-box{font-size:11px;line-height:1.7;background:var(--panel-2);border-radius:6px;padding:6px 8px;margin-bottom:6px;}
.line-k{display:inline-block;min-width:118px;color:var(--text-dim);}
.ped-line{font-size:9px;color:#9fd3ff;font-weight:400;margin-top:1px;}
.plan-box{background:linear-gradient(180deg,rgba(232,185,75,.10),rgba(232,185,75,.03));border:1px solid rgba(232,185,75,.45);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.plan-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13px;color:var(--gold-soft);font-weight:700;margin-bottom:4px;}

.plan-empty{font-size:12px;color:var(--text-dim);line-height:1.6;}
.plan-row{display:flex;flex-direction:column;font-size:12px;padding:5px 0;border-top:1px dashed rgba(255,255,255,.08);}
.plan-row span{color:var(--text-dim);font-size:11px;}
.link-btn{background:none;border:none;color:var(--loss);font-size:12px;padding:6px 0 0;text-decoration:underline;cursor:pointer;}
.cond-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim);margin-top:4px;}

.cond-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;max-width:160px;}
.cond-fill{height:100%;border-radius:3px;}
.cond-fill.good{background:#5FAE7E;}.cond-fill.mid{background:#E8B94B;}.cond-fill.low{background:#D8695A;}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.badges:empty{display:none;}
.st-badge{font-size:10px;border-radius:10px;padding:1px 7px;border:1px solid var(--line);color:var(--text-dim);}
.st-badge.go{border-color:var(--gold);color:var(--gold-soft);background:rgba(232,185,75,.12);}
.st-badge.bad{border-color:var(--loss);color:#ffb3a8;}
.st-badge.warn{border-color:#c9a04a;color:#f0cf8a;}
.st-badge.star{border-color:#9fd3ff;color:#cfe9ff;}
.detail-chev{font-size:22px;color:var(--text-dim);padding-left:4px;}
.race-sec{padding:10px 12px 4px;}
.sec-h{font-size:12px;color:var(--gold-soft);font-weight:700;margin-bottom:6px;}
.race-list{display:flex;flex-direction:column;gap:6px;}
.race-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 11px;font-size:13px;cursor:pointer;font-family:inherit;}
.race-opt small{font-size:11px;color:var(--text-dim);line-height:1.5;}
.race-opt.selected{border-color:var(--gold);background:rgba(232,185,75,.16);box-shadow:0 0 0 1px var(--gold) inset;}
.race-opt.jra{border-left:4px solid #6E8FD8;}
.race-opt.ov{border-left:4px solid var(--gold);}
.race-opt.turf{border-left:4px solid #5FAE7E;}
.race-tag{font-size:10px;font-weight:400;margin-left:6px;color:#f0cf8a;border:1px solid #c9a04a;border-radius:3px;padding:0 4px;}
.fit{font-size:10px;border-radius:3px;padding:0 3px;border:1px solid var(--line);}
.fit.ok{color:#9be37f;border-color:#5FAE7E;}.fit.ng{color:#ffb3a8;border-color:var(--loss);}
.race-note{font-size:12px;color:var(--text-dim);padding:4px 0 8px;}
.race-note.bad{color:#ffb3a8;}
.cost-line{font-size:11px;color:var(--text-dim);padding:6px 0 4px;}
.cost-line b{color:var(--gold-soft);}
.toggle-btn{width:100%;background:none;border:none;border-top:1px solid var(--line);color:var(--text-dim);font-size:12px;padding:9px 0;cursor:pointer;font-family:inherit;}
.card-detail{padding:4px 0 8px;border-top:1px dashed var(--line);}
.horse-actions{padding:4px 0;}
.retire-row{display:flex;justify-content:flex-end;padding:4px 12px 2px;}
.advance-btn small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:1px;}
.menu-btn{font-size:15px;}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:11px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
.menu-item.static{cursor:default;}
.menu-item.danger b{color:#ffb3a8;}
.mi-icon{font-size:18px;width:24px;text-align:center;flex:none;}
.mi-body{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13px;}
.mi-body small{font-size:11px;color:var(--text-dim);}
.mi-arrow{color:var(--text-dim);font-size:18px;}
.mi-seg{display:flex;gap:6px;margin-top:4px;}
.help-body{font-size:13px;line-height:1.7;}
.help-step{background:var(--panel-2);border-radius:6px;padding:9px 11px;margin-bottom:8px;}
.help-step b{display:block;color:var(--gold-soft);margin-bottom:2px;}
.confirm-overlay{z-index:60;}
.confirm-box{max-width:420px;}
.confirm-text{font-size:13px;line-height:1.8;margin:6px 0 14px;color:var(--text);}
.confirm-row{display:flex;gap:8px;}
.confirm-row>button{flex:1;margin:0;}
.modal-next.danger{background:var(--loss);color:#fff;}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:rgba(20,27,54,.96);border:1px solid var(--gold);color:var(--gold-soft);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4);}
#toast.show{opacity:1;transform:translate(-50%,0);}
.auto-btn{flex:none;width:72px;height:52px;border-radius:6px;border:1px solid var(--gold);background:rgba(232,185,75,.12);color:var(--gold-soft);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-left:6px;}
.auto-btn small{display:block;font-size:10px;font-weight:400;}
.auto-weeks{background:var(--panel-2);border-radius:8px;padding:10px 12px;}
.aw-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;}
.aw-val{font-size:22px;color:var(--gold);font-family:'Shippori Mincho',serif;}
.aw-range{width:100%;margin:10px 0;accent-color:#E8B94B;}
.aw-quick{display:flex;gap:6px;}
.aw-until{font-size:11px;color:var(--text-dim);margin-top:8px;}
.sale-toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);}
.sale-toggle .seg,.mode-row .seg{display:flex;gap:6px;flex:none;}
.sale-toggle .ctl-btn,.mode-row .ctl-btn{flex:none;padding:5px 9px;}
.auto-note{font-size:11px;color:var(--text-dim);line-height:1.7;margin:10px 0;}
.auto-bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:6px 0 12px;}
.auto-bar div{height:100%;background:linear-gradient(90deg,#c9963a,#E8B94B);transition:width .1s;}
.auto-log{max-height:240px;overflow-y:auto;font-size:12px;line-height:1.7;background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.auto-log .w{color:var(--gold-soft);font-weight:700;}
.auto-log .p{color:#cfe9ff;}
.mode-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.trainer-note{font-size:11px;line-height:1.6;color:#d9e6ff;background:rgba(110,143,216,.12);border-left:3px solid #6E8FD8;border-radius:3px;padding:5px 8px;margin-bottom:8px;}
.trainer-note .ov{color:#f0cf8a;}
.by-tag{font-size:9px;font-weight:400;margin-left:6px;border-radius:3px;padding:0 4px;border:1px solid;}
.by-tag.t{color:#9fd3ff;border-color:#6E8FD8;}.by-tag.o{color:#f0cf8a;border-color:#c9a04a;}
.crown-tag{display:inline-block;font-size:11px;color:#1a1204;background:var(--gold);border-radius:3px;padding:1px 6px;font-weight:700;}
.feat-paper{background:#f3ead2;color:#1d1a12;border-radius:6px;padding:14px 14px 16px;margin:4px 0 14px;box-shadow:0 4px 18px rgba(0,0,0,.4);font-family:'Shippori Mincho',serif;}
.fp-head{font-size:11px;border-bottom:2px solid #1d1a12;padding-bottom:4px;margin-bottom:8px;letter-spacing:.1em;color:#7a1f14;font-weight:700;}
.fp-title{font-size:20px;font-weight:800;line-height:1.35;margin-bottom:8px;}
.fp-body{font-size:13px;line-height:1.8;font-family:'Noto Sans JP',sans-serif;}
.feat-card{background:linear-gradient(180deg,rgba(243,234,210,.12),rgba(243,234,210,.04));border:1px solid rgba(232,185,75,.5);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.fc-date{font-size:10px;color:var(--text-dim);}
.fc-title{font-size:14px;font-weight:700;color:var(--gold-soft);margin:2px 0 4px;font-family:'Shippori Mincho',serif;}
.fc-body{font-size:12px;line-height:1.6;color:var(--text);}
.crown-board{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0 16px;}
.cb-row{padding:7px 0;border-top:1px dashed var(--line);}
.cb-name{font-size:12px;font-weight:700;color:var(--gold-soft);margin-bottom:4px;}
.cb-name small{display:block;font-weight:400;color:var(--text-dim);font-size:10px;}
.cb-races{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.cb-race{background:var(--panel-2);border-radius:4px;padding:4px 6px;font-size:11px;line-height:1.35;}
.cb-race b{display:block;font-size:11px;}
.cb-race small{color:var(--text-dim);font-size:10px;}
.cb-race span{display:block;color:var(--gold-soft);font-size:10px;}
.cb-race.won{box-shadow:0 0 0 1px var(--gold) inset;}
.news-item.feat{color:var(--gold-soft);font-weight:700;}
.npc-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 10px;margin-bottom:5px;cursor:pointer;font-family:inherit;}
.npc-rank{width:20px;text-align:center;color:var(--gold-soft);font-weight:700;font-family:'Shippori Mincho',serif;}
.npc-main{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;}
.npc-main small{flex-basis:100%;font-size:10px;color:var(--text-dim);}
.npc-cat{font-size:11px;color:var(--text-dim);margin:6px 0 3px;}
.npc-hall{font-size:12px;padding:4px 0;border-top:1px dashed var(--line);}
.npc-hall small{display:block;color:var(--text-dim);font-size:10px;}
.rv-tag{font-size:10px;border-radius:3px;padding:0 5px;font-weight:700;}
.rv-tag.rival{color:#cfe9ff;border:1px solid #6E8FD8;background:rgba(110,143,216,.18);}
.rv-tag.nemesis{color:#fff;background:#b8342a;border:1px solid #ff8a7a;}
.cb-race span i{font-style:normal;color:var(--text-dim);}
.mk{display:inline-block;font-size:10px;font-weight:700;color:#f0cf8a;margin-right:3px;letter-spacing:-.02em;}
.mk.cc{color:#cfe9ff;border:1px solid #6E8FD8;border-radius:3px;padding:0 3px;}
.mk-legend{font-size:10px;color:var(--text-dim);margin:-6px 0 8px;line-height:1.5;}
.small-farm-tag{font-size:11px;color:var(--gold-soft);padding:0 0 6px;}
.mk-price{font-family:'Shippori Mincho',serif;font-weight:700;color:var(--gold);font-size:16px;}
.buy-btn{
  width:100%;margin-top:8px;padding:9px;border-radius:3px;border:1px solid var(--gold);
  background:none;color:var(--gold-soft);font-weight:700;font-size:13px;font-family:'Noto Sans JP',sans-serif;
}
.buy-btn:disabled{opacity:.35;}

.empty-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 20px;line-height:1.8;}

/* ---------- News ---------- */
.news-item{
  border-left:2px solid var(--line);padding:6px 0 6px 12px;margin-bottom:2px;font-size:13px;color:var(--text-dim);
  line-height:1.6;
}
.news-item .wk{color:var(--gold);font-weight:700;margin-right:6px;font-size:11px;}
.news-item.win{border-left-color:var(--win);color:var(--text);}
.news-item.money-in{color:var(--win);}
.news-item.money-out{color:var(--loss);}

/* ---------- Bottom action bar ---------- */
.bottombar{
  position:sticky;bottom:0;background:linear-gradient(0deg,#0F1530,rgba(15,21,48,.97));
  border-top:2px solid var(--gold);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;z-index:20;
}
.advance-btn{
  flex:1;background:var(--gold);color:#1A1204;font-weight:800;font-size:15px;
  border:none;border-radius:4px;padding:13px 0;font-family:'Shippori Mincho',serif;letter-spacing:.05em;
}
.advance-btn:active{background:var(--gold-soft);}
.races-hint{font-size:11px;color:var(--text-dim);flex:none;max-width:110px;line-height:1.4;}

/* ---------- Modal (weekly report / races) ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,8,18,.88);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-box{
  width:100%;max-width:520px;background:var(--panel);border-top:2px solid var(--gold);
  border-radius:14px 14px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
}
.modal-title{font-family:'Shippori Mincho',serif;font-size:18px;color:var(--gold-soft);margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px;}

.track{
  position:relative;width:100%;aspect-ratio:480/240;
  border-radius:8px;overflow:hidden;border:1px solid var(--dirt-light);
  background:#0F1530;margin-bottom:14px;
}
.track-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.lane-marker{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  font-size:16px;white-space:nowrap;will-change:left,top;
}
.lane-marker.you{filter:drop-shadow(0 0 3px var(--gold));}
.lane-marker span.tag{
  font-size:9px;background:rgba(0,0,0,.6);color:#fff;padding:1px 4px;border-radius:2px;margin-left:3px;
  vertical-align:middle;
}

.race-cond{font-size:12px;color:var(--gold-soft);background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-bottom:10px;line-height:1.6;}
.race-cond small{color:var(--text-dim);}
.style-tag{display:inline-block;font-size:10px;background:rgba(255,255,255,.12);border-radius:3px;padding:0 4px;color:var(--text);}
.style-line{color:var(--text-dim);font-size:10px;}
.race-board{background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
.rb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-variant-numeric:tabular-nums;}
.rb-clock{font-weight:700;color:var(--gold-soft);}
.rb-rem{color:var(--text-dim);}
.rb-skip{background:var(--gold);border:1px solid var(--gold);color:#1a1a1a;font-weight:700;border-radius:4px;font-size:12px;padding:4px 10px;cursor:pointer;}
.race-ctl{display:flex;gap:6px;align-items:center;margin:8px 0;}
.ctl-label{font-size:11px;color:var(--text-dim);white-space:nowrap;}
.ctl-btn{flex:1;background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:4px;font-size:12px;padding:5px 4px;cursor:pointer;}
.ctl-btn.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(232,185,75,.12);}
.rb-row{display:flex;justify-content:space-between;gap:6px;padding:1px 0;}
.rb-row.you{color:var(--gold-soft);font-weight:700;}
.rb-gap{color:var(--text-dim);font-weight:400;font-variant-numeric:tabular-nums;}
.race-comm{min-height:44px;font-size:13px;line-height:1.5;margin-bottom:10px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(255,255,255,.04);}
.race-comm .old{color:var(--text-dim);font-size:11px;}
.pace-note{font-size:11px;color:var(--text-dim);margin:6px 0 8px;line-height:1.6;}
.rt-sub{font-size:10px;color:var(--text-dim);font-weight:400;}
.result-table td.best{color:#ff8a8a;font-weight:700;}
.result-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px;}
.result-table th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line);}
.result-table td{padding:6px;border-bottom:1px solid var(--line);}
.result-table tr.you td{color:var(--gold-soft);font-weight:700;}
.rank-medal{font-size:14px;}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px;}
.summary-cell{background:var(--panel-2);border-radius:4px;padding:10px;}
.summary-cell .lbl{font-size:11px;color:var(--text-dim);}
.summary-cell .val{font-size:16px;font-weight:800;font-family:'Shippori Mincho',serif;}
.summary-cell .val.win{color:var(--win);}
.summary-cell .val.loss{color:var(--loss);}

.modal-notice{background:var(--panel-2);border-left:3px solid var(--gold);padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.6;border-radius:0 4px 4px 0;}

.modal-next{
  width:100%;background:var(--gold);color:#1A1204;font-weight:800;border:none;border-radius:4px;
  padding:13px 0;font-size:14px;font-family:'Shippori Mincho',serif;margin-top:6px;
}

.gameover-box{text-align:center;padding:10px 6px;}

.entry-list{max-height:230px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:4px;}
.entry-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);}
.entry-row:last-child{border-bottom:none;}
.entry-row.selected{background:rgba(232,185,75,.15);}
.entry-gate{
  width:22px;height:22px;flex:none;background:var(--dirt);color:var(--gold-soft);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
}
.entry-name{flex:1;font-size:13px;}
.entry-name b{color:var(--gold-soft);}
.entry-odds{font-size:12px;color:var(--gold);text-align:right;line-height:1.3;white-space:nowrap;}
.entry-odds small{color:var(--text-dim);font-weight:400;}
.bet-type-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.bet-type-row .act-btn{flex:1 1 30%;text-align:center;}
.bet-amount-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:stretch;}
.bet-amount-input{
  flex:1 1 140px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:9px 10px;font-size:14px;font-family:'Noto Sans JP',sans-serif;
}
.pick-order{font-size:10px;color:var(--gold);margin-left:5px;}
.bet-summary{font-family:'Shippori Mincho',serif;font-size:16px;color:var(--gold-soft);text-align:center;margin-bottom:10px;}
.bet-result{text-align:center;padding:10px;border-radius:4px;margin:10px 0;font-size:14px;font-weight:700;}
.bet-result.hit{background:rgba(95,174,126,.15);color:var(--win);border:1px solid var(--win);}
.bet-result.miss{background:rgba(216,105,90,.12);color:var(--loss);border:1px solid var(--loss);}
.bet-cart{background:var(--panel-2);border-radius:4px;padding:8px 10px;margin-bottom:10px;}
.bet-cart-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);padding:5px 0;border-bottom:1px solid var(--line);gap:8px;}
.bet-cart-row:last-of-type{border-bottom:none;}
.bet-cart-cancel{flex:none;font-size:11px;color:var(--loss);background:none;border:1px solid var(--loss);border-radius:3px;padding:3px 8px;}
.result-table-wrap{max-height:230px;overflow-y:auto;margin-bottom:6px;}
.gameover-box h2{color:var(--loss);font-size:22px;margin-bottom:6px;}
.restart-btn{
  margin-top:16px;background:var(--gold);color:#1A1204;font-weight:800;border:none;border-radius:4px;

/* せりに出る馬は中央(JRA)で勝ち上がれず地方へ移籍してきた、という設定の
   在籍時代の戦績(フレーバー)。1着(勝利)は出ないようにしてある。 */
const JRA_PAST_LABELS=["2歳新馬","2歳未勝利","3歳未勝利","3歳1勝クラス","4歳上未勝利"];
function generatePastHistory(age){
  const numStarts=clamp(randInt(1,3)+Math.max(0,age-2)*randInt(1,3),1,20);
  const hist=[];
  for(let i=0;i<numStarts;i++){
    const fieldSize=randInt(10,18);
    const rank=randInt(2,fieldSize);
    hist.push({label:JRA_PAST_LABELS[randInt(0,JRA_PAST_LABELS.length-1)],rank,fieldSize});
  }
  return hist;
}

/* サマーセール専用馬。中小牧場ゆえ能力は控えめだが、稀に大物が混じる。 */
function makeSummerSaleHorse(){
  const h=makeHorse(randInt(2,5),false);
  h.smallFarm=true;
  const isGem=Math.random()<0.08;
  if(isGem){
    ['speed','stamina','guts'].forEach(stat=>{h[stat]=clamp(h[stat]+randInt(8,18),10,99);});
    if(!h.uniqueSkill && Math.random()<0.5) h.uniqueSkill=UNIQUE_SKILLS[randInt(0,UNIQUE_SKILLS.length-1)].key;
  } else {
    ['speed','stamina','guts'].forEach(stat=>{h[stat]=clamp(h[stat]-randInt(5,15),10,99);});
  }
  h.price=Math.round(h.price*0.55);
  return h;
}

   セカンドセール: ミックスセールの売れ残りや、零細牧場の庭先取引で売れなかった馬が並ぶ。数百万〜数千万円。

function saleFarm(size){const l=SALE_FARMS[size];return {size,name:l[randInt(0,l.length-1)]};}
function manYen(manMin,manMax,skew,unitMan){

}

function makeMixSaleHorse(){

  if(tier==='elite'||tier==='good'){

const STUD_STATION_BY_KEY=Object.fromEntries(STUD_STATIONS.map(s=>[s.key,s]));
function isG1Grade(g){return g==='JpnI'||/G1/.test(g||'');}
function gradeSummary(h){
  const wins=(h.history||[]).filter(r=>r.rank===1&&r.grade);
  const g1=wins.filter(r=>isG1Grade(r.grade)).length;
  return {wins,g1,graded:wins.length,other:wins.length-g1};
}
function studScore(h){
  const g=gradeSummary(h);
  const stat=clamp((h.speed+h.stamina+h.guts)/3,0,100);
  let sc=g.g1*50+g.other*14+stat*0.4+Math.min(h.wins,15)*0.8;
  if(h.uniqueSkill) sc+=6;
  if(typeof TOP_SIRES!=='undefined' && TOP_SIRES.includes(h.sireName)) sc+=4;
  return Math.round(sc);
}
function sireEligible(h){const g=gradeSummary(h);return h.sex==='牡'&&(g.g1>=1||g.graded>=2);}
function studBasePrice(score){return Math.max(3000000,Math.round(Math.pow(Math.max(score-20,1),1.7)*250000/1000000)*1000000);}
function mareBasePrice(score){return Math.max(1000000,Math.round(Math.pow(Math.max(score-15,1),1.6)*90000/500000)*500000);}
function buildOffers(h,kind){
  const score=studScore(h);
  const unit=kind==='sire'?1000000:500000;
  const base=kind==='sire'?studBasePrice(score):mareBasePrice(score);
  const list=kind==='sire'?STUD_STATIONS:BROODMARE_FARMS;
  return list.map(st=>({st,ok:score>=st.minScore,price:Math.max(unit,Math.round(base*st.priceMult*(0.96+Math.random()*0.08)/unit)*unit)}));
}
function openRetireOffer(h,kind){

/* ---- 産駒シミュレーション(毎年1月1日に1年ぶん進む) ---- */
function pickProgenyRace(q){
  const pool=[...GRADE_RACES,...JRA_RACES,...JRA_TURF_RACES,...OVERSEAS_RACES,...OVERSEAS_TURF_RACES];
  const w=pool.map(g=>isG1Grade(g.tier)?3*(0.4+2.4*q):g.tier==='JpnII'?6:10);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return {race:pool[i].name,grade:pool[i].tier};}
  return {race:pool[0].name,grade:pool[0].tier};
}
function foalName(){return PREFIXES[randInt(0,PREFIXES.length-1)]+SUFFIXES[randInt(0,SUFFIXES.length-1)];}
function processSire(st,N,report){
  st.age+=1;
  const stn=STUD_STATION_BY_KEY[st.stationKey];
  const prev=st.matings.find(m=>m.y===N-1);
  if(prev){
    prev.foals=Math.round(prev.mares*(0.78+Math.random()*0.08));
    if(prev.foals>0){
      const wr=clamp(0.30+0.40*st.q+stn.mareBonus+(Math.random()-0.5)*0.12+(st.cohorts.length===0?0.03:0),0.18,0.8);
      st.cohorts.push({foalYear:N,foals:prev.foals,wr,runners:0,winners:0,graded:0,g1:0,wins:0});
      report.push({type:'notice',text:`🍼 ${st.name}の産駒${prev.foals}頭が誕生した(種付${prev.mares}頭)。`});
    }
  }
  let gradeThisYear=0,g1ThisYear=0;
  const rt=[0.58,0.82,0.88],wf=[0.55,0.88,1.0];
  st.cohorts.forEach(c=>{
    const a=(N-1)-c.foalYear;
    if(a<2||a>4) return;
    const oldRunners=c.runners;
    c.runners=Math.round(c.foals*rt[a-2]);
    c.winners=Math.round(c.runners*c.wr*wf[a-2]);
    c.wins=Math.round(c.winners*1.9);
    if(a===2&&!c.spawned&&S.npcs){c.spawned=true;const k=clamp(Math.round(c.foals/45),1,4);const stn3=STUD_STATION_BY_KEY[st.stationKey];
      for(let i=0;i<k;i++) spawnOffspringNpc(st.name,null,2,stn3&&stn3.tier==='S'&&Math.random()<0.7?'jra':(Math.random()<0.35?'jra':'local'),st.q,{type:'sire',label:`${st.name}産駒`});}
    if(a===2) report.push({type:'notice',text:`🏇 ${st.name}の${c===st.cohorts[0]?'初年度産駒':'産駒(第'+(st.cohorts.indexOf(c)+1)+'世代)'}が2歳シーズンを終えた。ここまで出走${c.runners}頭、勝ち上がり${c.winners}頭(${Math.round(c.winners/Math.max(1,c.runners)*100)}%)。`});
    const exp=(c.runners-oldRunners)*0.012*(0.35+1.65*st.q*st.q)*(a===3?1.3:a===2?0.7:1)*(1+stn.mareBonus*2);
    let n=Math.floor(exp)+(Math.random()<exp%1?1:0);
    for(let i=0;i<n;i++){
      const pr=pickProgenyRace(st.q);
      st.notable.push({name:foalName(),sex:Math.random()<0.5?'牡':'牝',race:pr.race,grade:pr.grade,y:N-1});
      c.graded++;gradeThisYear++;
      if(isG1Grade(pr.grade)){c.g1++;g1ThisYear++;}
      if(report.filter(r=>r.type==='notice'&&r.sireId===st.id).length<2){
        report.push({type:'notice',sireId:st.id,text:`🏆 ${st.name}の産駒${st.notable[st.notable.length-1].name}が${pr.race}(${pr.grade})を制覇!`});
      }
    }
  });
  // 人気は産駒の活躍で上下し、種付料にも反映される
  if(st.cohorts.some(c=>(N-1)-c.foalYear>=2)){
    // 産駒の活躍で人気が動き、初期評価(pop0)へ少しずつ戻る。15歳を過ぎると緩やかに落ちる
    const perf=g1ThisYear>0?0.12:gradeThisYear>0?0.05:-0.05;
    const drift=(st.pop0-st.pop)*0.25;
    const ageD=st.age>=15?0.97:1;
    const oldFee=st.fee;
    st.pop=clamp((st.pop*(1+perf)+drift)*ageD,0.15,2.2);
    st.fee=Math.max(200000,Math.round(st.fee0*st.pop/st.pop0/100000)*100000);
    const ch=oldFee?st.fee/oldFee-1:0;
    if(Math.abs(ch)>=0.2) report.push({type:'notice',text:`💴 ${st.name}の種付料が${yen(oldFee)} → ${yen(st.fee)}(${ch>0?'+':''}${Math.round(ch*100)}%)`});
  }
  if(st.age<=20){
    const stn2=STUD_STATION_BY_KEY[st.stationKey];
    const mares=Math.round(clamp(stn2.mares*st.pop*(0.9+Math.random()*0.2)*(st.age>15?0.9:1),5,260));
    st.matings.push({y:N,mares,foals:0});
  }
}
const SIRE_QUALITY=name=>(typeof STALLION_BY_NAME!=='undefined'&&STALLION_BY_NAME[name])?stallionQ(STALLION_BY_NAME[name]):(typeof TOP_SIRES!=='undefined'&&TOP_SIRES.includes(name))?0.8:0.55;
function processDam(d,N,report){
  d.age+=1;
  if(d.owned) return; // 自己所有の繁殖牝馬は牧場タブで自分で配合する
  if(d.pregnant){
    if(Math.random()<0.88){
      const sq=SIRE_QUALITY(d.pregnant.sire);
      const mq=clamp(d.q*0.5+sq*0.5,0.1,1);
      const runs=Math.random()<0.88;
      const win=runs&&Math.random()<clamp(0.25+0.5*mq+(Math.random()-0.5)*0.15,0.15,0.8);
      const winAge=win?[2,2,3,3,3,4][randInt(0,5)]:null;
      let grade=null;
      if(win&&Math.random()<0.015+0.07*mq*mq){
        const pr=pickProgenyRace(mq);
        grade={race:pr.race,grade:pr.grade,age:winAge+randInt(0,1)};
      }
      const fo={name:foalName(),sex:Math.random()<0.5?'牡':'牝',sire:d.pregnant.sire,y:N,
        outcome:{runs,winAge,wins:win?randInt(1,4):0,grade}};
      d.foals.push(fo);
      if(runs&&S.npcs){ // 送り出した繁殖牝馬の子は、他厩舎の馬として実際に走る
        const n=spawnOffspringNpc(fo.sire,d.name,0,mq>0.6?'jra':'local',mq,{type:'dam',label:`${d.name}の子`});
        if(!npcUsedNames().has(fo.name)||n.name===fo.name) n.name=fo.name; else fo.name=n.name;n.sex=fo.sex;
      }
    }
    d.pregnant=null;
  }
  d.foals.forEach(f=>{
    const g=f.outcome.grade;
    if(g && !g.shown && f.y+g.age===N-1){
      g.shown=true;
      report.push({type:'notice',text:`🏆 ${d.name}の産駒${f.name}(父${f.sire})が${g.race}(${g.grade})を制覇!`});
    }
  });
  if(d.age<=19 && N>=d.soldYear+1){
    d.pregnant={sire:STALLIONS[randInt(0,STALLIONS.length-1)].name};
  }
}
function processBreedingYear(N,report){
  (S.retired||[]).forEach(r=>{
    if(r.kind==='sire') processSire(r,N,report);
    else processDam(r,N,report);
  });
}
function sireTotals(st){
  const t={foals:0,runners:0,winners:0,graded:0,g1:0,wins:0,mares:0};
  st.matings.forEach(m=>{t.mares+=m.mares;t.foals+=m.foals;});
  st.cohorts.forEach(c=>{t.runners+=c.runners;t.winners+=c.winners;t.graded+=c.graded;t.g1+=c.g1;t.wins+=c.wins;});
  return t;
}
function damTotals(d){
  const N=calendarParts(S.week).yearIndex;
  const t={foals:d.foals.length,runners:0,winners:0,graded:0};
  d.foals.forEach(f=>{
    const age=N-f.y;
    if(age>=2&&f.outcome.runs) t.runners++;
    if(f.outcome.winAge&&age>=f.outcome.winAge) t.winners++;
    if(f.outcome.grade&&age>=f.outcome.grade.age) t.graded++;
  });
  return t;
}
function pct(a,b){return b>0?Math.round(a/b*1000)/10+'%':'-';}
function retiredAvatarHtml(r,size){return `<div class="horse-avatar" style="width:${size}px;height:${size}px;">${horseIconSVG({coat:r.coat,blaze:r.blaze})}</div>`;}

function gradeOfRace(r){
  const m=/\((JpnIII|JpnII|JpnI|JRA・G[123]|海外・G[123])/.exec(r.name||'');
  return m?m[1]:null;
}

    }
    if(r.notable.length>0){

      const nrows=[...r.notable].reverse().map(n=>`<tr><td>${n.name}(${n.sex})</td><td>${n.race} ${gradeBadge(n.grade)}</td><td>開業${n.y}年目</td></tr>`);

    if(r.pregnant) box.appendChild(el(`<div class="modal-sub">今年の種付け相手:${r.pregnant.sire}(来年の誕生を待つ)</div>`));
    if(r.owned) box.appendChild(el(`<div class="modal-sub">🏡 自己所有の繁殖牝馬です。配合と産駒は「牧場」タブで管理します(産駒 ${(r.produce||[]).length}頭)。</div>`));
    else if(r.foals.length===0) box.appendChild(el(`<div class="modal-sub">初子は開業${r.soldYear+2}年目に誕生する予定です。</div>`));
    const rows=[...r.foals].reverse().map(f=>{
      const age=N-f.y,o=f.outcome;

      if(age<2) st=age<1?'当歳':'1歳(育成中)';
      else if(!o.runs) st=age>=3?'未出走(競走馬登録せず)':'デビュー前';

      return `<tr><td>${f.name}(${f.sex})</td><td>${f.sire}</td><td>${f.y}年目生</td><td>${st}</td></tr>`;

  close.onclick=()=>{retiredDetailId=null;render();};
  box.appendChild(close);

function pedigreeCrosses(ped){

  const crossPos=new Map();
  multi.forEach(([n,l])=>l.forEach(e=>crossPos.set(e.pos,n)));

const CUSTOM_SHAPES={

function ovalPoint(s,H,r){
  const arc=Math.PI*r;
  if(s<H) return {x:-H/2+s,y:r};
  s-=H;
  if(s<arc){const th=Math.PI/2-s/r;return {x:H/2+r*Math.cos(th),y:r*Math.sin(th)};}
  s-=arc;
  if(s<H) return {x:H/2-s,y:-r};
  s-=H;
  const th=-Math.PI/2-s/r;return {x:-H/2+r*Math.cos(th),y:r*Math.sin(th)};
}
/* 最終コーナー出口を起点に、走る向きへ1周ぶんの中心線を作る */
function buildLoop(venueKey,surface){
  const v=VENUES[venueKey]||VENUES.ooi;
  const c=surface==='turf'?(v.turf||v.dirt):(v.dirt||v.turf);
  const L=c.L,S=c.S;
  let raw=[];
  if(v.shape&&CUSTOM_SHAPES[v.shape]){
    const P=CUSTOM_SHAPES[v.shape].map(p=>({x:p[0]*1.6,y:p[1]}));
    const n=P.length;
    for(let i=0;i<n;i++){
      const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
      for(let k=0;k<24;k++){
        const t=k/24,t2=t*t,t3=t2*t;
        raw.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                  y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});
      }
    }
  } else {
    let H=S+Math.max(50,S*0.22),r=(L-2*H)/(2*Math.PI);
    if(r<L*0.06){r=L*0.06;H=(L-2*Math.PI*r)/2;}
    for(let i=0;i<360;i++) raw.push(ovalPoint(i/360*L,H,r));
    if(v.dir==='R') raw=raw.map(p=>({x:-p.x,y:p.y})); // 右回りは左右反転(直線を右→左に走る)
  }
  const cum=[0];
  for(let i=1;i<=raw.length;i++){const a=raw[i-1],b=raw[i%raw.length];cum.push(cum[i-1]+Math.hypot(b.x-a.x,b.y-a.y));}
  const k=L/cum[raw.length];
  return {v,L,S,raw,cum:cum.map(x=>x*k)};
}

function wakuOf(g,n){

  return Object.assign({waku:Math.min(8,w)},WAKU_COLORS[Math.min(8,w)]);
}

function makeCourseView(venueKey,surface,dist){
  const loop=buildLoop(venueKey,surface);
  const VW=480,VH=240,pad=24,W=14;
  const xs=loop.raw.map(p=>p.x),ys=loop.raw.map(p=>p.y);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((VW-2*pad)/(maxx-minx),(VH-2*pad)/(maxy-miny));
  const ox=(VW-(maxx-minx)*sc)/2,oy=(VH-(maxy-miny)*sc)/2;
  const P=loop.raw.map(p=>({x:(p.x-minx)*sc+ox,y:(p.y-miny)*sc+oy}));
  const N=P.length,cum=loop.cum,L=loop.L;
  const at=s0=>{
    const s=((s0%L)+L)%L;
    let lo=0,hi=N-1;
    while(lo<hi){const mid=(lo+hi+1)>>1;if(cum[mid]<=s)lo=mid;else hi=mid-1;}
    const a=P[lo],b=P[(lo+1)%N],t=(s-cum[lo])/((cum[lo+1]-cum[lo])||1);
    let tx=b.x-a.x,ty=b.y-a.y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
    return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,nx:-ty,ny:tx};
  };
  const d='M'+P.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join('L')+'Z';
  const fin=at(loop.S),st=at(loop.S-dist);
  const turf=surface==='turf';
  const fl=(p,len)=>`${(p.x-p.nx*len).toFixed(1)},${(p.y-p.ny*len).toFixed(1)} ${(p.x+p.nx*len).toFixed(1)},${(p.y+p.ny*len).toFixed(1)}`;
  const cx=(Math.min(...P.map(p=>p.x))+Math.max(...P.map(p=>p.x)))/2,cy=(Math.min(...P.map(p=>p.y))+Math.max(...P.map(p=>p.y)))/2;
  const v=loop.v;
  const svg=`<svg viewBox="0 0 ${VW} ${VH}" class="track-svg" xmlns="http://www.w3.org/2000/svg">
    <path d="${d}" fill="#22472f"/>
    <path d="${d}" fill="none" stroke="#f2f2f2" stroke-width="${W+3}" stroke-linejoin="round"/>

    <polyline points="${fl(fin,W/2+4)}" stroke="#fff" stroke-width="3.5"/>

    <text x="${cx.toFixed(1)}" y="${(cy+12).toFixed(1)}" text-anchor="middle" font-size="10" fill="#cfd6c8">${v.dir==='R'?'右回り':'左回り'}・${turf?'芝':'ダート'}${dist}m・直線${loop.S}m</text>
    <text x="${(fin.x).toFixed(1)}" y="${(fin.y+W+10).toFixed(1)}" text-anchor="middle" font-size="9" fill="#fff">ゴール</text>
    <text x="${(st.x).toFixed(1)}" y="${(st.y-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="#ffcf5a">スタート</text>
  </svg>`;
  return {svg,W,horsePos:(x,lane)=>{const p=at(loop.S-dist+x);return {x:(p.x+p.nx*lane)/VW*100,y:(p.y+p.ny*lane)/VH*100};}};
}

/* ================= インブリードの影響(能力↑・気性難・体質弱) ================= */
function inbreedScore(h){
  ensurePedFict(h);
  // 影響が出るのは父系・母系の両方に、4代以内を含む近いクロス(4×4より濃い)。5代目同士のような薄いクロスは数えない
  return pedigreeCrosses(buildPedigree(h)).filter(c=>c.both&&c.closest<=8).reduce((s,c)=>s+c.pct,0);
}
function applyInbreedTraits(h){
  if(h.ibApplied) return;
  const ib=Math.min(40,inbreedScore(h));
  h.inbreed=Math.round(ib*100)/100;
  const sp=Math.round(ib*0.25),st=Math.round(ib*0.15);
  h.ibBonus={sp,st};
  const up=(v,g)=>v>=99?v:Math.min(99,v+g);
  h.speed=up(h.speed,sp);h.guts=up(h.guts,sp);h.stamina=up(h.stamina,st);
  const bt=h.inheritT?h.temper:randInt(15,50),bf=h.inheritT?h.frail:randInt(15,50); // 産駒は父母から受け継いだ気性・体質が基準
  h.temper=clamp(bt+Math.round(ib*1.0)+randInt(-5,5),0,100);
  h.frail=clamp(bf+Math.round(ib*0.9)+randInt(-5,5),0,100);
  // 腱: 濃いインブリードは腱も脆くしやすい(産駒は父母の腱を基準に)
  const bn=h.inheritT?tendonOf(h):randInt(15,50);
  h.tendon=clamp(bn+Math.round(ib*0.8)+randInt(-5,5),0,100);
  h.ibApplied=true;
}
function temperLabel(v){v=v==null?35:v;return v<30?'素直':v<55?'普通':v<75?'やや気性難':'気性難';}
function frailLabel(v){v=v==null?35:v;return v<30?'丈夫':v<55?'普通':v<75?'やや弱い':'体質が弱い';}
function tendonLabel(v){v=v==null?35:v;return v<30?'強い':v<55?'普通':v<75?'やや弱い':'脆い';}
function tendonOf(h){if(h.tendon==null)h.tendon=randInt(15,50);return h.tendon;}
function traitLineHtml(h){
  return ` 気性:<b>${temperLabel(h.temper)}</b> 体質:<b>${frailLabel(h.frail)}</b> 腱:<b>${tendonLabel(tendonOf(h))}</b> 道悪:<b>${mudLabel(ensureMud(h))}</b>`;
}

const FILLY_ONLY=['スパーキングレディーカップ','エンプレス杯','クイーン賞','阪神ジュベナイルフィリーズ'];
function eligibleRacesFor(h){
  if(h.layoff) return [];
  const hs=horseSub(h);
  const out=[];
  S.weekRaces.forEach((r,i)=>{
    let ok;
    if(r.req){ // 三冠路線:年齢・性別・実績で出走可否
      const a=r.req.age;
      ok=(a==='2'?h.age===2:a==='3'?h.age===3:a==='4+'?h.age>=4:h.age>=3)&&(!r.req.sex||h.sex===r.req.sex)&&h.wins>=r.req.min;
    }
    else if(r.classKey==='中央L') ok=h.wins>=3; // 地方馬は3勝以上で中央リステッドに出走可
    else if(r.classKey==='中央'||r.classKey==='中央芝') ok=wonJraListed(h); // 中央の重賞は、中央リステッドを勝った地方馬だけ
    else if(r.classKey==='海外'||r.classKey==='海外芝') ok=h.wins>=10;
    else if(r.classKey==='地方芝') ok=h.wins>=5;
    else if(r.classKey==='ナイター') ok=horseRegion(h)==='minami'&&h.wins>=1;
    else if(r.sub!=null) ok=r.sub===0?(h.races===0&&hs===0):(hs===0?r.sub===1:(r.sub===hs||r.sub===hs+1));
    else if(r.classKey==='重賞') ok=hs>=6;
    else ok=false;
    ok=regionEligible(h,r,ok);
    if(ok&&!r.req&&h.age<raceMinAge(r)) ok=false; // 年齢条件(2歳は古馬混合の重賞に出られない・4歳以上限定戦など)
    if(!ok&&r.crownRace&&fanVoted(h,r)&&reqAgeOk(h,r.req)) ok=true; // ファン投票上位は優先出走
    if(ok && isClassicRace(r) && !classicOk(h)) ok=false; // クラシックは登録した馬だけ
    if(ok && FILLY_ONLY.some(n=>(r.name||'').includes(n)) && h.sex!=='牝') ok=false; // 牝馬限定戦
    if(ok){
      out.push({r,i,fanVote:fanVoted(h,r),tag:fanVoted(h,r)?'ファン投票':(r.sub!=null&&r.sub>hs&&hs>0)||(r.classKey==='重賞'&&hs<8)?'格上挑戦':''});
    }
  });
  return out;
}

/* ================= 調教師のレース選び(出走判断) =================
   実際の厩舎のように、ローテーション(前走からの間隔)・状態・距離適性・クラス・賞金と費用を見て
   調教師ごとの方針で出走レースと騎手を決める。「中○週」は前走から空いた週の数。 */
const TRAINER_PLANS_EXTRA_KEYS={tj1:'t5',tj2:'t1',th1:'t4',ti1:'t3',ta1:'t2',ty1:'t2',tk1:'t4',ts1:'t5'};
const TRAINER_PLANS={
  t1:{label:'大舞台志向・中3週以上',minGap:4,minCond:72,dist:null,bigRace:true,classUp:false,cheap:false,
      note:'重賞・中央・海外を見据えて、状態が整ってから使う'},
  t2:{label:'短距離中心・中2週で使う',minGap:3,minCond:60,dist:[1000,1400],bigRace:false,classUp:false,cheap:false,
      note:'スピードを活かせる短い距離を中心に、テンポよく使う'},
  t3:{label:'中長距離・ゆったりローテ',minGap:5,minCond:70,dist:[1700,3600],bigRace:false,classUp:false,cheap:false,
      note:'1700m以上を中心に、間隔をあけてじっくり使う'},
  t4:{label:'叩いて良化・格上挑戦も',minGap:2,minCond:55,dist:null,bigRace:false,classUp:true,cheap:false,
      note:'レースを使いながら仕上げる。勝ち負けになれば格上にも挑む'},
  t5:{label:'適性重視・堅実',minGap:3,minCond:65,dist:null,bigRace:false,classUp:false,cheap:false,fitStrict:true,
      note:'距離と馬場の適性を最優先し、勝てる条件を選ぶ'},
  t6:{label:'数を使う・費用控えめ',minGap:2,minCond:50,dist:null,bigRace:false,classUp:false,cheap:true,
      note:'状態が許す限り出走。登録料と騎乗料は安く抑える'},
};
Object.entries(TRAINER_PLANS_EXTRA_KEYS).forEach(([k,v])=>{TRAINER_PLANS[k]=TRAINER_PLANS[v];});
function trainerPlanOf(t){return t?TRAINER_PLANS[t.key]||TRAINER_PLANS.t5:null;}
function lastRaceWeekOf(h){const hs=h.history||[];return hs.length?hs[hs.length-1].week:null;}
function estPowerFor(h,r){
  const base=h.speed*0.4+h.stamina*0.35+h.guts*0.25;
  const cond=0.6+0.4*(h.condition/100);
  const surf=r.surface==='turf'?(0.55+0.5*(h.turfApt/100)):(0.75+0.35*(h.dirtApt/100));
  const tb=trainerOf(h)?trainerOf(h).skill*1.2:0;
  return base*cond*surf+tb+9-Math.abs(r.dist-(h.optDist||r.dist))/100*0.7; // 9≒平均的な騎手の上乗せ
}
function pickJockeyFor(h,r,plan,pWin){
  const main=(()=>{const hs=(h.history||[]).slice(-3);const c={};hs.forEach(x=>{if(x.jockeyName)c[x.jockeyName]=(c[x.jockeyName]||0)+1;});
    const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return best?JOCKEYS.find(j=>j.name===best[0]):null;})();
  const stake=r.prize[0]*Math.max(0.05,pWin);
  let best=null,bestU=-1e18;
  JOCKEYS.forEach(j0=>{
    const j=getJockey(j0.key);
    if(!jockeyAvailable(j).ok) return;
    let u=jockeyBonus(h,j)*stake*0.012-j.fee*(plan.cheap?2.5:1);
    if(main&&main.key===j.key) u+=stake*0.03; // 主戦騎手は継続しやすい
    if(j.fee>S.money-200000) u=-1e17;
    if(u>bestU){bestU=u;best=j;}
  });
  return best?best.key:null;
}
/* 1頭ぶんの判断。{raceIdx,jockeyKey,note} か {rest:true,note} を返す */
function trainerDecide(h){
  const t=trainerOf(h);
  if(!t||h.age<2) return null;
  const P=trainerPlanOf(t);
  if(h.layoff) return {rest:true,note:`${LAYOFF[h.layoff.type].name}中(あと${h.layoff.weeks}週)`};
  if(h.injury>0) return {rest:true,note:`${h.injuryName||'故障'}の療養中(あと${h.injury}週)`};
  const last=lastRaceWeekOf(h);
  const gap=last==null?99:S.week-last;
  if(gap<P.minGap) return {rest:true,note:`前走から中${Math.max(0,gap-1)}週。${P.minGap-1>0?`中${P.minGap-1}週以上あけたい`:'間隔をあける'}`};
  if(h.condition<Math.max(40,P.minCond)) return {rest:true,note:`状態${h.condition}。${P.minCond}以上に戻るまで調整`};
  const cands=[];
  eligibleRacesFor(h).forEach(({r,i,tag})=>{
    const fee=r.entryFee+(r.travelFee||0);
    if(fee>S.money-300000) return; // 資金に余裕がない遠征・高額レースは避ける
    const pw=estPowerFor(h,r);
    const pWin=0.9/(1+Math.exp(-(pw-r.baseline-6)/6));
    const pTop3=Math.min(0.95,pWin*2.4);
    let ev=r.prize[0]*pWin+(r.prize[1]+r.prize[2])*0.5*Math.max(0,pTop3-pWin);
    let score=ev-fee*(P.cheap?1.6:1);
    const dd=Math.abs(r.dist-(h.optDist||r.dist));
    score*=1-Math.min(P.fitStrict?0.8:0.5,dd/(P.fitStrict?800:1200));
    if(r.surface==='turf') score*=clamp(h.turfApt/75,0.3,1.3); else score*=clamp(h.dirtApt/75,0.5,1.2);
    if(P.dist) score*=(r.dist>=P.dist[0]&&r.dist<=P.dist[1])?1.35:0.7;
    if(P.bigRace&&r.grade) score*=1.7;
    if(tag==='格上挑戦') score*=P.classUp?(pWin>0.15?1.15:0.7):0.55;
    if(tag==='格下') score*=0.85;
    cands.push({r,i,score,pWin,tag,fee});
  });
  const best=cands.filter(c=>c.score>0).sort((a,b)=>b.score-a.score)[0];
  if(!best) return {rest:true,note:'今週は勝ち負けになりそうなレースがない'};
  const jk=pickJockeyFor(h,best.r,P,best.pWin);
  const gapTxt=last==null?'初出走':`中${gap-1}週`;
  const why=[];
  if(P.bigRace&&best.r.grade) why.push('大舞台へ');
  if(best.tag==='格上挑戦') why.push('格上挑戦');
  if(Math.abs(best.r.dist-(h.optDist||best.r.dist))<=200) why.push('適距離');
  if(P.dist&&best.r.dist>=P.dist[0]&&best.r.dist<=P.dist[1]) why.push(P.dist[1]<=1400?'得意の短距離':'得意の中長距離');
  return {raceIdx:best.i,jockeyKey:jk,note:`${gapTxt}で${shortRaceName(best.r.name)}(${venueShortName(best.r)} ${best.r.surface==='turf'?'芝':'ダ'}${best.r.dist}m)へ${why.length?'・'+why.join('・'):''}・騎手 ${getJockey(jk).name}`};
}
/* 今週の調教師の予定を各馬に入れる。force=true(オート)のときは全頭を調教師判断に */
function planTrainerEntries(force){
  S.horses.forEach(h=>{
    if(h.age<2||!trainerOf(h)) return;
    if(!force){
      if(h.raceMode==='owner') return;
      if(h.ownerChoiceWeek===S.week) return;
      if(h.trainerPlanWeek===S.week) return;
    }
    const d=trainerDecide(h);
    h.trainerPlanWeek=S.week;
    if(!d) return;
    h.trainerNote=d.note;
    h.pendingAction=d.rest?null:{type:'race',raceIdx:d.raceIdx,jockeyKey:d.jockeyKey,by:'trainer'};
  });
}

/* ================= オート進行 ================= */
let autoSetupOpen=false;
let autoSettings={weeks:4,stopSummer:true,stopMix:true,stopSecond:true,stopOverseas:true,stopMare:true,stopMating:true};
let autoState=null;
function startAuto(){
  autoSetupOpen=false;
  autoState={total:autoSettings.weeks,done:0,startMoney:S.money,startWeek:S.week,races:0,wins:0,top3:0,prize:0,log:[],stopRequested:false,finished:false,reason:''};
  render();
  setTimeout(runAutoStep,120);
}
function runAutoStep(){
  const a=autoState;
  if(!a||a.finished) return;
  if(a.stopRequested) return finishAuto('途中で停止しました');
  if(a.done>=a.total) return finishAuto(`${a.total}週ぶん進めました`);
  planTrainerEntries(true);
  const before={summer:!!S.summerSaleActive,mix:!!S.mixSaleActive,second:!!S.secondSaleActive,os:S.osSaleActive?S.osSaleKey:null,mare:!!S.mareSaleActive,month:calendarParts(S.week).month};
  const wk=S.week;
  const report=advanceWeek({silent:true});
  a.done++;
  report.forEach(it=>{
    if(it.type!=='race') return;
    it.field.filter(f=>f.isPlayer).forEach(f=>{
      a.races++;
      if(f.rank===1) a.wins++;
      if(f.rank<=3) a.top3++;
      const p=f.rank<=3?it.prizeTable[f.rank-1]:0;
      a.prize+=p;
      a.log.push({week:wk,text:`${calendarShort(wk)} ${f.name}:${shortRaceName(it.raceName)} ${f.rank}着/${it.field.length}頭${p?`(${yen(p)})`:''}`,rank:f.rank,grade:/Jpn|G1|G2|G3/.test(it.raceName)});
    });
  });
  report.filter(it=>it.type==='notice'&&/🩹|🏆|種牡馬入り|繁殖入り/.test(it.text)).forEach(it=>a.log.push({week:wk,text:it.text,rank:0}));
  if(S.gameOver) return finishAuto('資金が尽きて経営破綻しました');
  if(!before.summer&&S.summerSaleActive&&autoSettings.stopSummer) return finishAuto('サマーセールが開幕しました');
  if(!before.mix&&S.mixSaleActive&&autoSettings.stopMix) return finishAuto('ミックスセール(1歳馬)が開幕しました');
  if(!before.second&&S.secondSaleActive&&autoSettings.stopSecond) return finishAuto('セカンドセール(1歳馬)が開幕しました');
  if(S.osSaleActive&&before.os!==S.osSaleKey&&autoSettings.stopOverseas) return finishAuto(`${(OVERSEAS_SALES.find(x=>x.key===S.osSaleKey)||{}).name}が開幕しました`);
  if(!before.mare&&S.mareSaleActive&&autoSettings.stopMare) return finishAuto('繁殖馬セールが開幕しました');
  if(before.month!==2&&calendarParts(S.week).month===2&&autoSettings.stopMating&&ownedMares().some(m=>!m.pregnant&&m.age<=20)) return finishAuto('種付けシーズンが始まりました(牧場タブで配合を決めよう)');
  if((S.pendingAdmissions||[]).length>0) return finishAuto('2歳になった馬の命名・入厩があります');
  render();
  setTimeout(runAutoStep,70);
}
function finishAuto(reason){
  autoState.finished=true;autoState.reason=reason;
  render();
}

function realRecord(r){
  const t=REAL_RECORDS[`${r.venue}|${r.surface==='turf'?'turf':'dirt'}`];
  const v=t&&t[r.dist];
  return v?{time:v[0],horse:v[1],year:v[2]+'年',real:true}:null;
}
function courseRecord(r){
  const k=recordKey(r);
  if(S&&S.records&&S.records[k]) return S.records[k]; // ゲーム内で更新された記録
  const t=REAL_RECORDS[`${r.venue}|${r.surface==='turf'?'turf':'dirt'}`];
  const v=t&&t[r.dist];
  return v?{time:v[0],horse:v[1],year:v[2]+'年',real:true}:null;
}
function fmtRecTime(t){
  const m=Math.floor(t/60),s=t-m*60;
  const dec=Math.abs(t*10-Math.round(t*10))>1e-6?2:1;
  return `${m}:${s.toFixed(dec).padStart(dec===2?5:4,'0')}`;
}
function recordText(r){
  const rc=courseRecord(r);
  return rc?`コースレコード ${fmtRecTime(rc.time)}(${rc.horse}・${rc.year})`:'コースレコード 記録なし(このレースの勝ちタイムが記録になる)';
}

/* ================= 偉業ニュース ================= */
function addFeat(report,f){
  if(!S.feats) S.feats=[];
  const item={week:S.week,...f};
  S.feats.push(item);
  if(S.feats.length>80) S.feats.shift();
  addNews(`🏆 ${f.title}`,'feat');
  report.push({type:'feat',...item});
}
function horseYearWins(h,yearIdx){
  return (h.history||[]).filter(x=>x.rank===1&&calendarParts(x.week).yearIndex===yearIdx);
}
/* レース後:レコード・三冠・地方馬の中央G1・海外G1・G1勝利数・連勝などを判定 */
function checkFeats(r,field,report,sim){
  const winner=field.find(f=>f.rank===1);
  const vName=venueOf(r).name;
  const rc=courseRecord(r);
  const short=shortRaceName(r.name).replace(/\((JRA|Jpn|海外|SI|S1|M1|M2|準重賞)[^)]*\)$/,'');
  // コースレコード
  if(!rc||winner.timeSec<rc.time-0.0001){
    if(!S.records) S.records={};
    const prev=rc;
    S.records[recordKey(r)]={time:Math.round(winner.timeSec*10)/10,horse:winner.name,year:`開業${calendarParts(S.week).yearIndex}年目`,real:false};
    if(sim) sim.events.push({t:winner.timeSec+1.2,text:prev?`なんとレコード!${vName}の${r.surface==='turf'?'芝':'ダート'}${r.dist}メートル、${prev.horse}の記録を塗り替えました!`:`これが新たなコース記録となります!`});
    if(winner.isPlayer&&prev){
      addFeat(report,{kind:'record',title:`${winner.name}、${vName}${r.surface==='turf'?'芝':'ダ'}${r.dist}mのコースレコード更新!`,
        body:`${short}で${formatRaceTime(winner.timeSec)}をマーク。${prev.year}に${prev.horse}が記録した${fmtRecTime(prev.time)}を塗り替える驚異の時計。`});
    } else if(prev) addNews(`⏱ ${vName}${r.surface==='turf'?'芝':'ダ'}${r.dist}mのレコードが${winner.name}によって更新された(${formatRaceTime(winner.timeSec)})。`,'');
  }
  if(!winner.isPlayer) return;
  const h=winner.horse;
  const yi=calendarParts(S.week).yearIndex;
  const g=r.grade||'';
  // 三冠・二冠
  crownsOfRace(r.name).forEach(tc=>{
    const won=horseYearWins(h,yi).map(x=>crownRaceOfName(x.raceName)).filter(Boolean).map(c=>c.name);
    const got=tc.races.filter(n=>won.includes(n));
    const unbeaten=(h.history||[]).every(x=>x.rank===1);
    if(got.length===3){
      addFeat(report,{kind:'crown',title:`${unbeaten?'無敗の':''}${tc.name}達成!${h.name}`,
        body:`${tc.races.join('→')}をすべて制し、${tc.name}の偉業を成し遂げた。${unbeaten?`デビューから${h.races}戦無敗のまま頂点へ。`:''}地方所属の${h.name}が歴史に名を刻んだ。`});
      if(sim) sim.events.push({t:winner.timeSec+1.8,text:`${tc.name}達成!${h.name}、歴史的瞬間です!`});
    } else if(got.length===2){
      addFeat(report,{kind:'crown2',title:`${h.name}、${tc.name}へ王手!二冠達成`,
        body:`${got.join('・')}を制して二冠。残るは${tc.races.find(n=>!got.includes(n))}。偉業へあと一つ。`});
    }
  });
  // 地方馬の中央G1 / 海外G1
  if(/JRA・G1/.test(g)) addFeat(report,{kind:'jraG1',title:`地方馬${h.name}、中央G1「${short}」制覇!`,
    body:`${vName}で中央の強豪を撃破。地方所属馬による中央G1制覇は競馬界でも語り継がれる偉業。`});
  if(/海外・G1/.test(g)){
    const arc=/凱旋門賞/.test(r.name);
    addFeat(report,{kind:'overseas',title:arc?`日本競馬の悲願!${h.name}が凱旋門賞制覇`:`${h.name}、海外G1「${short}」制覇!`,
      body:arc?`パリロンシャンの直線で欧州の強豪を退け、日本調教馬の悲願だった凱旋門賞を地方所属馬が制した。`:`${vName}で世界の強豪を破る快挙。地方競馬から世界の頂点へ。`});
  }
  // G1級の通算勝利数
  const g1n=(h.history||[]).filter(x=>x.rank===1&&isG1Grade(x.grade)).length;
  if(isG1Grade(g)&&[3,5,7,9].includes(g1n)) addFeat(report,{kind:'g1count',title:`${h.name}、G1級通算${g1n}勝!`,
    body:g1n>=7?`G1級${g1n}勝は歴史的名馬に並ぶ大記録。`:`G1級${g1n}勝目。名馬の階段を駆け上がる。`});
  // 連勝・無敗
  const hs=h.history||[];let streak=0;for(let i=hs.length-1;i>=0&&hs[i].rank===1;i--) streak++;
  if([5,8,10,13,15].includes(streak)) addFeat(report,{kind:'streak',title:`${h.name}、${streak}連勝!${streak===hs.length?'デビューから無傷':''}`,
    body:`${streak===hs.length?'デビューから一度も負けていない。':''}${streak}連勝で勢いは止まらない。`});
}

function npcUsedNames(){

function makeNpc(cat,age,used){

    owner:pickFrom(NPC_OWNERS),sire:cat==='intl'?pickFrom(FOREIGN_SIRES_US.concat(FOREIGN_SIRES_EU)):pickRealSire(),wins:0,races:0,top3:0,g1:0,graded:0,hist:[],rest:0,

function npcPower(n){return n.potential*((NPC_GROWTH[n.growth]||NPC_GROWTH.normal)[Math.min(9,Math.max(2,n.age))]||0.75);}

function npcPushHist(n,e){n.hist.push(e);if(n.hist.length>30) n.hist.shift();}
/* レースの出走馬をNPCから選ぶ(条件に合う馬を、力の近い順に少しランダムに) */
function npcEligible(n,r){
  if(n.rest>0||n.age<2) return false;
  if(r.req){const a=r.req.age;if(a==='2'&&n.age!==2) return false;if(a!=='2'&&n.age<3) return false;if(a==='3'&&n.age!==3) return false;if(a==='4+'&&n.age<4) return false;if(a==='3+'&&n.age<3) return false;if(r.req.sex&&n.sex!==r.req.sex) return false;}
  if(typeof FILLY_ONLY!=='undefined'&&FILLY_ONLY.some(x=>(r.name||'').includes(x))&&n.sex!=='牝') return false;
  const ck=r.classKey;
  if(!r.req&&n.age<raceMinAge(r)) return false; // 年齢条件
  const ovs=['meydan','kaa','gulfstream','delmar','longchamp','ascot','mooneevalley','shatin','churchill','pimlico','saratoga'].includes(r.venue);
  if(ovs) return n.cat==='intl'||(n.cat==='jra'&&npcPower(n)>=128);
  if(/ジャパンカップ/.test(r.name||'')) return n.cat==='jra'||(n.cat==='intl'&&n.turf>=70); // 国際招待
  if(ck==='中央'||ck==='中央芝'||ck==='中央L'||(ck==='三冠'&&r.surface==='turf')) return n.cat==='jra';
  if(ck==='三冠') return n.cat==='local'?npcClassIdx(n)>=1:(n.cat==='jra'&&/JpnI/.test(r.name));
  if(ck==='地方芝') return n.cat==='local'&&npcClassIdx(n)>=3;
  if(ck==='重賞') return n.cat==='local'?npcClassIdx(n)>=3:(n.cat==='jra'&&/Jpn/.test(r.name));
  if(r.sub===0) return n.cat==='local'&&n.races===0&&n.age<=3; // 新馬戦はまだ走ったことのない馬だけ
  const ri=CLASSES.findIndex(c=>c.key===ck);
  return n.cat==='local'&&ri>=0&&Math.abs(npcClassIdx(n)-ri)<=1&&(ri>0||n.age<=3);
}
function pickNpcField(r,count,exclude){
  ensureNpcWorld();
  const pool=S.npcs.filter(n=>!exclude.has(n.id)&&npcEligible(n,r));
  const scored=pool.map(n=>({n,s:Math.abs(npcPower(n)-r.baseline)+Math.random()*14})).sort((a,b)=>a.s-b.s);
  // 交流重賞の中央馬・ジャパンカップの外国馬には出走枠(上限)がある
  const localVenue=!JRA_VENUES.includes(r.venue)&&!OVERSEAS_VENUE_KEYS.includes(r.venue);
  const capCat=localVenue?'jra':/ジャパンカップ/.test(r.name||'')?'intl':null;
  const cap=localVenue?(/JpnI(?!I)/.test(r.name||'')?5:4):3;
  let capN=0;
  const out=[];
  for(const x of scored){
    if(out.length>=count) break;
    if(capCat&&x.n.cat===capCat){if(capN>=cap) continue;capN++;}
    out.push(x.n);
  }
  const used=npcUsedNames();
  while(out.length<count){ // 足りなければ、このクラスに合う新しい馬が登場
    const cat=['meydan','kaa','gulfstream','delmar','longchamp','ascot','mooneevalley','shatin','churchill','pimlico','saratoga'].includes(r.venue)?'intl':(['中央','中央芝','中央L'].includes(r.classKey)||(r.classKey==='三冠'&&r.surface==='turf'))?'jra':'local';
    const age=r.sub===0?2:r.req&&r.req.age==='2'?2:r.req&&r.req.age==='3'?3:r.req&&r.req.age==='4+'?randInt(4,6):randInt(3,5);
    const n=makeNpc(cat,age,used);
    if(r.req&&r.req.sex) n.sex=r.req.sex;
    n.potential=Math.round(r.baseline/((NPC_GROWTH[n.growth])[age]||1)+randInt(-10,10));
    if(cat==='local'){const ri=Math.max(0,CLASSES.findIndex(c=>c.key===r.classKey));n.wins=[0,1,3,6,10][ri]||n.wins;n.races=Math.max(n.races,n.wins+randInt(1,6));}
    if(r.sub===0){n.wins=0;n.races=0;n.top3=0;n.hist=[];}
    S.npcs.push(n);out.push(n);
  }
  return out;
}
/* レース後:NPCの成績とライバル関係を更新 */
function rivalStatus(rec){
  // 宿敵:大きなレースで2度以上先着された/何度も負かされている
  if((rec.bigLoss>=2&&rec.ahead>rec.behind)||(rec.met>=5&&rec.ahead>=4&&rec.ahead>=rec.behind*2)) return 'nemesis';
  // ライバル:4回以上対戦し、勝ったり負けたりの競り合いを繰り返している
  if(rec.met>=4&&rec.close>=2&&rec.ahead>=1&&rec.behind>=1&&Math.abs(rec.ahead-rec.behind)<=2) return 'rival';
  return null;
}
const RIVAL_LABEL={rival:'⚔ ライバル',nemesis:'🔥 宿敵'};
function afterRaceNpc(r,field,report){
  const players=field.filter(f=>f.isPlayer);
  field.filter(f=>f.npc).forEach(f=>{
    const n=f.npc;
    n.races++;if(f.rank===1)n.wins++;if(f.rank<=3)n.top3++;
    if(f.rank===1&&r.grade){n.graded++;if(isG1Grade(r.grade))n.g1++;}
    if(f.rank===1) notifyOriginWin(n,r,report);
    npcPushHist(n,{week:S.week,race:r.name,rank:f.rank,n:field.length,time:f.timeSec});
    n.rest=randInt(2,4);
    players.forEach(p=>{
      const h=p.horse;if(!h.rivals) h.rivals={};
      const rec=h.rivals[n.id]||(h.rivals[n.id]={name:n.name,met:0,ahead:0,behind:0,close:0,bigLoss:0,status:null});
      rec.met++;
      if(f.rank<p.rank){rec.ahead++;if((r.grade||r.crownRace)&&f.rank<=2) rec.bigLoss++;} else rec.behind++;
      if(Math.abs(f.timeSec-p.timeSec)<0.3) rec.close++;
      const st=rivalStatus(rec);
      const cnt=Object.values(h.rivals).filter(x=>x.status).length;
      if(st&&st!==rec.status&&!(rec.status==='nemesis')&&(rec.status||cnt<3)){ // ライバル・宿敵は1頭につき3頭まで
        rec.status=st;
        report.push({type:'notice',text:st==='nemesis'
          ?`🔥 宿敵誕生!${n.name}(${NPC_CAT_LABEL[n.cat]}・${n.sex}${n.age})が${h.name}の前に立ちはだかる。対戦${rec.met}回で${rec.ahead}度先着を許している。`
          :`⚔ ${n.name}(${NPC_CAT_LABEL[n.cat]}・${n.sex}${n.age})が${h.name}のライバルに!対戦${rec.met}回、${h.name}の${rec.behind}勝${rec.ahead}敗。`});
      }
    });
  });
}
/* プレイヤーが出ない週も、NPCはそれぞれレースを走っている(簡易計算) */
function npcWeekly(simulatedIds,report){
  ensureNpcWorld();
  // 重賞・G1(プレイヤーが出走しなかったレース)の勝ち馬を決める
  S.weekRaces.forEach(r=>{
    if(!(r.grade||r.crownRace)||r._simulated) return;
    // 出走馬が足りなければ、条件に合う新しい馬が登録される(どの重賞・三冠レースも毎年必ず行われる)
    const cnt=r.crownRace||isG1Grade(r.grade||'')?randInt(12,16):randInt(9,13);
    const field=pickNpcField(r,cnt,simulatedIds);
    if(!field.length) return;
    // 実力+当日の出来で着順を決める(実力上位が勝ちやすいが、毎回同じ馬にはならない)
    // あなたの馬が出るレースと同じ展開計算(脚質・ペース・出遅れ・壁・枠順)で着順を決める
    const pf=field.map(n=>{const surf=r.surface==='turf'?(0.7+0.3*n.turf/100)/0.94:(0.85+0.15*n.dirt/100)/0.97;
      return {isPlayer:false,npc:n,name:n.name,runStyle:n.runStyle,optDist:n.optDist,stamRatio:n.stamRatio,gutsRatio:n.gutsRatio,temper:n.temper,
        power:npcPower(n)*surf+randInt(-8,8)-Math.abs(r.dist-n.optDist)/100*0.7+mudPowerAdj(npcMud(n),r)};});
    for(let i=pf.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pf[i],pf[j]]=[pf[j],pf[i]];}
    pf.forEach((f,idx)=>{f.gateNo=idx+1;});
    const npcPace=assignRunStyles(pf);
    pf.forEach(setDayForm);
    simulateRace(r,pf,npcPace);
    const scored=pf.map(f=>({n:f.npc,rank:f.rank})).sort((a,b)=>a.rank-b.rank);
    scored.forEach((x,i)=>{const n=x.n,rank=x.rank;
      n.races++;if(rank<=3)n.top3++;
      npcPushHist(n,{week:S.week,race:r.name,rank,n:field.length});
      simulatedIds.add(n.id);n.rest=rank===1?randInt(3,5):randInt(2,4);});
    const win=scored[0].n;
    notifyOriginWin(win,r,report);
    win.wins++;win.graded++;
    if(isG1Grade(r.grade||'')) win.g1++;
    if(isG1Grade(r.grade||'')||r.crownRace){
      addNews(`🏇 ${shortRaceName(r.name).replace(/\((JRA|Jpn|海外|SI|S1|M1|M2|準重賞)[^)]*\)$/,'')}は${win.name}(${NPC_CAT_LABEL[win.cat]}・${win.sex}${win.age})が制した。${win.g1>1?`G1級${win.g1}勝目。`:''}`,'');
      npcCrownCheck(win,r,report);
    }
  });
  S.npcs.forEach(n=>{
    if(n.rest>0){n.rest--;return;}
    if(simulatedIds.has(n.id)) return;
    const pRun=n.cat==='local'?0.3:n.cat==='jra'?0.2:0.12;
    if(Math.random()>pRun) return;
    const p=Math.min(0.55,0.125*Math.exp((npcPower(n)+randInt(-6,6)-npcClassBase(n))/9));
    n.races++;
    const rank=Math.random()<p?1:Math.random()<Math.min(0.6,p*1.8)?randInt(2,3):randInt(4,10);
    if(rank===1)n.wins++;if(rank<=3)n.top3++;
    const label=n.cat==='local'?`${CLASSES[npcClassIdx(n)].label}(大井)`:n.cat==='jra'?['中央未勝利','中央1勝クラス','中央2勝クラス','中央3勝クラス'][Math.min(n.wins-(rank===1?1:0),9)]||'中央オープン':'海外重賞';
    npcPushHist(n,{week:S.week,race:label,rank,n:10});
    n.rest=randInt(1,3);
  });
}
function npcCrownCheck(n,r,report){
  const yi=calendarParts(S.week).yearIndex;
  crownsOfRace(r.name).forEach(tc=>{
    const won=n.hist.filter(x=>x.rank===1&&calendarParts(x.week).yearIndex===yi).map(x=>crownRaceOfName(x.race)).filter(Boolean).map(c=>c.name);
    if(tc.races.every(x=>won.includes(x))){
      addFeat(report,{kind:'npcCrown',title:`${n.name}、${tc.name}達成!(${NPC_CAT_LABEL[n.cat]})`,
        body:`${tc.races.join('→')}を制し、${tc.name}の偉業を成し遂げた。あなたの馬たちにとって最大の壁となる。`});
    }
  });
}
/* 1月1日:加齢・引退・新馬のデビュー */
function npcYearEnd(report){
  ensureNpcWorld();
  const used=npcUsedNames();
  const retired=[];
  S.npcs.forEach(n=>{
    n.age++;
    const pw=npcPower(n),cb=npcClassBase(n);
    let pRet=0;
    if(n.cat==='local') pRet=n.age>=9?1:n.age>=7?0.45:(n.age>=5&&n.races>=15&&n.wins<=1)?0.4:0.05;
    else pRet=n.age>=8?1:n.age>=6?0.5:(n.g1>=2&&n.age>=4)?0.45:n.age>=5?0.2:0.03;
    if(pw<cb-25&&n.age>=5) pRet+=0.3;
    if(Math.random()<pRet){n.retired=true;retired.push(n);}
  });
  // 頭数が増えすぎないよう、成績の振るわない年長馬から引退させる(送り出した馬・ライバルは残す)
  const keep=new Set();S.horses.forEach(h=>Object.entries(h.rivals||{}).forEach(([id,r])=>{if(r.status)keep.add(id);}));
  const alive=S.npcs.filter(n=>!n.retired);
  const CAP=300;
  if(alive.length>CAP){
    alive.filter(n=>!n.origin&&!keep.has(n.id)&&n.age>=4).sort((a,b)=>(npcPower(a)+a.g1*20+a.graded*5)-(npcPower(b)+b.g1*20+b.graded*5)).slice(0,alive.length-CAP)
      .forEach(n=>{n.retired=true;retired.push(n);});
  }
  S.npcs=S.npcs.filter(n=>!n.retired);
  retired.filter(n=>n.g1>0||n.graded>=3).forEach(n=>{
    S.npcHall.push({name:n.name,cat:n.cat,sex:n.sex,age:n.age,wins:n.wins,races:n.races,g1:n.g1,graded:n.graded,retiredWeek:S.week,
      bigWins:n.hist.filter(x=>x.rank===1&&/Jpn|G\d/.test(x.race)).map(x=>shortRaceName(x.race).replace(/\((JRA|Jpn|海外|SI|S1|M1|M2|準重賞)[^)]*\)$/,''))});
    if(S.npcHall.length>60) S.npcHall.shift();
  });
  const famous=retired.filter(n=>n.g1>0).map(n=>`${n.name}(G1級${n.g1}勝${n.sex==='牡'?'・種牡馬入り':'・繁殖入り'})`);
  // ライバル・宿敵だった馬の引退
  (S.horses||[]).forEach(h=>{Object.entries(h.rivals||{}).forEach(([id,rec])=>{
    if(rec.status&&retired.some(n=>n.id===id)) report.push({type:'notice',text:`${rec.status==='nemesis'?'🔥 宿敵':'⚔ ライバル'}だった${rec.name}が引退した。${h.name}との対戦は${rec.met}回(${h.name}の${rec.behind}勝${rec.ahead}敗)。`});
  });});
  [['local',30],['jra',14],['intl',7]].forEach(([c,k])=>{for(let i=0;i<k;i++) S.npcs.push(makeNpc(c,c==='intl'?3:2,used));});
  report.push({type:'notice',text:`新しい年。他厩舎の馬も一斉に1歳を重ねた。${retired.length}頭が引退し、新たに51頭の2歳(海外は3歳)がデビューを控える。${famous.length?`名馬の引退:${famous.slice(0,4).join('、')}`:''}`});
}

function makeOverseasSaleHorse(sale){
  const x=Math.random();
  const tier=x<0.1?'elite':x<0.4?'good':x<0.75?'mid':'low';
  const h=makeHorse(1,false);
  h.foreign={country:sale.country,code:sale.code,sale:sale.name};
  h.foreignBred=true;
  const sires=sale.region==='us'?FOREIGN_SIRES_US:FOREIGN_SIRES_EU;
  h.sireName=pickFrom(sires);
  h.damName=foreignMareName();
  do{h.damSireName=pickFrom(FOREIGN_DAMSIRES);}while(h.damSireName===h.sireName);
  h.pedFict=null;
  let [lo,hi]={elite:[70,94],good:[54,74],mid:[40,58],low:[24,46]}[tier];
  ['speed','stamina','guts'].forEach(st=>{h[st]=randInt(lo,hi);});
  if(sale.region==='us'){h.dirtApt=randInt(70,96);h.turfApt=randInt(30,60);}else{h.turfApt=randInt(72,97);h.dirtApt=randInt(30,58);}
  h.uniqueSkill=Math.random()<({elite:0.3,good:0.08,mid:0.02,low:0.01}[tier])?UNIQUE_SKILLS[randInt(0,UNIQUE_SKILLS.length-1)].key:null;
  const fx={elite:[1000000,4000000,1.8],good:[300000,1000000,1.4],mid:[100000,300000,1.2],low:[20000,100000,1.1]}[tier];
  let fp=fx[0]+Math.pow(Math.random(),fx[2])*(fx[1]-fx[0]);
  fp=Math.round(fp/(fp>=1000000?50000:fp>=100000?5000:1000))*(fp>=1000000?50000:fp>=100000?5000:1000);
  h.foreignPrice={v:fp,cur:sale.cur};
  h.price=Math.round(fp*sale.rate/10000)*10000;
  h.farm={size:tier==='elite'||tier==='good'?'big':'mid',name:sale.region==='us'?pickFrom(['Bluegrass Hills Farm','Ironwood Farm','Lexington Meadows Farm']):pickFrom(['Newmarket Park Stud','Haras de la Lune','Kildare Valley Stud'])};
  h.saleKind='overseas';
  h.saleNote=`${sale.country}・${tier==='elite'?'👑 世界的良血':tier==='good'?'⭐ 良血':tier==='mid'?'標準的な血統':'お手頃'}`;
  h.pastHistory=null;
  h.unnamed=true;
  ensurePedFict(h);
  h.name=yearlingPlaceholder(h);
  refreshHorseTraits(h);
  return h;
}

function horseMarkHtml(f,r){
  const v=r&&r.venue;
  if(OVERSEAS_VENUE_KEYS.includes(v)){
    const code=f.isPlayer?'JPN':f.npc?(f.npc.cat==='intl'?(f.npc.country||'GB'):'JPN'):'';

  const m=[];
  if(f.isPlayer){
    if(jra&&!(f.horse&&horseRegion(f.horse)==='jra')) m.push(['(地)','地方競馬所属馬']);
    else if(jra&&f.horse.fromLocal) m.push(['[地]','地方競馬出身のJRA所属馬']);
    if(f.horse&&f.horse.foreignBred) m.push(['(外)','外国産馬']);
  } else if(f.npc){
    const n=f.npc;
    if(n.cat==='intl') m.push(['[外]','外国調教馬']);
    else if(n.cat==='local'){ if(jra) m.push(['(地)','地方競馬所属馬']); }

      if(n.foreignBred) m.push(['(外)','外国産馬']);
      if(!jra) m.push(['JRA','中央競馬所属馬']);
    }

function pickCoat(){
  const total=COAT_COLORS.reduce((s,c)=>s+c.weight,0);
  let r=Math.random()*total;
  for(const c of COAT_COLORS){ if(r<c.weight) return c; r-=c.weight; }
  return COAT_COLORS[0];
}
function coatInfo(key){return COAT_COLORS.find(c=>c.key===key)||COAT_COLORS[0];}
